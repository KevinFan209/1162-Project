<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - 等待冒險</title>
    <!-- 引入與全站一致的精選像素與高質感字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <script src="js/ngrok-fetch.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
	<link rel="icon" href="static/favicon.jpg" type="image/jpeg">
    <style>
        :root {
            --pixel-border: #1e272e;
            --bee-gold: #ffc048;
            --bee-yellow: #ffdd59;
            --bee-dark: #2f3542;
            --pixel-green: #05c46b;
            --pixel-blue: #0fbcf9;
            --pixel-red: #ff3f34;
            --bg-grid: #d2dae2;
            --card-bg: #ffffff;
            --text-dark: #1e272e;
            --text-gray: #747d8c;
            --sidebar-dark: #334155;
            --sidebar-dark-shadow: #1e293b;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-grid);
            /* 像素幾何網格背景 */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 28px 28px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 頂部像素風格導覽列 */
        header {
            margin: 0 !important;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            z-index: 100;
            border: none;
            border-bottom: 4px solid var(--pixel-border);
            box-shadow: none !important;
            flex-shrink: 0;
        }

        .header-left h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            line-height: 1;
            color: var(--bee-gold);
            text-shadow: 
                2px 2px 0 var(--pixel-border),
                -1.5px -1.5px 0 var(--pixel-border),
                2px -1.5px 0 var(--pixel-border),
                -1.5px 2px 0 var(--pixel-border),
                4px 4px 0 var(--bee-dark);
            letter-spacing: 2px;
            user-select: none;
        }

        .header-right { display: flex; align-items: center; gap: 18px; }

        .player-badge {
            background: #fffdf2;
            border: 3px solid var(--pixel-border);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-dark);
            box-shadow: 3px 3px 0 #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-btn {
            background: white;
            border: 3px solid var(--pixel-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-shadow: 3px 3px 0 #000;
            transition: 0.1s;
        }
        .menu-btn:hover { background: #fffdf2; }
        .menu-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }

        .menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45); display: none; z-index: 999;
        }
        .menu-overlay.open { display: block; }

        .side-menu {
            position: fixed; top: 0; right: -320px; width: 320px; height: 100%;
            background: white; border-left: 4px solid var(--pixel-border);
            box-shadow: -8px 0 0 rgba(0,0,0,0.2);
            z-index: 1000; transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            padding: 90px 25px 35px; display: flex; flex-direction: column; gap: 14px;
        }
        .side-menu.open { right: 0; }

        .menu-item {
            padding: 14px 20px; font-weight: 900;
            color: var(--text-dark); text-decoration: none; display: flex;
            align-items: center; gap: 12px; transition: 0.1s; background: #f1f2f6;
            border: 3px solid var(--pixel-border); box-shadow: 3px 3px 0 #000;
        }
        .menu-item:hover { background: var(--bee-yellow); }
        .menu-item:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
        .menu-item.danger { margin-top: auto; color: white; background: var(--pixel-red); }

        /* 主等待室容器 */
        .lobby-main {
            height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .lobby-container {
            display: flex;
            gap: 25px;
            width: 95%;
            max-width: 1100px;
            height: 100%;
            align-items: stretch;
        }

        .main-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .room-scroll {
            background: white;
            flex: 1;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            padding: 35px 40px;
            display: flex;
            gap: 40px;
            overflow-y: auto;
        }

        .room-info-section {
            flex: 1.2;
            border-right: 3px solid var(--pixel-border);
            padding-right: 40px;
            display: flex;
            flex-direction: column;
        }

        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-3d {
            border: 3px solid var(--pixel-border);
            font-weight: 900;
            cursor: pointer;
            transition: all 0.06s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            letter-spacing: 0.5px;
        }

        .btn-3d:active {
            transform: translate(3px, 3px) !important;
            box-shadow: 0 0 0 #000 !important;
        }

        .config-tag {
            padding: 6px 14px;
            background: #dfe4ea;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--text-dark);
            margin-right: 8px;
            margin-bottom: 8px;
            display: inline-block;
        }

        .code-area {
            margin-top: 25px;
            padding: 20px;
            background: #fffdf5;
            border: 3px dashed var(--pixel-border);
            text-align: center;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.06);
        }

        .code-val {
            font-family: 'Silkscreen', 'Zen Maru Gothic', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-dark);
            letter-spacing: 5px;
            margin-top: 6px;
        }

        /* 玩家卡片 */
        .player-card {
            background: #f8fafc;
            border: 3px solid var(--pixel-border);
            box-shadow: 4px 4px 0 #000;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.1s ease;
        }

        .avatar {
            width: 48px;
            height: 48px;
            background: white;
            border: 2px solid var(--pixel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 2px 2px 0 #000;
        }

        /* 按鈕樣式 */
        .btn-start {
            width: 100%;
            padding: 16px;
            background: var(--pixel-green);
            color: white;
            box-shadow: 0 6px 0 #000;
            font-size: 1.25rem;
            margin-top: 20px;
        }
        .btn-start:hover { filter: brightness(1.05); }

        .btn-exit {
            width: 100%;
            padding: 13px;
            font-size: 1rem;
            color: white;
            margin-top: 12px;
            box-shadow: 0 5px 0 #000;
        }

        /* 像素對話彈窗 */
        #passwordModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border: 4px solid var(--pixel-border);
            box-shadow: 8px 8px 0px #000000;
            z-index: 3000;
            flex-direction: column;
            gap: 16px;
            width: 380px;
            text-align: center;
            animation: modalPop 0.15s ease-out;
        }

        @keyframes modalPop {
            from { transform: translate(-50%, -55%) scale(0.95); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }

        @media (max-width: 850px) {
            header { padding: 0 20px; }
            .room-scroll { flex-direction: column; padding: 20px; gap: 25px; }
            .room-info-section { border-right: none; padding-right: 0; border-bottom: 3px solid var(--pixel-border); padding-bottom: 25px; }
        }
    </style>
</head>
<body>

<div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="side-menu" id="sideMenu">
    <a href="profile.html" class="menu-item"><span>👤</span> 個人主頁</a>
    <a href="guide.html" class="menu-item"><span>📖</span> 遊戲說明</a>
    <a href="learn.html" class="menu-item"><span>📊</span> 學習統計</a>
    <a href="settings.html" class="menu-item"><span>⚙️</span> 遊戲設定</a>
    <a href="javascript:void(0)" onclick="handleLobbyReturn()" class="menu-item"><span>🏠</span> 返回大廳</a>
    <a href="javascript:void(0)" onclick="logout()" class="menu-item danger"><span>🚪</span> 登出遊戲</a>
</div>

<header>
    <div class="header-left"><h1>BeeRich</h1></div>
    <div class="header-right">
        <div class="player-badge">
            <span id="topPlayerName">載入中...</span>
        </div>
        <button class="menu-btn" onclick="toggleMenu()">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>
</header>

<div class="lobby-main">
    <div class="lobby-container">
        <main class="main-board">
            <div class="room-scroll">
                <div class="room-info-section">
                    <h2 id="roomTitle" style="font-weight: 900; font-size: 2rem; margin-bottom: 20px; color: var(--text-dark);">載入中...</h2>
                    <div id="configTags">
                        <span class="config-tag" id="tagMode">---</span>
                        <span class="config-tag" id="tagDiff">---</span>
                        <span class="config-tag" id="tagLaps">---</span>
                    </div>

                    <div id="codeAreaDisplay" class="code-area" style="display: none;">
                        <p style="font-size: 0.9rem; color: var(--text-dark); margin-bottom: 6px; font-weight: 900;">房間專屬邀請代碼</p>
                        <div id="roomCodeDisplay" class="code-val">------</div>
                    </div>
                    
                    <div id="flow-content" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9999; display:none; transition:0.5s; pointer-events: none;"></div>

                    <div style="margin-top: auto; padding-top: 35px;">
                        <button id="startBtn" class="btn-3d btn-start" onclick="startGame()">開始冒險</button>
                        <button id="exitBtn" class="btn-3d btn-exit" onclick="showExitConfirm()">解散房間並退出</button>
                    </div>
                </div>

                <div class="player-section">
                    <h3 style="font-weight: 900; font-size: 1.25rem; color: var(--text-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                        <span class="title-icon">👥</span>目前玩家<span class="count-badge">(<span id="playerCount">1</span>/2)</span>
                    </h3>
                    
                    <div class="player-card">
                        <div style="display: flex; align-items: center; gap: 14px;">
                            <div class="avatar">👤</div>
                            <span id="hostNameText" style="font-weight: 900; font-size: 1.1rem; color: var(--text-dark);">載入中...</span>
                        </div>
                        <span style="background: var(--bee-yellow); color: var(--text-dark); border: 2px solid var(--pixel-border); padding: 3px 8px; font-size: 0.75rem; font-weight: 900; box-shadow: 2px 2px 0 #000;">房主</span>
                    </div>

                    <div id="guestSlot" class="player-card" style="opacity: 0.5; border: 3px dashed var(--pixel-border);">
                        <div style="display: flex; align-items: center; gap: 14px;">
                            <div class="avatar" id="guestAvatar">❓</div>
                            <span id="guestNameText" style="font-weight: 900; color: var(--text-gray);">等待玩家加入...</span>
                        </div>
                        <button id="kickBtn" class="btn-3d" style="display:none; background:white; border:2px solid var(--pixel-red); color:var(--pixel-red); padding:4px 8px; font-size:0.75rem; box-shadow: 2px 2px 0 #000;" onclick="kickGuest()">請他出去</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div id="passwordModal">
    <div id="modalContent">
        <h3 id="modalTitle" style="font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif; margin-bottom: 12px; font-weight: 900; font-size: 1.4rem; color: var(--text-dark);">提示</h3>
        <p id="modalDesc" style="color: var(--text-dark); font-weight: 900; line-height: 1.6; font-size: 1rem;">確定要執行此操作嗎？</p>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 10px;">
        <button class="btn-3d" style="background: #dfe4ea; color: var(--text-dark); flex: 1; padding: 12px; box-shadow: 0 4px 0 #000;" onclick="closeCustomModal()">取消</button>
        <button id="modalConfirmBtn" class="btn-3d" style="background: var(--pixel-red); color: white; flex: 1; padding: 12px; box-shadow: 0 4px 0 #000;">確定</button>
    </div>
</div>

<script>
    const API_URL = location.origin;
    let syncTimer = null;
    let refreshTimer = null;

    // --- 1. 選單與導航控制 ---
    function toggleMenu() {
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        if (sideMenu && overlay) {
            sideMenu.classList.toggle('open');
            overlay.classList.toggle('open');
        }
    }

    // --- 2. 頁面初始化：身分驗證、資訊渲染、保活心跳 ---
    window.onload = async function() {
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        const roomData = JSON.parse(localStorage.getItem('pypoly_active_room'));

        if (!token || !username || !roomData) {
            window.location.href = 'login.html';
            return;
        }

        if (document.getElementById('topPlayerName')) {
            document.getElementById('topPlayerName').innerText = username;
        }

        startSyncLoop(username, token);

        refreshRoomStatus();
        window.refreshTimer = setInterval(refreshRoomStatus, 2000);

        const isHost = (roomData.hostId === username);
        localStorage.setItem('is_host', isHost ? 'true' : 'false');

        if (document.getElementById('roomTitle')) document.getElementById('roomTitle').innerText = roomData.name;
        if (document.getElementById('tagMode')) document.getElementById('tagMode').innerText = roomData.mode;
        if (document.getElementById('tagDiff')) document.getElementById('tagDiff').innerText = `難度: ${roomData.difficulty}`;
        if (document.getElementById('tagLaps')) document.getElementById('tagLaps').innerText = `${roomData.winLaps} 回合`;

        const codeArea = document.getElementById('codeAreaDisplay');
        if (roomData.type === 'private' || roomData.type === '私有') {
            if (codeArea) codeArea.style.display = 'block';
            if (document.getElementById('roomCodeDisplay')) {
                document.getElementById('roomCodeDisplay').innerText = roomData.code;
            }
        } else {
            if (codeArea) codeArea.style.display = 'none';
        }

        const startBtn = document.getElementById('startBtn');
        const exitBtn = document.getElementById('exitBtn');

        if (isHost) {
            startBtn.innerText = "開始冒險";
            startBtn.disabled = false;
            exitBtn.innerText = "解散房間並退出";
            exitBtn.style.background = "var(--pixel-red)";
            exitBtn.style.boxShadow = "0 5px 0 #000";
        } else {
            startBtn.innerText = "等待房主開始...";
            startBtn.disabled = true;
            startBtn.style.opacity = "0.7";
            startBtn.style.cursor = "not-allowed";
            exitBtn.innerText = "離開房間";
            exitBtn.style.background = "#64748b";
            exitBtn.style.boxShadow = "0 5px 0 #000";
        }
    };

    // --- 3. 核心功能：自定義 UI 彈窗 ---
    function showExitConfirm() {
        const isHost = localStorage.getItem('is_host') === 'true';
        const modal = document.getElementById('passwordModal');
        const overlay = document.getElementById('overlay');
        
        if (modal) {
            const modalTitle = document.getElementById('modalTitle');
            const modalDesc = document.getElementById('modalDesc');
            
            if (modalTitle) modalTitle.innerText = isHost ? "⚠️ 解散房間" : "🚪 離開房間";
            if (modalDesc) modalDesc.innerText = isHost 
                ? "解散房間將會踢出所有正在等待的玩家，確定要繼續嗎？" 
                : "您即將離開此房間，確定要返回大廳嗎？";

            const confirmBtn = document.getElementById('modalConfirmBtn');
            if (confirmBtn) {
                confirmBtn.onclick = async function() {
                    closeCustomModal();
                    await executeExit();
                };
            }

            modal.style.display = 'flex';
            if (overlay) overlay.classList.add('open');
        }
    }

    async function refreshRoomStatus() {
        const myName = localStorage.getItem('username'); 
        const rawData = localStorage.getItem('pypoly_active_room') || localStorage.getItem('room_info');
        const localData = rawData ? JSON.parse(rawData) : null;
        if (!localData) return;

        const codeArea = document.getElementById('codeAreaDisplay');
        const codeVal = document.getElementById('roomCodeDisplay');
        
        if (codeArea && codeVal) {
            if (localData.type === 'private') {
                codeArea.style.display = "block"; 
                codeVal.innerText = localData.code; 
            } else {
                codeArea.style.display = "none";
            }
        }

        try {
            const res = await fetch(`${API_URL}/rooms/verify/${localData.code}?username=${encodeURIComponent(myName)}`);
            
            if (res.status === 404) {
                clearInterval(window.refreshTimer);
                const modal = document.getElementById('passwordModal');
                document.getElementById('modalTitle').innerText = "📢 房間已解散";
                document.getElementById('modalDesc').innerText = "房主已解散房間，即將返回大廳。";
                document.getElementById('modalConfirmBtn').onclick = () => {
                    localStorage.removeItem('pypoly_active_room');
                    location.href = 'lobby.html';
                };
                modal.style.display = 'flex';
                if (document.getElementById('overlay')) document.getElementById('overlay').classList.add('open');
                return;
            }

            const latest = await res.json();
            const players = latest.players || [];
            const serverHost = latest.hostId || localData.hostId;
            const isActuallyHost = (myName === serverHost);

            const amIInRoom = players.includes(myName);
            if (!isActuallyHost && !amIInRoom) {
                clearInterval(window.refreshTimer);
                const modal = document.getElementById('passwordModal');
                document.getElementById('modalTitle').innerText = "🚪 您已被剔除";
                document.getElementById('modalDesc').innerText = "您已被房主請出房間，即將返回大廳。";
                document.getElementById('modalConfirmBtn').onclick = () => {
                    localStorage.removeItem('pypoly_active_room');
                    location.href = 'lobby.html';
                };
                modal.style.display = 'flex';
                if (document.getElementById('overlay')) document.getElementById('overlay').classList.add('open');
                return;
            }

            document.getElementById('roomTitle').innerText = latest.name || localData.name || "冒險教室";
            document.getElementById('tagMode').innerText = latest.mode || localData.mode || "標準模式";
            document.getElementById('tagDiff').innerText = `難度: ${latest.difficulty || localData.difficulty || '普通'}`;
            document.getElementById('tagLaps').innerText = `${latest.winLaps || localData.winLaps || 5} 回合`;
            document.getElementById('hostNameText').innerText = serverHost;
            document.getElementById('playerCount').innerText = players.length;

            const guestName = players.find(p => p !== serverHost);
            const guestText = document.getElementById('guestNameText');
            const guestSlot = document.getElementById('guestSlot');
            const kickBtn = document.getElementById('kickBtn');
            
            if (guestText && guestSlot) {
                if (guestName) {
                    guestSlot.style.opacity = "1";
                    guestSlot.style.border = "3px solid var(--pixel-border)";
                    guestText.innerText = (guestName === myName) ? `${guestName} (你)` : guestName;
                    guestText.style.color = "var(--text-dark)";
                    
                    if (isActuallyHost && kickBtn) {
                        kickBtn.style.display = "block";
                        kickBtn.onclick = () => kickGuest(guestName); 
                    }
                } else {
                    guestSlot.style.opacity = "0.5";
                    guestSlot.style.border = "3px dashed var(--pixel-border)";
                    guestText.innerText = "等待玩家加入...";
                    if (kickBtn) kickBtn.style.display = "none";
                }
            }

            const exitBtn = document.getElementById('exitBtn');
            const startBtn = document.getElementById('startBtn');

            if (exitBtn) {
                if (isActuallyHost) {
                    exitBtn.innerText = "解散房間並退出";
                    exitBtn.style.background = "var(--pixel-red)"; 
                    exitBtn.style.boxShadow = "0 5px 0 #000";
                    
                    if (startBtn) {
                        startBtn.innerText = "開始冒險";
                        startBtn.disabled = false; 
                        startBtn.style.opacity = "1";
                        startBtn.onclick = startGame;
                    }
                } else {
                    exitBtn.innerText = "離開房間";
                    exitBtn.style.background = "#64748b"; 
                    exitBtn.style.boxShadow = "0 5px 0 #000";
                    
                    if (startBtn) {
                        startBtn.innerText = "等待房主開始...";
                        startBtn.disabled = true; 
                        startBtn.style.opacity = "0.7";
                        startBtn.onclick = null;
                    }
                }
            }
        } catch (e) { 
            console.error("同步失敗:", e); 
        }
    }

    async function kickGuest(guestName) {
        if (!guestName) return;
        
        const rawData = localStorage.getItem('pypoly_active_room');
        const roomData = JSON.parse(rawData);
        const API_URL = location.origin;

        console.log(`🚀 發送踢人請求: 房間 ${roomData.code}, 玩家 ${guestName}`);

        try {
            const response = await fetch(`${API_URL}/rooms/kick/${roomData.code}?username=${encodeURIComponent(guestName)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            const result = await response.json();

            if (response.ok) {
                const modal = document.getElementById('passwordModal');
                document.getElementById('modalTitle').innerText = "🚫 踢出成功";
                document.getElementById('modalDesc').innerText = `玩家 ${guestName} 已被移出房間。`;
                document.getElementById('modalConfirmBtn').onclick = closeCustomModal;
                modal.style.display = 'flex';
                
                refreshRoomStatus();
            } else {
                console.error("後端拒絕請求:", result.detail);
            }
        } catch (err) {
            console.error("網路連線錯誤:", err);
        }
    }
        
    function handleLobbyReturn() {
        const isHost = localStorage.getItem('is_host') === 'true';
        
        if (isHost) {
            toggleMenu(); 
            
            const modal = document.getElementById('passwordModal');
            const overlay = document.getElementById('overlay');
            
            if (modal && overlay) {
                document.getElementById('modalTitle').innerText = "⚠️ 警告";
                document.getElementById('modalDesc').innerText = "若房主離開房間，該房間將會被直接解散，所有玩家會被踢出。確定要離開並重新建立嗎？";
                
                const confirmBtn = document.getElementById('modalConfirmBtn');
                confirmBtn.onclick = async () => {
                    closeCustomModal();
                    await executeExit();
                };
                
                modal.style.display = 'flex';
                overlay.classList.add('open');
            }
        } else {
            showExitConfirm(); 
        }
    }

    async function quitRoom() {
        const roomData = JSON.parse(localStorage.getItem('pypoly_active_room'));
        const username = localStorage.getItem('username');

        if (roomData && username) {
            try {
                await fetch(`${API_URL}/rooms/leave/${roomData.code}?username=${encodeURIComponent(username)}`, {
                    method: 'POST'
                });
                console.log(`👋 成功通知伺服器玩家 ${username} 已離開`);
            } catch (err) {
                console.error("離開房間請求失敗:", err);
            }
        }

        localStorage.removeItem('pypoly_active_room');
        localStorage.removeItem('is_host');
        
        location.replace('lobby.html');
    }

    async function executeExit() {
        if (syncTimer) {
            clearInterval(syncTimer);
            syncTimer = null;
        }

        const roomData = JSON.parse(localStorage.getItem('pypoly_active_room'));
        const myName = localStorage.getItem('username');
        const isHost = localStorage.getItem('is_host') === 'true';

        try {
            if (isHost) {
                await fetch(`${API_URL}/rooms/delete/${roomData.code}`, { method: 'DELETE' });
            } else {
                await fetch(`${API_URL}/rooms/leave/${roomData.code}?username=${encodeURIComponent(myName)}`, {
                    method: 'POST'
                });
            }
        } catch (err) {
            console.error("退出失敗", err);
        }

        localStorage.removeItem('pypoly_active_room');
        location.replace('lobby.html');
    }

    function closeCustomModal() {
        const modal = document.getElementById('passwordModal');
        const overlay = document.getElementById('overlay');
        if (modal) modal.style.display = 'none';
        if (overlay) overlay.classList.remove('open');
    }

    async function startGame() {
        const myName = localStorage.getItem('username'); 
        const token = localStorage.getItem('token');
        const rawData = localStorage.getItem('pypoly_active_room');
        const isHost = localStorage.getItem('is_host') === 'true';

        if (!isHost) return;

        let roomCode = localStorage.getItem('roomCode');
        
        if (!roomCode || roomCode === "null") {
            if (rawData) {
                try {
                    const roomObj = JSON.parse(rawData);
                    roomCode = roomObj.code;
                } catch (e) {
                    console.error("解析 pypoly_active_room 失敗:", e);
                }
            }
        }

        if (!roomCode || roomCode === "null" || !myName) {
            console.error("資料遺失 - RoomCode:", roomCode, "Username:", myName);
            alert("找不到房間代碼，請嘗試重新整理頁面！");
            return;
        }

        const pCountElem = document.getElementById('playerCount');
        const currentCount = pCountElem ? parseInt(pCountElem.innerText) : 1;
        const maxCount = 2; 

        if (currentCount < maxCount) {
            const modal = document.getElementById('passwordModal');
            const overlay = document.getElementById('overlay');
            if (modal) {
                document.getElementById('modalTitle').innerText = "⚠️ 人數不足";
                document.getElementById('modalDesc').innerText = `目前人數僅 ${currentCount}/${maxCount}，請等待勇者加入後再開始冒險！`;
                document.getElementById('modalConfirmBtn').onclick = closeCustomModal;
                modal.style.display = 'flex';
                if (overlay) overlay.classList.add('open');
            }
            
            const btn = document.getElementById('startBtn');
            btn.style.animation = "shake 0.5s";
            setTimeout(() => btn.style.animation = "", 500);
            return;
        }

        const startBtn = document.getElementById('startBtn');
        startBtn.innerText = "啟動中...";
        startBtn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/rooms/start/${roomCode}?username=${encodeURIComponent(myName)}`, { 
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (res.ok) {
                const latestData = await res.json();
                console.log("房主啟動成功，同步資料中...");
                
                localStorage.setItem('pypoly_game_snapshot', JSON.stringify(latestData));
                window.location.href = 'game.html';
            } else {
                const errData = await res.json();
                alert("啟動失敗：" + (errData.detail || "未知錯誤"));
                startBtn.innerText = "開始冒險";
                startBtn.disabled = false;
            }
        } catch (e) {
            console.error("連線錯誤:", e);
            startBtn.innerText = "開始冒險";
            startBtn.disabled = false;
        }
    }

    function startSyncLoop(username, token) {
        if (syncTimer) clearInterval(syncTimer);
        
        syncTimer = setInterval(async () => {
            try {
                let roomCode = localStorage.getItem('roomCode');
                const rawData = localStorage.getItem('pypoly_active_room');
                if ((!roomCode || roomCode === "null") && rawData) {
                    roomCode = JSON.parse(rawData).code;
                }
                if (!roomCode || roomCode === "null") return;

                const statusRes = await fetch(`${API_URL}/rooms/verify/${roomCode}?username=${encodeURIComponent(username)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (statusRes.ok) {
                    const roomData = await statusRes.json();
                    
                    const isGaming = roomData.status === 'gaming' || roomData.status === 'playing';
                    const isStarted = roomData.is_started === true;

                    if (isGaming || isStarted) {
                        console.log("🚀 平板偵測到遊戲開始，準備跳轉...");
                        
                        const localActive = JSON.parse(localStorage.getItem('pypoly_active_room') || '{}');
                        if (!roomData.name && localActive.name) {
                            roomData.name = localActive.name;
                        }
                        if (!roomData.winLaps && localActive.winLaps) {
                            roomData.winLaps = localActive.winLaps;
                        }

                        localStorage.setItem('pypoly_game_snapshot', JSON.stringify(roomData));
                        
                        clearInterval(syncTimer);
                        if (window.refreshTimer) clearInterval(window.refreshTimer);
                        
                        window.location.href = 'game.html';
                    }
                }
            } catch (err) {
                console.error("平板同步循環異常:", err);
            }
        }, 3000); 
    }

    async function logout() {
        if (syncTimer) clearInterval(syncTimer);
        const username = localStorage.getItem('username');
        if (!username) return;
        const url = `${API_URL}/auth/logout?username=${encodeURIComponent(username)}&confirm=true`;
        try { await fetch(url, { method: 'POST' }); } catch (err) {}
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>
