<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - Admin User Management</title>
    <!-- 引入與全站一致的精選像素與高質感字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
	<link rel="icon" href="/favicon.ico" type="image/jpeg">
	<style>
        :root {
            --pixel-border: #1e272e;
            --bee-gold: #ffc048;
            --bee-yellow: #ffdd59;
            --bee-dark: #2f3542;
            --pixel-green: #05c46b;
            --pixel-blue: #0fbcf9;
            --pixel-red: #ff3f34;
            --bg-grid: #d2dae2;
            --card-bg: #ffffff;
            --text-dark: #1e272e;
            --text-gray: #747d8c;
            --sidebar-dark: #2f3542;
            --sidebar-dark-shadow: #1e272e;
            --border-light: #1e272e;
            --danger-red: #ff3f34;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-grid);
            /* 像素幾何網格背景 */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 28px 28px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 頂部像素風格導覽列 */
        header {
            margin: 0 !important;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            z-index: 100;
            border: none;
            border-bottom: 4px solid var(--pixel-border);
            box-shadow: none !important;
            flex-shrink: 0;
        }

        .header-left h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            line-height: 1;
            color: var(--bee-gold);
            text-shadow: 
                2px 2px 0 var(--pixel-border),
                -1.5px -1.5px 0 var(--pixel-border),
                2px -1.5px 0 var(--pixel-border),
                -1.5px 2px 0 var(--pixel-border),
                4px 4px 0 var(--bee-dark);
            letter-spacing: 2px;
            user-select: none;
            cursor: pointer;
        }

        .header-right { display: flex; align-items: center; gap: 18px; }

        .page-tag {
            background: #fffdf2;
            border: 3px solid var(--pixel-border);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-dark);
            box-shadow: 3px 3px 0 #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Admin 主要佈局 */
        .admin-main {
            height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .admin-container {
            display: flex;
            gap: 25px;
            width: 95%;
            max-width: 1280px;
            height: 100%;
            align-items: stretch;
        }

        /* 側邊導覽欄 */
        .admin-nav {
            width: 280px;
            background: white;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0px #000;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .admin-nav h2 {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 1.35rem;
            margin-bottom: 10px;
            padding-left: 6px;
            color: var(--text-dark);
            border-bottom: 3px solid var(--pixel-border);
            padding-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .nav-link { 
            width: 100%;
            padding: 13px 16px;
            border: 3px solid var(--pixel-border);
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            color: var(--text-dark);
            transition: all 0.06s ease;
            text-decoration: none;
            box-shadow: 3px 3px 0 #000;
            user-select: none;
        }

        .nav-link:hover:not(.active) {
            background: #fffdf2;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #000;
        }

        .nav-link.active {
            background: var(--bee-yellow);
            color: var(--text-dark);
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }

        .nav-link:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 #000;
        }

        /* 右側主看板 */
        .admin-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow: hidden;
            height: 100%;
        }

        .board-header { 
            background: white;
            padding: 16px 24px;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            display: flex;
            justify-content: flex-start;
            align-items: center; 
        }

        .search-input {
            padding: 10px 16px;
            border: 3px solid var(--pixel-border);
            background: #fffdf5;
            width: 350px;
            font-weight: 900;
            font-size: 0.95rem;
            color: var(--text-dark);
            outline: none;
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.06);
        }
        .search-input:focus {
            background: #feffea;
            border-color: #000;
        }

        /* 使用者清單表格容器 */
        .user-list-container { 
            background: white;
            flex: 1;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            padding: 24px 28px; 
            overflow-y: auto;
        }

        .table-header {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 160px;
            padding: 0 24px 12px;
            font-weight: 900;
            color: var(--text-dark);
            font-size: 0.9rem;
            border-bottom: 3px solid var(--pixel-border);
            margin-bottom: 14px;
        }

        .user-row {
            background: #f8fafc;
            padding: 14px 24px;
            border: 3px solid var(--pixel-border);
            box-shadow: 4px 4px 0 #000;
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 160px;
            align-items: center;
            margin-bottom: 12px;
            transition: all 0.08s ease;
        }
        .user-row:hover {
            background: #fffdf5;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }
        
        .user-avatar {
            width: 44px;
            height: 44px;
            background: white;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
        }
        .user-id { font-weight: 900; font-size: 1.05rem; color: var(--text-dark); }
        .user-email { color: var(--text-gray); font-weight: 900; font-size: 0.9rem; }
        
        .user-status {
            display: inline-block;
            padding: 4px 10px;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            font-size: 0.8rem;
            font-weight: 900;
        }
        .status-online { background: #ebfffa; color: var(--pixel-green); }
        .status-offline { background: #dfe4ea; color: var(--text-dark); }
        .status-banned { background: #fff5f5; color: var(--pixel-red); }

        /* 按鈕樣式 */
        .action-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-icon {
            padding: 8px 14px;
            border: 2px solid var(--pixel-border);
            box-shadow: 3px 3px 0 #000;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.85rem;
            transition: 0.06s ease;
            user-select: none;
        }
        .btn-icon:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }
        .btn-edit { background: #dfe4ea; color: var(--text-dark); }
        .btn-edit:hover { background: #ced6e0; }
        .btn-ban { background: #fff5f5; color: var(--pixel-red); }
        .btn-ban:hover { background: #ffe0e0; }
        .btn-icon:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 #000; }

        /* 像素對話彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 32px 30px;
            border: 4px solid var(--pixel-border);
            box-shadow: 8px 8px 0px #000000;
            width: 420px;
            max-width: 90vw;
            text-align: center;
            animation: modalPop 0.15s ease-out;
        }

        .modal-content h2 {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--text-dark);
        }
        .modal-content p {
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 24px;
            line-height: 1.6;
            font-size: 1rem;
        }

        .modal-footer { display: flex; justify-content: center; gap: 12px; }

        .btn-3d {
            padding: 12px 26px;
            border: 3px solid var(--pixel-border);
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.06s ease;
            color: var(--text-dark);
            background: var(--bee-yellow);
            box-shadow: 0 4px 0 #000;
            user-select: none;
        }
        .btn-3d:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* 滾動條樣式 */
        .user-list-container::-webkit-scrollbar { width: 8px; }
        .user-list-container::-webkit-scrollbar-track { background: #dfe4ea; border-left: 2px solid var(--pixel-border); }
        .user-list-container::-webkit-scrollbar-thumb { background: var(--pixel-border); }

        @media (max-width: 900px) {
            header { padding: 0 20px; }
            .admin-container { flex-direction: column; height: auto; }
            .admin-nav { width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left"><h1 onclick="location.href='admin.html'">BeeRich</h1></div>
    <div class="header-right">
        <div class="page-tag"><span>👥</span> 管理後台中心</div>
    </div>
</header>

<div class="admin-main">
    <div class="admin-container">
        <aside class="admin-nav">
            <h2><span>📋</span> 後台選單</h2>
            <a href="admin.html" class="nav-link active"><span>👥</span> 用戶權限管理</a>
            <a href="question.html" class="nav-link"><span>❓</span> 考題庫編輯</a>
            <a href="camera.html" class="nav-link"><span>📷</span> 影像辨識偵錯</a>
            <a href="game_data.html" class="nav-link"><span>📈</span> 遊戲數據監控</a>
            <a href="javascript:void(0);" class="nav-link" onclick="logout();" style="margin-top: auto; color: white; background: var(--pixel-red);"><span>🚪</span> 登出系統</a>
        </aside>

        <main class="admin-board">
            <div class="board-header">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋 ID 或 使用者名稱...">
            </div>

            <div class="user-list-container">
                <div class="table-header">
                    <span>頭像</span>
                    <span>使用者 ID</span>
                    <span>電子信箱</span>
                    <span>當前狀態</span>
                    <span style="text-align: right;">操作項目</span>
                </div>

                <div id="userTableBody"></div>
            </div>
        </main>
    </div>
</div>

<div id="statusModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2 id="modalTitle">標題</h2>
        <p id="modalMsg">內容訊息</p>
        
        <div class="modal-footer" id="modalFooter">
            <button class="btn-3d" id="modalBtn" onclick="closeModal()">確定</button>
        </div>
    </div>
</div>

<script src="js/ngrok-fetch.js"></script>
<script>
    const API_URL = location.origin;
    let syncTimer = null; // 用於儲存心跳與列表刷新的計時器

    // --- 1. 跨分頁監聽 (防止手動刪除 token) ---
    window.addEventListener('storage', (e) => {
        if (e.key === 'token' && !e.newValue) {
            window.location.href = 'login.html';
        }
    });

    // --- 2. 頁面初始化：驗證、復活與初次載入 ---
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        const username = localStorage.getItem('username');

        // 基本權限檢查
        if (!token || role !== 'admin' || !username) {
            window.location.href = 'login.html';
            return;
        }

        try {
            // =============================
            // 🏆 核心：老師建議的 Token 驗證與續期 (復活)
            // =============================
            const verifyRes = await fetch(`${API_URL}/auth/verify_and_refresh?username=${encodeURIComponent(username)}`, {
                method: "POST",
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const verifyData = await verifyRes.json();

            if (verifyData.status !== "success") {
                localStorage.clear();
                window.location.href = "login.html";
                return;
            }

            console.log("管理員驗證成功，狀態已復活");

            // 進場報到 (更新最後活動時間)
            await fetch(`${API_URL}/auth/heartbeat?username=${encodeURIComponent(username)}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            // 啟動監控與自動刷新循環
            startAdminLoop(username, token);
            
            // 初次抓取使用者列表
            fetchUsers();

        } catch (err) {
            console.error("初始化失敗:", err);
            window.location.href = 'login.html';
        }
    });

    // --- 3. 核心監控循環：心跳 + 刷新列表 + 狀態校對 ---
    function startAdminLoop(username, token) {
        if (syncTimer) clearInterval(syncTimer);
        
        syncTimer = setInterval(async () => {
            try {
                // A. 發送心跳
                fetch(`${API_URL}/auth/heartbeat?username=${encodeURIComponent(username)}`, {
                    method: 'POST', 
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                // B. 狀態校對 (防止管理員被重複登入攔截)
                const res = await fetch(`${API_URL}/auth/me?username=${encodeURIComponent(username)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    // 如果被後端判定離線，強制跳轉
                    if (data.is_online === 0 || data.role === 'banned') {
                        clearInterval(syncTimer);
                        localStorage.clear();
                        window.location.href = 'login.html';
                        return;
                    }
                }
                
                // C. 自動刷新使用者清單 (讓管理員看到即時在線狀態)
                fetchUsers();

            } catch (err) {
                console.error("監控連線異常");
            }
        }, 5000); 
    }

    // --- 4. 獲取使用者列表 ---
    async function fetchUsers() {
        try {
            const token = localStorage.getItem('token');
            const response = await fetch(`${API_URL}/admin/users`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!response.ok) return;

            const users = await response.json();
            const container = document.getElementById('userTableBody');
            if (!container) return;
            container.innerHTML = "";
            
            users.forEach(user => {
                const row = document.createElement('div');
                row.className = 'user-row';
                
                let statusText = user.is_online === 1 ? "● 在線中" : "○ 離線";
                let statusClass = user.is_online === 1 ? "status-online" : "status-offline";
                
                if (user.role === 'banned') { 
                    statusText = "✖ 已封鎖"; 
                    statusClass = "status-banned"; 
                }

                row.innerHTML = `
                    <div class="user-avatar">${user.role === 'admin' ? '👑' : '👾'}</div>
                    <div class="user-id">${user.username}</div>
                    <div class="user-email">${user.email || '無信箱資料'}</div>
                    <div><span class="user-status ${statusClass}">${statusText}</span></div>
                    <div class="action-btns">
                        <button class="btn-icon btn-edit">編輯</button>
                        <button class="btn-icon btn-ban" ${user.username === localStorage.getItem('username') ? 'disabled' : ''} 
                                onclick="openBanConfirm('${user.username}', '${user.role}')">
                            ${user.role === 'banned' ? '解封' : '封鎖'}
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        } catch (err) { 
            console.error("刷新清單異常", err); 
        }
    }

    // --- 5. 封鎖/解封功能 ---
    function openBanConfirm(targetUser, currentRole) {
        const isBanning = currentRole !== 'banned';
        const actionText = isBanning ? "封鎖" : "解除封鎖";
        const newRole = isBanning ? "banned" : "player";

        const modal = document.getElementById('statusModal');
        const titleEl = document.getElementById('modalTitle');
        const msgEl = document.getElementById('modalMsg');
        const footerEl = document.getElementById('modalFooter');

        titleEl.innerText = `⚠️ ${actionText}確認`;
        msgEl.innerText = `您確定要 ${actionText} 使用者「${targetUser}」嗎？`;
        titleEl.style.color = isBanning ? "var(--pixel-red)" : "var(--pixel-green)";

        footerEl.innerHTML = `
            <button class="btn-3d" id="confirmActionBtn" style="background: ${isBanning ? 'var(--pixel-red)' : 'var(--pixel-green)'}; color: white; margin-right: 10px;">確定</button>
            <button class="btn-3d" style="background: #dfe4ea; color: var(--text-dark);" onclick="closeModal()">取消</button>
        `;

        document.getElementById('confirmActionBtn').onclick = async () => {
            await executeRoleChange(targetUser, newRole, actionText);
            closeModal();
        };

        modal.style.display = 'flex';
    }

    async function executeRoleChange(targetUser, newRole, actionText) {
        try {
            const token = localStorage.getItem('token');
            const res = await fetch(`${API_URL}/admin/users/${targetUser}/role`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ role: newRole })
            });

            if (res.ok) {
                showModal("✅ 執行成功", `使用者 ${targetUser} 已 ${actionText}。`, true);
                fetchUsers();
            } else {
                showModal("❌ 執行失敗", "無法變更權限", false);
            }
        } catch (err) {
            showModal("❌ 錯誤", "連線異常", false);
        }
    }

    // --- 6. 導航與手動登出 ---
    async function logout() {
        if (typeof syncTimer !== 'undefined' && syncTimer) {
            clearInterval(syncTimer);
        }

        const username = localStorage.getItem('username');
        if (!username) return;

        const url = API_URL + "/auth/logout?username=" + encodeURIComponent(username) + "&confirm=true";
        console.log("正在發送登出請求到:", url);

        try {
            const response = await fetch(url, { 
                method: 'POST',
                mode: 'cors',
                cache: 'no-cache'
            });
            const result = await response.json();
            console.log("後端回應：", result);
        } catch (err) {
            console.error("登出連線失敗", err);
        }

        localStorage.clear();
        window.location.href = 'login.html';
    }

    // --- 7. 通用 UI Modal 控制 ---
    function showModal(title, message, isSuccess = true) {
        const modal = document.getElementById('statusModal');
        const titleEl = document.getElementById('modalTitle');
        const msgEl = document.getElementById('modalMsg');
        const footerEl = document.getElementById('modalFooter');

        titleEl.innerText = title;
        msgEl.innerText = message;
        titleEl.style.color = isSuccess ? "var(--pixel-green)" : "var(--pixel-red)";
        footerEl.innerHTML = `<button class="btn-3d" onclick="closeModal()">確定</button>`;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('statusModal').style.display = 'none';
    }
</script>

</body>
</html>
