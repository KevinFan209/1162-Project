<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - Admin User Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/jpeg">
    <style>
        :root {
            --pixel-border: #1e272e;
            --bee-gold: #ffc048;
            --bee-yellow: #ffdd59;
            --bee-dark: #2f3542;
            --pixel-green: #05c46b;
            --pixel-blue: #0fbcf9;
            --pixel-red: #ff3f34;
            --bg-grid: #d2dae2;
            --card-bg: #ffffff;
            --text-dark: #1e272e;
            --text-gray: #747d8c;
            --border-light: #1e272e;
            --danger-red: #ff3f34;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-grid);
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 28px 28px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            margin: 0 !important;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            z-index: 100;
            border: none;
            border-bottom: 4px solid var(--pixel-border);
            box-shadow: none !important;
            flex-shrink: 0;
        }

        .header-left h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            line-height: 1;
            color: var(--bee-gold);
            text-shadow: 
                2px 2px 0 var(--pixel-border),
                -1.5px -1.5px 0 var(--pixel-border),
                2px -1.5px 0 var(--pixel-border),
                -1.5px 2px 0 var(--pixel-border),
                4px 4px 0 var(--bee-dark);
            letter-spacing: 2px;
            user-select: none;
            cursor: pointer;
        }

        .header-right { display: flex; align-items: center; gap: 18px; }

        .page-tag {
            background: #fffdf2;
            border: 3px solid var(--pixel-border);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-dark);
            box-shadow: 3px 3px 0 #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-main {
            height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .admin-container {
            display: flex;
            gap: 25px;
            width: 95%;
            max-width: 1280px;
            height: 100%;
            align-items: stretch;
        }

        .admin-nav {
            width: 280px;
            background: white;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0px #000;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .admin-nav h2 {
            font-weight: 900;
            font-size: 1.35rem;
            margin-bottom: 10px;
            padding-left: 6px;
            color: var(--text-dark);
            border-bottom: 3px solid var(--pixel-border);
            padding-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .nav-link { 
            width: 100%;
            padding: 13px 16px;
            border: 3px solid var(--pixel-border);
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            color: var(--text-dark);
            transition: all 0.06s ease;
            text-decoration: none;
            box-shadow: 3px 3px 0 #000;
            user-select: none;
        }

        .nav-link:hover:not(.active) {
            background: #fffdf2;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #000;
        }

        .nav-link.active {
            background: var(--bee-yellow);
            color: var(--text-dark);
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }

        .admin-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow: hidden;
            height: 100%;
        }

        .board-header { 
            background: white;
            padding: 16px 24px;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-input {
            padding: 10px 16px;
            border: 3px solid var(--pixel-border);
            background: #fffdf5;
            width: 300px;
            font-weight: 900;
            font-size: 0.95rem;
            color: var(--text-dark);
            outline: none;
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.06);
        }
        .search-input:focus {
            background: #feffea;
            border-color: #000;
        }

        .header-tools {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-tool {
            padding: 9px 16px;
            border: 3px solid var(--pixel-border);
            background: #fffdf2;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }
        .btn-tool:hover { background: var(--bee-yellow); }
        .btn-tool:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }

        .badge-unread {
            background: var(--pixel-red);
            color: white;
            border: 2px solid var(--pixel-border);
            padding: 1px 6px;
            font-size: 0.75rem;
            font-weight: 900;
            margin-left: 4px;
        }

        .user-list-container { 
            background: white;
            flex: 1;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            padding: 24px 28px; 
            overflow-y: auto;
        }

        .table-header {
            display: grid;
            grid-template-columns: 70px 1.2fr 1.2fr 120px 160px;
            padding: 0 24px 12px;
            font-weight: 900;
            color: var(--text-dark);
            font-size: 0.9rem;
            border-bottom: 3px solid var(--pixel-border);
            margin-bottom: 14px;
        }

        .user-row {
            background: #f8fafc;
            padding: 14px 24px;
            border: 3px solid var(--pixel-border);
            box-shadow: 4px 4px 0 #000;
            display: grid;
            grid-template-columns: 70px 1.2fr 1.2fr 120px 160px;
            align-items: center;
            margin-bottom: 12px;
            transition: all 0.08s ease;
        }
        .user-row:hover {
            background: #fffdf5;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }
        
        .user-avatar {
            width: 44px;
            height: 44px;
            background: white;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
        }
        .user-id { font-weight: 900; font-size: 1.05rem; color: var(--text-dark); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .user-email { color: var(--text-gray); font-weight: 900; font-size: 0.9rem; }
        
        .role-tag {
            display: inline-block;
            min-width: 78px;
            text-align: center;
            font-size: 0.78rem;
            padding: 3px 8px;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            font-weight: 900;
            flex-shrink: 0;
        }
        .role-admin { background: var(--bee-gold); color: var(--text-dark); }
        .role-teacher { background: #e0f2fe; color: #0369a1; }
        .role-student { background: #fef08a; color: #854d0e; }
        .role-player { background: #f1f5f9; color: var(--text-gray); }

        .user-status {
            display: inline-block;
            padding: 4px 10px;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            font-size: 0.8rem;
            font-weight: 900;
        }
        .status-online { background: #ebfffa; color: var(--pixel-green); }
        .status-offline { background: #dfe4ea; color: var(--text-dark); }
        .status-banned { background: #fff5f5; color: var(--pixel-red); }

        .action-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-icon {
            padding: 8px 14px;
            border: 2px solid var(--pixel-border);
            box-shadow: 3px 3px 0 #000;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.85rem;
            transition: 0.06s ease;
            user-select: none;
        }
        .btn-icon:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }
        .btn-edit { background: #dfe4ea; color: var(--text-dark); }
        .btn-edit:hover { background: #ced6e0; }
        .btn-ban { background: #fff5f5; color: var(--pixel-red); }
        .btn-ban:hover { background: #ffe0e0; }
        .btn-icon:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 #000; }

        /* 像素對話彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 32px 30px;
            border: 4px solid var(--pixel-border);
            box-shadow: 8px 8px 0px #000000;
            width: 460px;
            max-width: 92vw;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
            animation: modalPop 0.15s ease-out;
        }

        .modal-content.wide { width: 680px; text-align: left; }

        .modal-content h2 {
            font-weight: 900;
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--text-dark);
        }
        .modal-content p {
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 24px;
            line-height: 1.6;
            font-size: 1rem;
        }

        .modal-footer { display: flex; justify-content: center; gap: 12px; margin-top: 18px; }

        .btn-3d {
            padding: 12px 26px;
            border: 3px solid var(--pixel-border);
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.06s ease;
            color: var(--text-dark);
            background: var(--bee-yellow);
            box-shadow: 0 4px 0 #000;
            user-select: none;
        }
        .btn-3d:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
        }

        .mini-card {
            background: #f8fafc;
            border: 3px solid var(--pixel-border);
            box-shadow: 3px 3px 0 #000;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-list-container::-webkit-scrollbar, .modal-content::-webkit-scrollbar { width: 8px; }
        .user-list-container::-webkit-scrollbar-track, .modal-content::-webkit-scrollbar-track { background: #dfe4ea; border-left: 2px solid var(--pixel-border); }
        .user-list-container::-webkit-scrollbar-thumb, .modal-content::-webkit-scrollbar-thumb { background: var(--pixel-border); }

        @media (max-width: 900px) {
            header { padding: 0 20px; }
            .admin-container { flex-direction: column; height: auto; }
            .admin-nav { width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left"><h1 onclick="location.href='admin.html'">BeeRich</h1></div>
    <div class="header-right">
        <div class="page-tag"><span>👥</span> 管理後台中心</div>
    </div>
</header>

<div class="admin-main">
    <div class="admin-container">
        <aside class="admin-nav">
            <h2><span>📋</span> 後台選單</h2>
            <a href="admin.html" class="nav-link active"><span>👥</span> 用戶權限管理</a>
            <a href="question.html" class="nav-link"><span>❓</span> 考題庫編輯</a>
            <a href="handbook_admin.html" class="nav-link"><span>📖</span> 學習手冊管理</a>
            <a href="camera.html" class="nav-link"><span>📷</span> 影像辨識偵錯</a>
            <a href="game_data.html" class="nav-link"><span>📈</span> 遊戲數據監控</a>
            <a href="javascript:void(0);" class="nav-link" onclick="logout();" style="margin-top: auto; color: white; background: var(--pixel-red);"><span>🚪</span> 登出系統</a>
        </aside>

        <main class="admin-board">
            <div class="board-header">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋 ID、信箱或班級..." oninput="renderFilteredUsers()">
                <div class="header-tools">
                    <button class="btn-tool" onclick="openTeacherAppsModal()">
                        <span>📝</span> 教師資格審核
                        <span id="pendingAppsBadge" class="badge-unread" style="display: none;">0</span>
                    </button>
                    <button class="btn-tool" onclick="openClassesModal()"><span>🏫</span> 班級總覽</button>
                    <button class="btn-tool" onclick="openAuditModal()">
                        <span>🔔</span> 教師異動通知
                        <span id="unreadBadge" class="badge-unread" style="display: none;">0</span>
                    </button>
                </div>
            </div>

            <div class="user-list-container">
                <div class="table-header">
                    <span>頭像</span>
                    <span>使用者 ID 與身分</span>
                    <span>電子信箱</span>
                    <span>當前狀態</span>
                    <span style="text-align: right;">操作項目</span>
                </div>

                <div id="userTableBody"></div>
            </div>
        </main>
    </div>
</div>

<!-- 通用狀態 / 編輯彈窗 -->
<div id="statusModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" id="modalBox">
        <h2 id="modalTitle">標題</h2>
        <div id="modalBody"><p id="modalMsg">內容訊息</p></div>
        <div class="modal-footer" id="modalFooter">
            <button class="btn-3d" id="modalBtn" onclick="closeModal()">確定</button>
        </div>
    </div>
</div>

<script src="js/ngrok-fetch.js"></script>
<script src="js/admin-role-modal.js"></script>
<script>
    const API_URL = location.origin;
    let syncTimer = null;
    let allUsersCache = [];

    window.addEventListener('storage', (e) => {
        if (e.key === 'token' && !e.newValue) window.location.href = 'login.html';
    });

    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        const username = localStorage.getItem('username');

        if (!token || role !== 'admin' || !username) {
            window.location.href = 'login.html';
            return;
        }

        try {
            const verifyRes = await fetch(`${API_URL}/auth/verify_and_refresh?username=${encodeURIComponent(username)}`, {
                method: "POST",
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const verifyData = await verifyRes.json();

            if (verifyData.status !== "success") {
                localStorage.clear();
                window.location.href = "login.html";
                return;
            }

            await fetch(`${API_URL}/auth/heartbeat?username=${encodeURIComponent(username)}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            startAdminLoop(username, token);
            fetchUsers();
            fetchUnreadCount();
        } catch (err) {
            console.error("初始化失敗:", err);
            window.location.href = 'login.html';
        }
    });

    function startAdminLoop(username, token) {
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(async () => {
            try {
                fetch(`${API_URL}/auth/heartbeat?username=${encodeURIComponent(username)}`, {
                    method: 'POST', 
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const res = await fetch(`${API_URL}/auth/me?username=${encodeURIComponent(username)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    if (data.is_online === 0 || data.role === 'banned') {
                        clearInterval(syncTimer);
                        localStorage.clear();
                        window.location.href = 'login.html';
                        return;
                    }
                }
                fetchUsers();
                fetchUnreadCount();
            } catch (err) {
                console.error("監控連線異常");
            }
        }, 5000); 
    }

    async function fetchUsers() {
        try {
            const token = localStorage.getItem('token');
            const response = await fetch(`${API_URL}/admin/users`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!response.ok) return;
            allUsersCache = await response.json();
            renderFilteredUsers();
        } catch (err) { 
            console.error("刷新清單異常", err); 
        }
    }

    function renderFilteredUsers() {
        const container = document.getElementById('userTableBody');
        if (!container) return;
        const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();

        const list = allUsersCache.filter(u => {
            if (!q) return true;
            return (u.username && u.username.toLowerCase().includes(q)) ||
                   (u.email && u.email.toLowerCase().includes(q)) ||
                   (u.class_name && u.class_name.toLowerCase().includes(q));
        });

        container.innerHTML = "";
        list.forEach(user => {
            const row = document.createElement('div');
            row.className = 'user-row';
            
            let statusText = user.is_online === 1 ? "● 在線中" : "○ 離線";
            let statusClass = user.is_online === 1 ? "status-online" : "status-offline";
            if (user.role === 'banned') { 
                statusText = "✖ 已封鎖"; 
                statusClass = "status-banned"; 
            }

            // 🏆 區分管理員、老師、學生玩家、一般玩家
            let avatarIcon = '👾';
            let roleBadge = `<span class="role-tag role-player">一般玩家</span>`;
            if (user.role === 'admin') {
                avatarIcon = '👑';
                roleBadge = `<span class="role-tag role-admin">管理員</span>`;
            } else if (user.role === 'teacher') {
                avatarIcon = '🧑‍🏫';
                roleBadge = `<span class="role-tag role-teacher">老師</span>`;
            } else if (user.class_name) {
                avatarIcon = '🎓';
                roleBadge = `<span class="role-tag role-student">學生：${user.class_name}</span>`;
            }

            const isSelf = user.username === localStorage.getItem('username');

            row.innerHTML = `
                <div class="user-avatar">${avatarIcon}</div>
                <div class="user-id">
                    ${roleBadge}
                    <span>${user.username}</span>
                </div>
                <div class="user-email">${user.email || '無信箱資料'}</div>
                <div><span class="user-status ${statusClass}">${statusText}</span></div>
                <div class="action-btns">
                    <button class="btn-icon btn-edit" ${user.role === 'admin' ? 'disabled' : ''}
                            onclick="openRoleEditModal('${user.username}', '${user.role}')">編輯</button>
                    <button class="btn-icon btn-ban" ${isSelf || user.role === 'admin' ? 'disabled' : ''} 
                            onclick="openBanConfirm('${user.username}', '${user.role}')">
                        ${user.role === 'banned' ? '解封' : '封鎖'}
                    </button>
                </div>
            `;
            container.appendChild(row);
        });
    }

    // 🏆 編輯使用者身分：合併 main(Fan-fix-issue-v2) 修 #36（player/banned
    // 兩個選項，呼叫已抽出來的共用模組 static/js/admin-role-modal.js 的
    // fillEditRoleModal()）跟 hsuan_teacher 這個函式原本只有的
    // player/teacher 兩個選項——兩邊各自獨立修了同一個「編輯按鈕原本
    // 沒有 onclick」的 bug，合併成同時支援 3 個選項，不含 admin
    // （兩邊原本都沒讓 admin 出現在下拉單上）。
    function openRoleEditModal(targetUser, currentRole) {
        const modal = document.getElementById('statusModal');
        const box = document.getElementById('modalBox');
        box.classList.remove('wide');
        fillEditRoleModal(
            document.getElementById('modalTitle'),
            document.getElementById('modalMsg'),
            document.getElementById('modalFooter'),
            targetUser, currentRole,
            [
                { value: 'player', label: '👾 玩家 / 學生' },
                { value: 'teacher', label: '🧑‍🏫 教師' },
                { value: 'banned', label: '🚫 封鎖' },
            ],
            (newRole) => executeRoleChange(targetUser, newRole, `身分變更為 ${newRole}`)
        );
        modal.style.display = 'flex';
    }

    // 🏆 查看所有班級總覽
    async function openClassesModal() {
        const token = localStorage.getItem('token');
        const res = await fetch(`${API_URL}/admin/classes`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const classes = res.ok ? await res.json() : [];

        const modal = document.getElementById('statusModal');
        const box = document.getElementById('modalBox');
        box.classList.add('wide');

        document.getElementById('modalTitle').innerText = `🏫 教師班級總覽 (${classes.length} 個班級)`;
        document.getElementById('modalTitle').style.color = "var(--text-dark)";

        if (!classes.length) {
            document.getElementById('modalBody').innerHTML = `<p style="text-align:center; color: var(--text-gray);">目前尚無老師建立班級。</p>`;
        } else {
            document.getElementById('modalBody').innerHTML = classes.map(c => `
                <div class="mini-card">
                    <div>
                        <div style="font-weight: 900; font-size: 1.1rem;">🏫 ${c.name}</div>
                        <div style="font-size: 0.85rem; color: var(--text-gray); font-weight: 800;">
                            指導老師：<b>${c.teacher_username}</b> ｜ 邀請碼：<b style="color:var(--pixel-blue);">${c.invite_code}</b>
                        </div>
                    </div>
                    <div class="role-tag role-student" style="font-size: 0.9rem;">🎓 學生 ${c.student_count} 人</div>
                </div>
            `).join('');
        }
        document.getElementById('modalFooter').innerHTML = `<button class="btn-3d" onclick="closeModal()">關閉</button>`;
        modal.style.display = 'flex';
    }

    // 🏆 取得未讀教師通知數量
    async function fetchUnreadCount() {
        try {
            const token = localStorage.getItem('token');
            const res = await fetch(`${API_URL}/admin/audit_logs`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) return;
            const data = await res.json();
            const badge = document.getElementById('unreadBadge');
            if (data.unread_count > 0) {
                badge.style.display = 'inline-block';
                badge.innerText = data.unread_count;
            } else {
                badge.style.display = 'none';
            }
        } catch (e) {}
		
		// 同步更新待審核的教師資格申請數量紅點
        try {
            const token = localStorage.getItem('token');
            const appRes = await fetch(`${API_URL}/admin/teacher_applications`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (appRes.ok) {
                const appData = await appRes.json();
                const appBadge = document.getElementById('pendingAppsBadge');
                if (appBadge) {
                    if (appData.pending_count > 0) {
                        appBadge.style.display = 'inline-block';
                        appBadge.innerText = appData.pending_count;
                    } else {
                        appBadge.style.display = 'none';
                    }
                }
            }
        } catch (e) {}
    }
	
	

    // 🏆 查看教師異動通知
    async function openAuditModal() {
        const token = localStorage.getItem('token');
        const res = await fetch(`${API_URL}/admin/audit_logs`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = res.ok ? await res.json() : { items: [] };

        const modal = document.getElementById('statusModal');
        const box = document.getElementById('modalBox');
        box.classList.add('wide');

        document.getElementById('modalTitle').innerText = `🔔 教師教材與考題異動通知`;
        document.getElementById('modalTitle').style.color = "var(--text-dark)";

        if (!data.items.length) {
            document.getElementById('modalBody').innerHTML = `<p style="text-align:center; color: var(--text-gray);">目前尚無任何老師更動考題或學習手冊。</p>`;
        } else {
            document.getElementById('modalBody').innerHTML = data.items.map(item => `
                <div class="mini-card" style="background: ${item.is_read ? '#f8fafc' : '#fffdf2'};">
                    <div>
                        <div style="font-weight: 900; font-size: 0.98rem;">
                            ${item.is_read ? '' : '🔴 '}<b>${item.teacher_username}</b> 老師（${item.class_name || '班級'}）
                            <span class="role-tag role-teacher">${item.action}${item.target_type}</span>
                        </div>
                        <div style="font-size: 0.88rem; color: var(--text-gray); font-weight: 800; margin-top: 4px;">
                            內容：${item.detail || '—'}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 標記為已讀
        await fetch(`${API_URL}/admin/audit_logs/read_all`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        fetchUnreadCount();

        document.getElementById('modalFooter').innerHTML = `<button class="btn-3d" onclick="closeModal()">知道了</button>`;
        modal.style.display = 'flex';
    }
	
	let teacherAppsCache = [];

    // 📝 1. 打開教師資格申請列表 (含待處理與所有已通過/未通過歷史紀錄)
    async function openTeacherAppsModal() {
        const token = localStorage.getItem('token');
        const res = await fetch(`${API_URL}/admin/teacher_applications`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = res.ok ? await res.json() : { items: [] };
        teacherAppsCache = data.items || [];

        const modal = document.getElementById('statusModal');
        const box = document.getElementById('modalBox');
        box.classList.add('wide');

        document.getElementById('modalTitle').innerText = `📝 教師資格申請與審核紀錄 (${teacherAppsCache.length} 筆)`;
        document.getElementById('modalTitle').style.color = "var(--text-dark)";

        if (!teacherAppsCache.length) {
            document.getElementById('modalBody').innerHTML = `<p style="text-align:center; color: var(--text-gray);">目前尚無任何教師資格申請紀錄。</p>`;
        } else {
            const statusMap = {
                pending: { label: '⏳ 待審核', bg: '#ffdd59', color: '#1e272e' },
                reviewing: { label: '🔍 審核中', bg: '#e0f2fe', color: '#0369a1' },
                approved: { label: '✅ 已通過', bg: '#ebfffa', color: '#05c46b' },
                rejected: { label: '❌ 未通過', bg: '#fff5f5', color: '#ff3f34' }
            };

            document.getElementById('modalBody').innerHTML = teacherAppsCache.map(a => {
                const st = statusMap[a.status] || statusMap.pending;
                const dateStr = a.created_at ? new Date(a.created_at.endsWith('Z') ? a.created_at : a.created_at + 'Z').toLocaleString('zh-TW') : '—';
                const reasonHtml = (a.status === 'rejected' && a.reject_reason)
                    ? `<div style="font-size: 0.85rem; color: var(--pixel-red); font-weight: 900; margin-top: 4px;">📌 未通過原因：${a.reject_reason}</div>`
                    : '';

                return `
                    <div class="mini-card" style="background: ${a.status === 'pending' ? '#fffdf2' : '#f8fafc'};">
                        <div style="flex: 1; padding-right: 12px;">
                            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                <span class="role-tag" style="background: ${st.bg}; color: ${st.color};">${st.label}</span>
                                <span style="font-weight: 900; font-size: 1.05rem;">${a.real_name}（帳號：${a.username}）</span>
                            </div>
                            <div style="font-size: 0.85rem; color: var(--text-gray); font-weight: 800; margin-top: 4px;">
                                📅 申請日期：${dateStr} ｜ ✉️ ${a.email}
                            </div>
                            ${reasonHtml}
                        </div>
                        <button class="btn-icon btn-edit" onclick="inspectTeacherApp(${a.id})">
                            ${(a.status === 'pending' || a.status === 'reviewing') ? '🔍 點入審核' : '📄 查看詳情'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('modalFooter').innerHTML = `<button class="btn-3d" onclick="closeModal()">關閉</button>`;
        modal.style.display = 'flex';
    }

    // 📝 2. 管理員點入單筆申請 -> 自動通知後端改為「審核中 (reviewing)」，並顯示完整申請資料與證書
    async function inspectTeacherApp(appId) {
        const token = localStorage.getItem('token');
        const app = teacherAppsCache.find(x => x.id === appId);
        if (!app) return;

        // 若原本是待審核，管理員一點進來立刻變為「審核中」
        if (app.status === 'pending') {
            await fetch(`${API_URL}/admin/teacher_applications/${appId}/mark_reviewing`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            app.status = 'reviewing';
        }

        const dateStr = app.created_at ? new Date(app.created_at.endsWith('Z') ? app.created_at : app.created_at + 'Z').toLocaleString('zh-TW') : '—';
        const isPdf = (app.cert_file_url || '').toLowerCase().endsWith('.pdf');
        const certPreviewHtml = isPdf
            ? `<a href="${app.cert_file_url}" target="_blank" class="btn-icon" style="display:inline-block; background: var(--bee-yellow); color: var(--text-dark); text-decoration: none;">📄 在新分頁打開 PDF 教師資格證</a>`
            : `<div style="margin-top: 8px;">
                   <a href="${app.cert_file_url}" target="_blank" style="font-size:0.85rem; color:#0284c7; font-weight:900;">🔍 點擊放大檢視原圖</a>
                   <img src="${app.cert_file_url}" alt="教師資格證" style="display:block; max-width:100%; max-height:260px; border:3px solid var(--pixel-border); margin-top:6px; object-fit:contain; background:#fff;">
               </div>`;

        const historyResultHtml = app.status === 'approved'
            ? `<div style="margin-top:12px; padding:10px; background:#ebfffa; border:2px solid var(--pixel-border); font-weight:900; color:var(--pixel-green);">✅ 此申請已審核通過（由 ${app.reviewed_by || '管理員'} 審核）</div>`
            : (app.status === 'rejected'
                ? `<div style="margin-top:12px; padding:10px; background:#fff5f5; border:2px solid var(--pixel-border); font-weight:900; color:var(--pixel-red);">❌ 此申請未通過｜原因：${app.reject_reason || '—'}</div>`
                : '');

        document.getElementById('modalTitle').innerText = `📋 審核教師資格申請 — ${app.real_name}`;
        document.getElementById('modalBody').innerHTML = `
            <div style="background:#f8fafc; border:3px solid var(--pixel-border); padding:18px; font-weight:800; line-height:1.8; font-size:0.95rem;">
                <div>📅 <b>申請日期：</b>${dateStr}</div>
                <div>👾 <b>遊戲帳號：</b>${app.username}</div>
                <div>👤 <b>真實姓名：</b>${app.real_name}</div>
                <div>✉️ <b>電子信箱：</b>${app.email}</div>
                <div style="margin-top:8px;">🎯 <b>教學目標：</b><br>
                    <div style="background:white; border:2px solid var(--pixel-border); padding:10px; margin-top:4px; white-space:pre-wrap;">${app.teaching_goal}</div>
                </div>
                <div style="margin-top:10px;">📎 <b>教師資格證：</b><br>${certPreviewHtml}</div>
                ${historyResultHtml}
            </div>
        `;

        if (app.status === 'pending' || app.status === 'reviewing') {
            document.getElementById('modalFooter').innerHTML = `
                <button class="btn-3d" style="background: var(--pixel-green); color: white;" onclick="confirmApproveTeacher(${app.id}, '${app.username}', '${app.real_name}')">✅ 通過</button>
                <button class="btn-3d" style="background: var(--pixel-red); color: white;" onclick="openRejectPrompt(${app.id}, '${app.username}', '${app.real_name}')">❌ 未通過</button>
                <button class="btn-3d" style="background: #dfe4ea;" onclick="openTeacherAppsModal()">🔙 返回列表</button>
            `;
        } else {
            document.getElementById('modalFooter').innerHTML = `
                <button class="btn-3d" style="background: #dfe4ea;" onclick="openTeacherAppsModal()">🔙 返回列表</button>
            `;
        }
    }

    // 📝 3. 點擊「通過」後跳出「是否將 xxx 改為老師」確認視窗
    function confirmApproveTeacher(appId, username, realName) {
        const box = document.getElementById('modalBox');
        box.classList.remove('wide');

        document.getElementById('modalTitle').innerText = `✅ 確認通過教師資格`;
        document.getElementById('modalTitle').style.color = "var(--pixel-green)";
        document.getElementById('modalBody').innerHTML = `
            <p style="font-size: 1.05rem;">您確定要通過審核，並將「<b>${realName}（帳號：${username}）</b>」的身分改為<b>老師（Teacher）</b>嗎？</p>
        `;
        document.getElementById('modalFooter').innerHTML = `
            <button class="btn-3d" style="background: var(--pixel-green); color: white;" onclick="submitReviewAction(${appId}, 'approve')">確認改為老師</button>
            <button class="btn-3d" style="background: #dfe4ea;" onclick="inspectTeacherApp(${appId})">取消</button>
        `;
    }

    // 📝 4. 點擊「未通過」後要求填寫未通過原因並送出
    function openRejectPrompt(appId, username, realName) {
        const box = document.getElementById('modalBox');
        box.classList.remove('wide');

        document.getElementById('modalTitle').innerText = `❌ 填寫未通過原因`;
        document.getElementById('modalTitle').style.color = "var(--pixel-red)";
        document.getElementById('modalBody').innerHTML = `
            <p style="margin-bottom: 10px;">請說明「<b>${realName}（${username}）</b>」未通過審核的原因（申請人將於教師資格頁面與信箱收到此原因）：</p>
            <textarea id="rejectReasonInput" placeholder="例如：上傳之教師資格證圖片模糊無法辨識，請重新上傳清晰版本..."
                      style="width:100%; min-height:100px; padding:12px; border:3px solid var(--pixel-border); font-weight:800; font-size:0.95rem; background:#fffdf5; outline:none;"></textarea>
        `;
        document.getElementById('modalFooter').innerHTML = `
            <button class="btn-3d" style="background: var(--pixel-red); color: white;" onclick="submitReviewAction(${appId}, 'reject')">送出未通過結果</button>
            <button class="btn-3d" style="background: #dfe4ea;" onclick="inspectTeacherApp(${appId})">取消</button>
        `;
    }

    // 📝 5. 送出審核結果並刷新人員管理列表
    async function submitReviewAction(appId, action) {
        const token = localStorage.getItem('token');
        let reject_reason = null;
        if (action === 'reject') {
            reject_reason = (document.getElementById('rejectReasonInput')?.value || '').trim();
            if (!reject_reason) {
                alert('請填寫未通過的原因！');
                return;
            }
        }

        const res = await fetch(`${API_URL}/admin/teacher_applications/${appId}/review`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ action, reject_reason })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
            fetchUsers();
            fetchUnreadCount();
            const mailNotice = data.email_sent
                ? `<br><br><span style="color:var(--pixel-green); font-size:0.9rem;">📧 ${data.email_msg}</span>`
                : `<br><br><span style="color:var(--pixel-red); font-size:0.88rem;">⚠️ 郵件發送失敗：${data.email_msg}</span>`;

            if (action === 'approve') {
                showModal('🎉 審核通過', `已成功將「<b>${data.username}</b>」的身分改為老師！${mailNotice}`, true);
            } else {
                showModal('📌 已退回申請', `已記錄未通過原因。${mailNotice}`, true);
            }
        } else {
            showModal('❌ 操作失敗', data.detail || '審核儲存失敗', false);
        }
    }

    function openBanConfirm(targetUser, currentRole) {
        const isBanning = currentRole !== 'banned';
        const actionText = isBanning ? "封鎖" : "解除封鎖";
        const newRole = isBanning ? "banned" : "player";

        const modal = document.getElementById('statusModal');
        document.getElementById('modalBox').classList.remove('wide');
        const titleEl = document.getElementById('modalTitle');
        const bodyEl = document.getElementById('modalBody');
        const footerEl = document.getElementById('modalFooter');

        titleEl.innerText = `⚠️ ${actionText}確認`;
        bodyEl.innerHTML = `<p>您確定要 ${actionText} 使用者「${targetUser}」嗎？</p>`;
        titleEl.style.color = isBanning ? "var(--pixel-red)" : "var(--pixel-green)";

        footerEl.innerHTML = `
            <button class="btn-3d" id="confirmActionBtn" style="background: ${isBanning ? 'var(--pixel-red)' : 'var(--pixel-green)'}; color: white; margin-right: 10px;">確定</button>
            <button class="btn-3d" style="background: #dfe4ea; color: var(--text-dark);" onclick="closeModal()">取消</button>
        `;

        document.getElementById('confirmActionBtn').onclick = async () => {
            await executeRoleChange(targetUser, newRole, actionText);
        };

        modal.style.display = 'flex';
    }

    async function executeRoleChange(targetUser, newRole, actionText) {
        try {
            const token = localStorage.getItem('token');
            const res = await fetch(`${API_URL}/admin/users/${targetUser}/role`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ role: newRole })
            });

            if (res.ok) {
                showModal("✅ 執行成功", `使用者 ${targetUser} 已完成：${actionText}。`, true);
                fetchUsers();
            } else {
                showModal("❌ 執行失敗", "無法變更權限", false);
            }
        } catch (err) {
            showModal("❌ 錯誤", "連線異常", false);
        }
    }

    async function logout() {
        if (syncTimer) clearInterval(syncTimer);
        const username = localStorage.getItem('username');
        if (username) {
            try {
                await fetch(`${API_URL}/auth/logout?username=${encodeURIComponent(username)}&confirm=true`, { method: 'POST' });
            } catch (err) {}
        }
        localStorage.clear();
        window.location.href = 'login.html';
    }

    function showModal(title, message, isSuccess = true) {
        const modal = document.getElementById('statusModal');
        document.getElementById('modalBox').classList.remove('wide');
        const titleEl = document.getElementById('modalTitle');
        const bodyEl = document.getElementById('modalBody');
        const footerEl = document.getElementById('modalFooter');

        titleEl.innerText = title;
        bodyEl.innerHTML = `<p>${message}</p>`;
        titleEl.style.color = isSuccess ? "var(--pixel-green)" : "var(--pixel-red)";
        footerEl.innerHTML = `<button class="btn-3d" onclick="closeModal()">確定</button>`;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('statusModal').style.display = 'none';
    }
</script>

</body>
