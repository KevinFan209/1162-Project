<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - 遊戲結算</title>
    <!-- 引入與全站一致的精選像素與高質感字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-border: #1e272e;
            --bee-gold: #ffc048;
            --bee-yellow: #ffdd59;
            --bee-dark: #2f3542;
            --pixel-green: #05c46b;
            --pixel-blue: #0fbcf9;
            --pixel-red: #ff3f34;
            --bg-grid: #d2dae2;
            --card-bg: #ffffff;
            --text-dark: #1e272e;
            --text-gray: #747d8c;
            --gold: #ffc048;
            --sidebar-dark: #2f3542;
            --sidebar-dark-shadow: #1e272e;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-grid);
            /* 像素幾何網格背景 */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 28px 28px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 頂部像素風格導覽列 */
        header {
            margin: 0 !important;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            z-index: 100;
            border: none;
            border-bottom: 4px solid var(--pixel-border);
            box-shadow: none !important;
            flex-shrink: 0;
        }

        .header-left h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            line-height: 1;
            color: var(--bee-gold);
            text-shadow: 
                2px 2px 0 var(--pixel-border),
                -1.5px -1.5px 0 var(--pixel-border),
                2px -1.5px 0 var(--pixel-border),
                -1.5px 2px 0 var(--pixel-border),
                4px 4px 0 var(--bee-dark);
            letter-spacing: 2px;
            user-select: none;
            cursor: pointer;
        }

        .header-right { display: flex; align-items: center; gap: 18px; }

        .page-tag {
            background: #fffdf2;
            border: 3px solid var(--pixel-border);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-dark);
            box-shadow: 3px 3px 0 #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu-btn {
            background: white;
            border: 3px solid var(--pixel-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-shadow: 3px 3px 0 #000;
            transition: 0.1s;
        }
        .menu-btn:hover { background: #fffdf2; }
        .menu-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }

        .menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45); display: none; z-index: 999;
        }
        .menu-overlay.open { display: block; }

        .side-menu {
            position: fixed; top: 0; right: -320px; width: 320px; height: 100%;
            background: white; border-left: 4px solid var(--pixel-border);
            box-shadow: -8px 0 0 rgba(0,0,0,0.2);
            z-index: 1000; transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            padding: 90px 25px 35px; display: flex; flex-direction: column; gap: 14px;
        }
        .side-menu.open { right: 0; }

        .menu-item {
            padding: 14px 20px; font-weight: 900;
            color: var(--text-dark); text-decoration: none; display: flex;
            align-items: center; gap: 12px; transition: 0.1s; background: #f1f2f6;
            border: 3px solid var(--pixel-border); box-shadow: 3px 3px 0 #000;
        }
        .menu-item:hover { background: var(--bee-yellow); }
        .menu-item:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
        .menu-item.danger { margin-top: auto; color: white; background: var(--pixel-red); }

        /* 主佈局架構 */
        .results-main {
            height: calc(100vh - 80px);
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 25px;
            padding: 24px;
            overflow: hidden;
        }

        /* 左側：排行榜 */
        .leaderboard-card {
            background: white;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            padding: 30px 35px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .section-title {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dark);
            border-bottom: 3px solid var(--pixel-border);
            padding-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .ranking-item {
            background: #f8fafc;
            padding: 18px 24px;
            border: 3px solid var(--pixel-border);
            box-shadow: 4px 4px 0 #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.08s ease;
        }

        .ranking-item.winner {
            border: 4px solid var(--pixel-border);
            background: #fffdf5;
            box-shadow: 6px 6px 0 var(--bee-gold);
            transform: translate(-2px, -2px);
        }

        .rank-info { display: flex; align-items: center; gap: 16px; }

        .rank-num {
            font-family: 'Silkscreen', 'Zen Maru Gothic', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-gray);
            width: 40px;
            text-align: center;
        }
        .winner .rank-num { color: #d97706; }

        .player-meta h4 {
            font-weight: 900;
            font-size: 1.25rem;
            color: var(--text-dark);
        }

        .rank-score { text-align: right; }
        .score-val {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            font-size: 1.7rem;
            font-weight: 900;
            color: var(--text-dark);
            display: block;
            line-height: 1.2;
        }
        .score-val::before { content: "$ "; color: #d97706; }

        /* 右側：學習數據報告卡片 */
        .report-card {
            background: white;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .report-header {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 1.35rem;
            margin-bottom: 20px;
            border-left: 8px solid var(--pixel-green);
            padding-left: 12px;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }
        
        .data-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .data-item {
            background: #f8fafc;
            padding: 14px 18px;
            border: 3px solid var(--pixel-border);
            box-shadow: 3px 3px 0 #000;
        }

        .data-label {
            font-size: 0.82rem;
            font-weight: 900;
            color: var(--text-gray);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-value {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--text-dark);
        }
        .data-value span { color: var(--pixel-green); margin-left: 4px; }

        /* 底部雙按鈕 */
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }

        .btn-3d {
            flex: 1;
            padding: 15px 10px;
            border: 3px solid var(--pixel-border);
            border-radius: 0;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.06s ease;
            user-select: none;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .btn-home {
            background: #dfe4ea;
            color: var(--text-dark);
            box-shadow: 0 5px 0 #000;
        }
        .btn-home:hover { background: #ced6e0; }
        .btn-home:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #000;
        }

        .btn-again {
            background: var(--bee-yellow);
            color: var(--text-dark);
            box-shadow: 0 5px 0 #000;
        }
        .btn-again:hover { filter: brightness(1.04); }
        .btn-again:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #000;
        }

        /* 滾動條樣式 */
        .leaderboard-card::-webkit-scrollbar,
        .data-box::-webkit-scrollbar {
            width: 8px;
        }
        .leaderboard-card::-webkit-scrollbar-track,
        .data-box::-webkit-scrollbar-track {
            background: #dfe4ea;
            border-left: 2px solid var(--pixel-border);
        }
        .leaderboard-card::-webkit-scrollbar-thumb,
        .data-box::-webkit-scrollbar-thumb {
            background: var(--pixel-border);
        }

        @media (max-width: 850px) {
            header { padding: 0 20px; }
            .results-main { grid-template-columns: 1fr; height: auto; overflow: auto; }
            .report-card { height: auto; }
        }
    </style>
</head>
<body>

<div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="sideMenu">
    <a href="profile.html" class="menu-item"><span>👤</span> 個人主頁</a>
    <a href="guide.html" class="menu-item"><span>📖</span> 遊戲說明</a>
    <a href="learn.html" class="menu-item"><span>📊</span> 學習統計</a>
    <a href="settings.html" class="menu-item"><span>⚙️</span> 遊戲設定</a>
    <a href="lobby.html" class="menu-item"><span>🏠</span> 返回大廳</a>
    <a href="login.html" class="menu-item danger"><span>🚪</span> 登出遊戲</a>
</div>

<header>
    <div class="header-left" onclick="location.href='lobby.html'"><h1>BeeRich</h1></div>
    <div class="header-right">
        <div class="page-tag"><span>🏆</span> 遊戲對局結算</div>
        <button class="menu-btn" onclick="toggleMenu()">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>
</header>

<div class="results-main">
    <section class="leaderboard-card">
        <div class="section-title"><span>🏆</span> 誰是 Python 大富翁？</div>
        <div class="ranking-list" id="rankingList">
            <div style="text-align:center; color:var(--text-gray); font-weight:900; padding:40px;">載入結算資料中...</div>
        </div>
    </section>

    <section class="report-card">
        <div class="report-header">本局整體答題數據</div>
        <div class="data-box" id="dataBox"></div>
        
        <div class="btn-group">
            <button class="btn-3d btn-home" onclick="location.href='lobby.html'">回大廳</button>
            <button class="btn-3d btn-again" onclick="location.href='lobby.html'">再玩一場</button>
        </div>
    </section>
</div>

<script src="js/ngrok-fetch.js"></script>
<script>
    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('open');
    }
    
    const API_URL = location.origin;

    const roomCode = new URLSearchParams(window.location.search).get('room');

    window.onload = () => {
        if (!roomCode) {
            document.getElementById('rankingList').innerHTML =
                `<div style="text-align:center;color:var(--pixel-red);font-weight:900;padding:40px;">缺少房間代碼，無法顯示結算</div>`;
            return;
        }
        finishRoom();
        cleanupGameState();
        loadResults(0);
    };

    async function finishRoom() {
        try {
            await fetch(`${API_URL}/rooms/finish/${encodeURIComponent(roomCode)}`,
                        { method: 'POST' });
            console.log(`🏁 已通知後端結束房間 ${roomCode}`);
        } catch (err) {
            console.warn('⚠️ 通知後端結束對局失敗，房間將由閒置回收處理', err);
        }
    }

    function cleanupGameState() {
        const exact = ['pypoly_active_room', 'room_code', 'room_info', 'is_host',
                       'pypoly_game_snapshot', 'pypoly_current_round', 'pypoly_turn_order',
                       'pypoly_land_ownership', 'pypoly_global_owned_lands',
                       'pypoly_used_questions', 'current_player_role'];
        exact.forEach(k => localStorage.removeItem(k));

        const prefixes = ['pypoly_synced_map_', 'pypoly_inv_', 'pypoly_jumps_'];
        Object.keys(localStorage)
            .filter(k => prefixes.some(p => k.startsWith(p)))
            .forEach(k => localStorage.removeItem(k));

        console.log('🧹 已清除本機的局內狀態');
    }

    async function loadResults(attempt) {
        const MAX_RETRY = 10;
        try {
            const res = await fetch(`${API_URL}/game/results/${encodeURIComponent(roomCode)}`);
            if (res.status === 404) {
                if (attempt < MAX_RETRY) return setTimeout(() => loadResults(attempt + 1), 1000);
                throw new Error('結算資料尚未產生');
            }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            renderLeaderboard(data.leaderboard || []);
            renderReport(data.report || {});
        } catch (err) {
            console.error('讀取結算失敗:', err);
            document.getElementById('rankingList').innerHTML =
                `<div style="text-align:center;color:var(--pixel-red);font-weight:900;padding:40px;">讀取結算資料失敗<br><span style="font-size:0.85rem;color:var(--text-gray);">${err.message}</span></div>`;
        }
    }

    function renderLeaderboard(list) {
        const box = document.getElementById('rankingList');
        if (!list.length) {
            box.innerHTML = `<div style="text-align:center;color:var(--text-gray);font-weight:900;padding:40px;">本局無結算資料</div>`;
            return;
        }
        box.innerHTML = list.map(p => {
            const accColor = p.is_winner ? 'var(--pixel-green)' : 'var(--text-gray)';
            return `
            <div class="ranking-item ${p.is_winner ? 'winner' : ''}">
                <div class="rank-info">
                    <div class="rank-num">${p.rank}</div>
                    <div class="player-meta"><h4>${escapeHtml(p.username)}</h4></div>
                </div>
                <div class="rank-score">
                    <span class="score-val">${Number(p.final_money).toLocaleString()}</span>
                    <span style="color:${accColor}; font-weight:900; font-size:0.9rem;">答對率 ${p.accuracy}%</span>
                </div>
            </div>`;
        }).join('');
    }

    function renderReport(report) {
        const box = document.getElementById('dataBox');
        const item = (label, value, unit) =>
            `<div class="data-item">
                <div class="data-label">${label}</div>
                <div class="data-value">${value} ${unit ? `<span>${unit}</span>` : ''}</div>
            </div>`;
        box.innerHTML = [
            item('最常出現語法', escapeHtml(report.top_category || '—'), ''),
            item('本局答題總數', report.total_questions ?? 0, '題'),
            item('整體答對率', report.overall_accuracy ?? 0, '%'),
            item('答題平均用時', report.avg_answer_sec ?? 0, '秒')
        ].join('');
    }

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
</script>
</body>
</html>
