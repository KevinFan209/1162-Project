<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - 遊戲結算</title>
    <!-- 引入與全站一致的精選像素與高質感字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <!-- 結算贏家的 3D 虛擬人物要用到（來自 hsuan_advance：完成遊戲結算頁面、蜜蜂動畫與答題紀錄 API） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/player-model.js"></script>
	<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
	<link rel="icon" href="/favicon.ico" type="image/jpeg">
    <style>
        :root {
            --pixel-border: #1e272e;
            --bee-gold: #ffc048;
            --bee-yellow: #ffdd59;
            --bee-dark: #2f3542;
            --pixel-green: #05c46b;
            --pixel-blue: #0fbcf9;
            --pixel-red: #ff3f34;
            --bg-grid: #d2dae2;
            --card-bg: #ffffff;
            --text-dark: #1e272e;
            --text-gray: #747d8c;
            --gold: #ffc048;
            --sidebar-dark: #2f3542;
            --sidebar-dark-shadow: #1e272e;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-grid);
            /* 像素幾何網格背景 */
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 28px 28px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 頂部像素風格導覽列 */
        header {
            margin: 0 !important;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            z-index: 100;
            border: none;
            border-bottom: 4px solid var(--pixel-border);
            box-shadow: none !important;
            flex-shrink: 0;
        }

        .header-left h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            line-height: 1;
            color: var(--bee-gold);
            text-shadow:
                2px 2px 0 var(--pixel-border),
                -1.5px -1.5px 0 var(--pixel-border),
                2px -1.5px 0 var(--pixel-border),
                -1.5px 2px 0 var(--pixel-border),
                4px 4px 0 var(--bee-dark);
            letter-spacing: 2px;
            user-select: none;
            cursor: pointer;
        }

        .header-right { display: flex; align-items: center; gap: 18px; }

        .page-tag {
            background: #fffdf2;
            border: 3px solid var(--pixel-border);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-dark);
            box-shadow: 3px 3px 0 #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 主佈局架構：左欄（排行榜＋答題紀錄）／右欄（數據報告） */
        .results-main {
            height: calc(100vh - 80px);
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 25px;
            padding: 24px;
            overflow: hidden;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
        }

        .right-column { height: 100%; }

        .leaderboard-card, .report-card, .q-log-card {
            background: white;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            padding: 30px 35px;
            display: flex;
            flex-direction: column;
        }

        .report-card { height: 100%; overflow-y: auto; }

        .section-title, .report-header, .q-log-header {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }
        .section-title {
            border-bottom: 3px solid var(--pixel-border);
            padding-bottom: 12px;
        }
        .report-header { border-left: 8px solid var(--pixel-green); padding-left: 12px; }
        .q-log-header {
            border-left: 8px solid var(--pixel-blue);
            padding-left: 12px;
            justify-content: space-between;
            font-size: 1.35rem;
        }
        .q-log-hint {
            font-size: 0.8rem;
            color: var(--text-dark);
            font-weight: 900;
            background: var(--bee-yellow);
            border: 2px solid var(--pixel-border);
            padding: 5px 12px;
            box-shadow: 2px 2px 0 #000;
        }

        .ranking-list, .q-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .ranking-item {
            background: #f8fafc;
            padding: 18px 24px;
            border: 3px solid var(--pixel-border);
            box-shadow: 4px 4px 0 #000;
            transition: all 0.08s ease;
        }

        .ranking-item.winner {
            border: 4px solid var(--pixel-border);
            background: #fffdf5;
            box-shadow: 6px 6px 0 var(--bee-gold);
            transform: translate(-2px, -2px);
        }

        .rank-info { display: flex; align-items: center; gap: 16px; }

        .rank-num {
            font-family: 'Silkscreen', 'Zen Maru Gothic', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-gray);
            width: 40px;
            text-align: center;
        }
        .winner .rank-num { color: #d97706; }

        .player-meta h4 {
            font-weight: 900;
            font-size: 1.25rem;
            color: var(--text-dark);
        }

        .rank-score { text-align: right; }
        .score-val {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            font-size: 1.7rem;
            font-weight: 900;
            color: var(--text-dark);
            display: block;
            line-height: 1.2;
        }
        .score-val::before { content: "$ "; color: #d97706; }

        /* 展開「資產明細計算」 */
        .expand-btn {
            background: none; border: none; color: var(--pixel-blue);
            font-weight: 900; cursor: pointer; font-size: 0.9rem;
            padding: 8px 0; display: block; margin-left: auto;
        }
        .expand-btn:hover { text-decoration: underline; }
        .settle-details {
            margin-top: 15px; border-top: 3px dashed var(--pixel-border);
            padding-top: 15px; display: none;
        }
        .detail-row {
            display: flex; justify-content: space-between; font-size: 0.95rem;
            color: var(--text-dark); font-weight: 900; margin-bottom: 10px;
        }
        .detail-row.total {
            font-size: 1.25rem; border-top: 3px solid var(--pixel-border);
            padding-top: 12px; margin-top: 10px;
        }
        .land-detail-box {
            background: #f8fafc; border-left: 4px solid var(--pixel-border);
            padding: 10px 14px; margin-bottom: 10px;
        }
        .land-calc-row {
            display: flex; justify-content: space-between; font-size: 0.8rem;
            color: var(--text-gray); font-weight: 700; margin-top: 4px;
        }
        .land-final-row {
            display: flex; justify-content: space-between; font-size: 0.95rem;
            color: var(--pixel-green); font-weight: 900; margin-top: 8px;
            border-top: 2px dashed var(--pixel-border); padding-top: 8px;
        }

        .data-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        .data-item {
            background: #f8fafc;
            padding: 14px 18px;
            border: 3px solid var(--pixel-border);
            box-shadow: 3px 3px 0 #000;
        }

        .data-label {
            font-size: 0.82rem;
            font-weight: 900;
            color: var(--text-gray);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-value {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--text-dark);
        }
        .data-value span { color: var(--pixel-green); margin-left: 4px; }

        .btn-3d {
            width: 100%;
            margin-top: 20px;
            padding: 15px 10px;
            border: 3px solid var(--pixel-border);
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.06s ease;
            user-select: none;
            letter-spacing: 0.5px;
            text-align: center;
            background: var(--bee-yellow);
            color: var(--text-dark);
            box-shadow: 0 5px 0 #000;
        }
        .btn-3d:hover { filter: brightness(1.04); }
        .btn-3d:active { transform: translateY(5px); box-shadow: 0 0 0 #000; }

        /* 答題紀錄清單 */
        .q-item {
            background: #f8fafc; padding: 18px 22px; border: 3px solid var(--pixel-border);
            border-left: 8px solid var(--pixel-border); box-shadow: 3px 3px 0 #000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .q-item.correct { border-left-color: var(--pixel-green); }
        .q-item.wrong { border-left-color: var(--pixel-red); }
        .q-content { font-weight: 900; color: var(--text-dark); font-size: 1.05rem; line-height: 1.5; }
        .q-status { font-weight: 900; font-size: 1rem; text-align: right; }

        /* 滾動條樣式 */
        .leaderboard-card::-webkit-scrollbar,
        .data-box::-webkit-scrollbar,
        .left-column::-webkit-scrollbar,
        .report-card::-webkit-scrollbar {
            width: 8px;
        }
        .leaderboard-card::-webkit-scrollbar-track,
        .data-box::-webkit-scrollbar-track,
        .left-column::-webkit-scrollbar-track,
        .report-card::-webkit-scrollbar-track {
            background: #dfe4ea;
            border-left: 2px solid var(--pixel-border);
        }
        .leaderboard-card::-webkit-scrollbar-thumb,
        .data-box::-webkit-scrollbar-thumb,
        .left-column::-webkit-scrollbar-thumb,
        .report-card::-webkit-scrollbar-thumb {
            background: var(--pixel-border);
        }

        @media (max-width: 850px) {
            header { padding: 0 20px; }
            .results-main { grid-template-columns: 1fr; height: auto; overflow: auto; }
            .report-card { height: auto; }
        }

        /* 🏆 動畫覆蓋層與蜜蜂獎盃（來自 hsuan_advance） */
        #animation-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(210, 218, 226, 0.98); z-index: 50000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .award-visuals { display: flex; align-items: flex-end; justify-content: center; gap: 30px; margin-bottom: 40px; }
        .bee-container { position: relative; display: inline-block; animation: float 2.5s ease-in-out infinite; }
        .bee-logo { width: 220px; height: 220px; object-fit: contain; border-radius: 30px; box-shadow: 6px 6px 0 #000; border: 4px solid var(--pixel-border); }
        .trophy-icon { position: absolute; bottom: -30px; right: -30px; font-size: 6rem; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); opacity: 0; transform: scale(0); }
        #winner-canvas { width: 200px; height: 300px; }
        .award-text { font-size: 3rem; font-weight: 900; color: var(--text-dark); opacity: 0; text-align: center; line-height: 1.4; }
        .winner-name-anim { color: #d97706; font-size: 4rem; display: inline-block; padding: 0 15px; }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-25px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body>

<header>
    <div class="header-left" onclick="location.href='lobby.html'"><h1>BeeRich</h1></div>
    <div class="header-right">
        <div class="page-tag"><span>🏆</span> 遊戲對局結算</div>
    </div>
</header>

<div id="animation-overlay">
    <div class="award-visuals">
        <div class="bee-container">
            <!-- 🏆 修正 Logo 路徑，優先抓 static 目錄 -->
            <img src="static/logo.jpg" alt="Bee Logo" class="bee-logo" onerror="this.src='logo.jpg'">
            <div class="trophy-icon" id="trophyIcon">🏆</div>
        </div>
        <!-- 🏆 3D 虛擬人物 -->
        <canvas id="winner-canvas"></canvas>
    </div>
    <div class="award-text" id="awardText">正在進行遊戲結算...</div>
</div>

<div class="results-main">
    <div class="left-column">
        <section class="leaderboard-card">
            <div class="section-title"><span>🏆</span> 誰是 Python 大富翁？</div>
            <div class="ranking-list" id="rankingList">
                <div style="text-align:center; color:var(--text-gray); font-weight:900; padding:40px;">載入結算資料中...</div>
            </div>
        </section>

        <section class="q-log-card" id="qLogSection">
            <div class="q-log-header">
                <span>📝 你的答題紀錄</span>
                <span class="q-log-hint">💡 答題紀錄可至大廳右側選單中的學習統計查詢</span>
            </div>
            <div class="q-list" id="qList">
                <div style="text-align:center; color:var(--text-gray); font-weight:900; padding:20px;">載入題目紀錄中...</div>
            </div>
        </section>
    </div>

    <div class="right-column">
        <section class="report-card">
            <div class="report-header">本局整體答題數據</div>
            <div class="data-box" id="dataBox"></div>
            <button class="btn-3d" onclick="location.href='lobby.html'">返回大廳</button>
        </section>
    </div>
</div>

<script src="js/ngrok-fetch.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
<script>
    const API_URL = location.origin;
    const roomCode = new URLSearchParams(window.location.search).get('room');
    const myName = localStorage.getItem('username');

    const landOwnership = JSON.parse(localStorage.getItem('pypoly_land_ownership')) || {};
    const mapCache = JSON.parse(localStorage.getItem(`pypoly_synced_map_${roomCode}`)) || [];

    window.onload = () => {
        if (!roomCode) {
            document.getElementById('animation-overlay').style.display = 'none';
            document.getElementById('rankingList').innerHTML =
                `<div style="text-align:center;color:var(--pixel-red);font-weight:900;padding:40px;">缺少房間代碼，無法顯示結算</div>`;
            return;
        }
        finishRoom();
        cleanupGameState();
        loadResults(0);
    };

    async function finishRoom() {
        try {
            await fetch(`${API_URL}/rooms/finish/${encodeURIComponent(roomCode)}`,
                        { method: 'POST' });
            console.log(`🏁 已通知後端結束房間 ${roomCode}`);
        } catch (err) {
            console.warn('⚠️ 通知後端結束對局失敗，房間將由閒置回收處理', err);
        }
    }

    function cleanupGameState() {
        const exact = ['pypoly_active_room', 'room_code', 'room_info', 'is_host',
                       'pypoly_game_snapshot', 'pypoly_current_round', 'pypoly_turn_order',
                       'pypoly_land_ownership', 'pypoly_global_owned_lands',
                       'pypoly_used_questions', 'current_player_role'];
        exact.forEach(k => localStorage.removeItem(k));

        const prefixes = ['pypoly_synced_map_', 'pypoly_inv_', 'pypoly_jumps_'];
        Object.keys(localStorage)
            .filter(k => prefixes.some(p => k.startsWith(p)))
            .forEach(k => localStorage.removeItem(k));

        console.log('🧹 已清除本機的局內狀態');
    }

    async function loadResults(attempt) {
        const MAX_RETRY = 10;
        try {
            const res = await fetch(`${API_URL}/game/results/${encodeURIComponent(roomCode)}`);
            if (res.status === 404) {
                if (attempt < MAX_RETRY) return setTimeout(() => loadResults(attempt + 1), 1000);
                throw new Error('結算資料尚未產生');
            }
            const data = await res.json();

            const enrichedLeaderboard = calculateTotalAssets(data.leaderboard || []);
            await playAwardAnimation(enrichedLeaderboard);

            renderLeaderboard(enrichedLeaderboard);
            renderReport(data.report || {});
            loadMyAnswerLogs();

        } catch (err) {
            console.error('讀取結算失敗:', err);
            document.getElementById('animation-overlay').style.display = 'none';
            document.getElementById('rankingList').innerHTML =
                `<div style="text-align:center;color:var(--pixel-red);font-weight:900;padding:40px;">讀取結算資料失敗<br><span style="font-size:0.85rem;color:var(--text-gray);">${escapeHtml(err.message)}</span></div>`;
        }
    }

    function calculateTotalAssets(leaderboard) {
        const playerRealEstate = {};
        const finalRound = leaderboard.length > 0 ? (leaderboard[0].laps || 1) : 1;

        Object.keys(landOwnership).forEach(tileIdx => {
            const land = landOwnership[tileIdx];
            if (!land.owner) return;

            let landName = land.name;
            if ((!landName || landName === "未知") && mapCache[tileIdx]) {
                landName = mapCache[tileIdx].data?.name || mapCache[tileIdx].name || "優質地產";
            }

            const buyR = land.buyRound || 1;
            const holdRounds = Math.max(0, finalRound - buyR);
            const origPrice = land.originalPrice || 1000;

            let currentVal = origPrice;
            let yearDetails = [];
            const rates = [0.03, 0.05, 0.08, 0.1, 0.15];

            for (let i = 0; i < holdRounds; i++) {
                let rate = rates[i % rates.length];
                let added = Math.floor(currentVal * rate);
                currentVal += added;
                yearDetails.push(`第 ${buyR + i} 回合持有增值 ${Math.round(rate * 100)}%：+$${added.toLocaleString()}`);
            }

            if (!playerRealEstate[land.owner]) playerRealEstate[land.owner] = { totalValue: 0, lands: [] };

            playerRealEstate[land.owner].totalValue += currentVal;
            playerRealEstate[land.owner].lands.push({
                name: landName,
                origPrice: origPrice,
                currentVal: currentVal,
                holdRounds: holdRounds,
                details: yearDetails
            });
        });

        const enriched = leaderboard.map(p => {
            const totalAssetsFromDB = parseInt(p.final_money) || 0;
            const reData = playerRealEstate[p.username] || { totalValue: 0, lands: [] };
            const actualCash = totalAssetsFromDB - reData.totalValue;

            return {
                ...p,
                cash: actualCash,
                realEstateValue: reData.totalValue,
                lands: reData.lands,
                totalAssets: totalAssetsFromDB
            };
        });

        enriched.sort((a, b) => b.totalAssets - a.totalAssets);
        enriched.forEach((p, index) => {
            p.rank = index + 1;
            p.is_winner = (index === 0);
        });

        return enriched;
    }

    function playAwardAnimation(leaderboard) {
        return new Promise(resolve => {
            const overlay = document.getElementById('animation-overlay');
            const awardText = document.getElementById('awardText');
            const trophy = document.getElementById('trophyIcon');
            const winner = leaderboard.find(p => p.rank === 1);
            const winnerName = winner ? winner.username : "玩家";

            renderWinnerAvatar(winnerName);

            const tl = gsap.timeline({
                onComplete: () => {
                    gsap.to(overlay, { opacity: 0, duration: 0.8, delay: 2.5, onComplete: () => {
                        overlay.style.display = 'none';
                        resolve();
                    }});
                }
            });

            tl.to(awardText, { opacity: 1, duration: 0.5 })
              .to(awardText, { opacity: 0, duration: 0.5, delay: 1.0 })
              .add(() => {
                  awardText.innerHTML = `🎉 恭喜 <span class="winner-name-anim">${escapeHtml(winnerName)}</span><br> 奪得 Python 大富翁寶座！`;
              })
              .to(trophy, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" })
              .to(awardText, { opacity: 1, y: -20, duration: 0.8, ease: "power2.out" }, "-=0.4");
        });
    }

    // 🏆 完美修正虛擬人物大小，確保全身入鏡
    function renderWinnerAvatar(winnerName) {
        const canvas = document.getElementById('winner-canvas');
        if (!canvas) return;

        const scene = new THREE.Scene();
        // 將相機往後拉退 (z: 4.5)，讓全身有足夠空間顯示
        const camera = new THREE.PerspectiveCamera(45, 200 / 300, 0.1, 100);
        camera.position.set(0, 0.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(200, 300);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(2, 4, 3);
        scene.add(dirLight);

        const colorsStr = localStorage.getItem(`pypoly_char_colors_${winnerName}`) || localStorage.getItem('pypoly_char_colors');
        let colors = { head: '#f5c18a', arm: '#5cbaee', body: '#4a90d9', legs: '#2c4a8c', feet: '#2c1f14' };
        if (colorsStr) try { colors = JSON.parse(colorsStr); } catch (e) {}
        const faceUrl = localStorage.getItem(`pypoly_char_face_${winnerName}`) || localStorage.getItem('pypoly_char_face');

        if (typeof createCustomBoxCharacter === 'function') {
            const model = createCustomBoxCharacter(colors, faceUrl);
            // 縮小人物比例並向下移動，讓它完美適應 200x300 的畫布
            model.scale.set(0.75, 0.75, 0.75);
            model.position.y = -1.0;
            scene.add(model);

            function animate() {
                requestAnimationFrame(animate);
                model.rotation.y -= 0.02;
                renderer.render(scene, camera);
            }
            animate();
        }
    }

    function renderLeaderboard(list) {
        const box = document.getElementById('rankingList');
        if (!list.length) {
            box.innerHTML = `<div style="text-align:center;color:var(--text-gray);font-weight:900;padding:40px;">本局無結算資料</div>`;
            return;
        }
        box.innerHTML = list.map(p => {
            const isWinner = p.is_winner;

            let landsHtml = '';
            if (p.lands && p.lands.length > 0) {
                landsHtml = p.lands.map(l => `
                    <div class="land-detail-box">
                        <div class="detail-row" style="margin-bottom:0;">
                            <span>📍 ${escapeHtml(l.name)} <span style="font-size:0.8rem;color:var(--text-gray);">(原價 $${l.origPrice.toLocaleString()})</span></span>
                            <span style="font-size:0.8rem; color:var(--text-gray);">持有 ${l.holdRounds} 回合</span>
                        </div>
                        ${l.details.length > 0 ? l.details.map(d => `<div class="land-calc-row">${d}</div>`).join('') : '<div class="land-calc-row">尚未產生複利</div>'}
                        <div class="land-final-row">
                            <span>結算價值</span>
                            <span>$${l.currentVal.toLocaleString()}</span>
                        </div>
                    </div>
                `).join('');
            } else {
                landsHtml = `<div class="detail-row" style="justify-content:center; color:var(--text-gray);">本局無收購任何房產</div>`;
            }

            return `
            <div class="ranking-item ${isWinner ? 'winner' : ''}">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="rank-info">
                        <div class="rank-num">${p.rank}</div>
                        <div class="player-meta"><h4>${escapeHtml(p.username)}${p.username === myName ? '<span style="font-size:0.8rem;color:var(--text-gray);margin-left:5px;">（你）</span>' : ''}</h4></div>
                    </div>
                    <div class="rank-score">
                        <span class="score-val">${p.totalAssets.toLocaleString()}</span>
                        <span style="color:${isWinner ? 'var(--pixel-green)' : 'var(--text-gray)'}; font-weight:900; font-size:0.85rem;">結算總資產</span>
                    </div>
                </div>

                <button class="expand-btn" onclick="toggleDetails('${p.username}')">點擊查看資產明細計算 ▼</button>

                <div class="settle-details" id="details-${p.username}">
                    <div class="detail-row" style="border-bottom:2px solid #e2e8f0; padding-bottom:10px;">
                        <span>💰 遊戲結餘現金</span>
                        <span>$ ${p.cash.toLocaleString()}</span>
                    </div>
                    <div style="margin: 15px 0 10px 0; font-weight: 900; color: var(--text-dark); font-size: 0.95rem;">🏠 房產增值結算（模擬複利）：</div>
                    ${landsHtml}
                    <div class="detail-row total">
                        <span>🏆 最終總資產</span>
                        <span>$ ${p.totalAssets.toLocaleString()}</span>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    // 🏆 智能比對選項，顯示所有題目細節
    async function loadMyAnswerLogs() {
        try {
            const res = await fetch(`${API_URL}/game/answer_logs?room=${encodeURIComponent(roomCode)}&user=${encodeURIComponent(myName)}`);
            if (res.ok) {
                const logs = await res.json();
                renderMyAnswerLogs(logs);
            } else {
                document.getElementById('qList').innerHTML = `<div style="text-align:center; color:var(--pixel-red); font-weight:900; padding:20px;">無答題紀錄</div>`;
            }
        } catch (err) {
            console.error("無法載入答題紀錄:", err);
        }
    }

    function renderMyAnswerLogs(logs) {
        const listDiv = document.getElementById('qList');
        if (!logs || logs.length === 0) {
            listDiv.innerHTML = `<div style="text-align:center; color:var(--text-gray); font-weight:900; padding:20px;">本局未遇到答題關卡</div>`;
            return;
        }

        // 從地圖快取建立題庫字典，方便後續比對選項
        const qDict = {};
        mapCache.forEach(tile => {
            if (tile && tile.data && tile.data.question) {
                const text = (tile.data.question.content || "").trim();
                if (text) qDict[text] = tile.data.question;
            }
        });

        listDiv.innerHTML = logs.map(log => {
            const isCorrect = log.is_correct || (log.chosen_answer == log.correct_answer);
            const statusClass = isCorrect ? 'correct' : 'wrong';
            const statusText = isCorrect ? '✅ 答對' : '❌ 答錯';

            const qText = (log.question_text || "").trim();
            const foundQ = qDict[qText];

            let optionsHtml = '';

            // 💡 若成功找到原本的題目，渲染四個選項，並用顏色標示出玩家的選擇
            if (foundQ && foundQ.options && foundQ.options.length > 0) {
                optionsHtml = `<div style="margin-top:8px; font-size: 0.95rem; display: flex; flex-direction: column; gap: 8px;">
                    ${foundQ.options.map((opt, i) => {
                        const optNum = i + 1;
                        const isChosen = (optNum == log.chosen_answer);

                        // 樣式：未選中的選項灰灰的，選中的選項會依照對錯上色
                        let optStyle = "color: var(--text-gray); background: #ffffff; border: 2px solid var(--pixel-border); padding: 8px 12px; font-weight: 700;";
                        let optIcon = `<span style="display:inline-block; width: 25px; color:var(--text-gray);">(${optNum})</span>`;

                        if (isChosen) {
                            if (isCorrect) {
                                optStyle = "color: var(--pixel-green); background: #effff5; border: 2px solid var(--pixel-green); font-weight: 900;";
                                optIcon = "✅ 你的選擇：";
                            } else {
                                optStyle = "color: var(--pixel-red); background: #fff0ef; border: 2px solid var(--pixel-red); font-weight: 900;";
                                optIcon = "❌ 你的選擇：";
                            }
                        }

                        return `<div style="${optStyle}">${optIcon}${escapeHtml(opt)}</div>`;
                    }).join('')}
                </div>`;
            } else {
                // 防呆：如果是手寫程式碼題，或者找不到選項，就只顯示玩家當初寫了什麼
                optionsHtml = `<div style="margin-top:8px; padding: 10px 14px; background: #ffffff; border: 2px dashed var(--pixel-border); color: var(--text-dark); font-weight: 800;">
                    📝 你的作答：${escapeHtml(log.chosen_answer || '未作答')}
                </div>`;
            }

            return `
            <div class="q-item ${statusClass}">
                <div class="q-content">Q: ${escapeHtml(qText || '未知題目')}</div>
                ${optionsHtml}
                <div class="q-status">${statusText}</div>
            </div>`;
        }).join('');
    }

    function toggleDetails(username) {
        const el = document.getElementById(`details-${username}`);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function renderReport(report) {
        const box = document.getElementById('dataBox');
        const item = (label, value, unit) =>
            `<div class="data-item">
                <div class="data-label">${label}</div>
                <div class="data-value">${value} ${unit ? `<span>${unit}</span>` : ''}</div>
            </div>`;
        box.innerHTML = [
            item('最常出現語法', escapeHtml(report.top_category || '—'), ''),
            item('本局答題總數', report.total_questions ?? 0, '題'),
            item('整體答對率', report.overall_accuracy ?? 0, '%'),
            item('答題平均用時', report.avg_answer_sec ?? 0, '秒')
        ].join('');
    }

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
</script>
</body>
</html>
