<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - 角色自定義</title>
    <!-- 引入與登入、大廳、個人主頁、學習統計一致的精選字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <script src="js/character-face.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --pixel-border: #1e272e;
            --bee-gold: #ffc048;
            --bee-yellow: #ffdd59;
            --bee-dark: #2f3542;
            --pixel-green: #05c46b;
            --pixel-blue: #0fbcf9;
            --pixel-red: #ff3f34;
            --bg-grid: #d2dae2;
            --card-bg: #ffffff;
            --text-dark: #1e272e;
            --text-gray: #747d8c;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-grid);
            /* 像素幾何網格背景 */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 28px 28px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 頂部像素風格導覽列 */
        header {
            margin: 0 !important;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            z-index: 100;
            border: none;
            border-bottom: 4px solid var(--pixel-border);
            box-shadow: none !important;
            flex-shrink: 0;
        }

        .header-left h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            line-height: 1;
            color: var(--bee-gold);
            text-shadow: 
                2px 2px 0 var(--pixel-border),
                -1.5px -1.5px 0 var(--pixel-border),
                2px -1.5px 0 var(--pixel-border),
                -1.5px 2px 0 var(--pixel-border),
                4px 4px 0 var(--bee-dark);
            letter-spacing: 2px;
            user-select: none;
            cursor: pointer;
        }

        .header-right { display: flex; align-items: center; gap: 18px; }

        .page-tag {
            background: #fffdf2;
            border: 3px solid var(--pixel-border);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-dark);
            box-shadow: 3px 3px 0 #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu-btn {
            background: white;
            border: 3px solid var(--pixel-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-shadow: 3px 3px 0 #000;
            transition: 0.1s;
        }
        .menu-btn:hover { background: #fffdf2; }
        .menu-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }

        .menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45); display: none; z-index: 999;
        }
        .menu-overlay.open { display: block; }

        .side-menu {
            position: fixed; top: 0; right: -320px; width: 320px; height: 100%;
            background: white; border-left: 4px solid var(--pixel-border);
            box-shadow: -8px 0 0 rgba(0,0,0,0.2);
            z-index: 1000; transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            padding: 90px 25px 35px; display: flex; flex-direction: column; gap: 14px;
        }
        .side-menu.open { right: 0; }

        .menu-item {
            padding: 14px 20px; font-weight: 900;
            color: var(--text-dark); text-decoration: none; display: flex;
            align-items: center; gap: 12px; transition: 0.1s; background: #f1f2f6;
            border: 3px solid var(--pixel-border); box-shadow: 3px 3px 0 #000;
        }
        .menu-item:hover { background: var(--bee-yellow); }
        .menu-item:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
        .menu-item.danger { margin-top: auto; color: white; background: var(--pixel-red); }

        /* 主容器佈局 */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            height: calc(100vh - 80px);
        }

        .container {
            display: flex;
            gap: 24px;
            width: 100%;
            max-width: 1180px;
            height: 100%;
        }

        /* 3D 模型預覽面板 */
        .model-panel {
            flex: 1;
            background: white;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0px #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .panel-header {
            padding: 18px 24px 10px;
            border-bottom: 3px solid var(--pixel-border);
            background: #fffdf5;
        }

        .panel-title {
            font-family: 'Silkscreen', 'Zen Maru Gothic', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-sub {
            font-size: 0.82rem;
            color: var(--text-gray);
            font-weight: 900;
            margin-top: 4px;
        }

        #model-canvas {
            flex: 1;
            width: 100%;
            display: block;
        }

        /* 右側編輯控制面板 */
        .right-panel {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .card {
            background: white;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0px #000;
            padding: 20px;
            flex-shrink: 0;
        }

        .card-title {
            font-family: 'Silkscreen', 'Zen Maru Gothic', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-dark);
            margin-bottom: 14px;
            border-bottom: 3px solid var(--pixel-border);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 顏色編輯 */
        .color-section { display: flex; flex-direction: column; gap: 8px; }

        .color-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            padding: 8px 12px;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            transition: 0.1s;
            cursor: pointer;
        }

        .color-row:hover { background: #fffdf2; }

        .color-swatch {
            width: 32px;
            height: 32px;
            border: 2px solid var(--pixel-border);
            box-shadow: 1px 1px 0 #000;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .color-swatch input[type="color"] {
            position: absolute;
            inset: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            opacity: 0;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .color-label-text {
            flex: 1;
            font-weight: 900;
            font-size: 0.92rem;
            color: var(--text-dark);
        }

        .color-hex {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-gray);
            font-family: monospace;
            letter-spacing: 0.04em;
        }

        .section-label {
            font-size: 0.82rem;
            font-weight: 900;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 14px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .preset-btn {
            padding: 7px 4px;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            background: white;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--text-dark);
            transition: 0.06s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .preset-btn:hover { background: #fffdf2; }
        .preset-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }

        .preset-dots { display: flex; gap: 2px; }
        .preset-dot {
            width: 8px;
            height: 8px;
            border: 1px solid var(--pixel-border);
        }

        /* 臉部五官 */
        .face-preview-wrap {
            width: 100%;
            background: #f5c18a;
            border: 3px solid var(--pixel-border);
            box-shadow: 3px 3px 0 #000;
            overflow: hidden;
            margin-bottom: 12px;
            line-height: 0;
        }

        .face-preview-wrap canvas { display: block; width: 100%; height: auto; }

        .feature-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }

        .feat-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            padding: 4px;
            cursor: pointer;
            background: white;
            transition: 0.06s ease;
        }

        .feat-opt:hover { background: #fffdf2; }
        .feat-opt.selected {
            background: var(--bee-yellow);
            border-color: #000;
        }

        .feat-opt canvas {
            display: block;
            border: 1px solid var(--pixel-border);
        }

        .feat-opt-label {
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--text-dark);
            white-space: nowrap;
        }

        .expr-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 4px;
        }

        .expr-btn {
            padding: 8px 4px;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            background: white;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--text-dark);
            transition: 0.06s ease;
            text-align: center;
            line-height: 1.3;
        }

        .expr-btn:hover { background: #fffdf2; }
        .expr-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }

        /* 相機 */
        .cam-preview {
            width: 100%;
            aspect-ratio: 4/3;
            background: #1e272e;
            border: 3px solid var(--pixel-border);
            box-shadow: inset 3px 3px 0 rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cam-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: none; }
        .face-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transform: scaleX(-1); }
        .cam-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #dfe4ea; }
        .cam-placeholder svg { opacity: 0.6; }
        .cam-placeholder p { font-size: 0.85rem; font-weight: 900; }

        /* 按鈕通用像素風 */
        .btn {
            width: 100%;
            padding: 13px;
            border: 3px solid var(--pixel-border);
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.06s ease;
            margin-top: 8px;
            user-select: none;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: translate(2px, 2px) !important;
            box-shadow: 0 0 0 #000 !important;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 4px 0 #000 !important;
        }

        .btn-blue {
            background: var(--pixel-blue);
            color: #ffffff;
            box-shadow: 0 4px 0 #000;
        }

        .btn-green {
            background: var(--pixel-green);
            color: #ffffff;
            box-shadow: 0 4px 0 #000;
        }

        .btn-red {
            background: #dfe4ea;
            color: var(--pixel-red);
            border-color: var(--pixel-border);
            box-shadow: 0 4px 0 #000;
        }

        .badge {
            display: block;
            text-align: center;
            padding: 8px 12px;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            font-size: 0.82rem;
            font-weight: 900;
            margin: 8px 0;
        }

        .badge.idle     { background: #f1f2f6; color: var(--text-dark); }
        .badge.live     { background: #dcfce7; color: #16a34a; }
        .badge.captured { background: #dbeafe; color: #1d4ed8; }

        .divider {
            height: 2px;
            background: #000;
            border-bottom: 2px dashed #a4b0be;
            margin: 14px 0;
        }

        /* 像素對話彈窗 */
        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            display: none; align-items: center; justify-content: center; z-index: 9999;
        }

        .modal-bg.show { display: flex; }

        .modal-box {
            background: white;
            border: 4px solid var(--pixel-border);
            box-shadow: 8px 8px 0px #000;
            padding: 34px 28px 28px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            animation: pixelPop 0.15s ease forwards;
        }

        .modal-box h3 {
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif !important;
            font-size: 1.45rem;
            font-weight: 900;
            margin-bottom: 12px;
            color: var(--text-dark);
        }

        .modal-box p {
            font-size: 1.05rem;
            color: var(--text-dark);
            font-weight: 900;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .modal-box button {
            width: 100%;
            padding: 13px;
            border: 3px solid var(--pixel-border);
            background: var(--bee-yellow);
            color: var(--text-dark);
            font-weight: 900;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            transition: 0.06s ease;
        }

        .modal-box button:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
        }

        /* 滾動條樣式 */
        .right-panel::-webkit-scrollbar { width: 8px; }
        .right-panel::-webkit-scrollbar-track { background: #dfe4ea; border-left: 2px solid var(--pixel-border); }
        .right-panel::-webkit-scrollbar-thumb { background: var(--pixel-border); }

        @keyframes pixelPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 850px) {
            header { padding: 0 20px; }
            .container { flex-direction: column; height: auto; }
            .right-panel { width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <h1 onclick="window.location.href='../../static/lobby.html'">BeeRich</h1>
    </div>
    <div class="header-right">
        <span class="page-tag"><span>🎨</span> 角色自定義</span>
        <button class="menu-btn" onclick="toggleMenu()">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="sideMenu">
    <a href="../../static/lobby.html"   class="menu-item"><span>🏠</span> 返回大廳</a>
    <a href="../../static/profile.html" class="menu-item"><span>👤</span> 個人主頁</a>
    <a href="../../static/guide.html"   class="menu-item"><span>📖</span> 遊戲說明</a>
    <div class="divider"></div>
    <div class="menu-item danger" onclick="logout()"><span>🚪</span> 登出</div>
</div>

<main>
    <div class="container">

        <!-- 左：3D 模型預覽 -->
        <div class="model-panel">
            <div class="panel-header">
                <div class="panel-title"><span>👾</span> 角色預覽</div>
                <div class="panel-sub">拖曳旋轉・滾輪縮放</div>
            </div>
            <canvas id="model-canvas"></canvas>
        </div>

        <!-- 右：操作面板 -->
        <div class="right-panel">

            <!-- ① 顏色編輯卡 -->
            <div class="card">
                <div class="card-title"><span>🎨</span> 外觀顏色編輯</div>
                <div class="color-section">
                    <div class="color-row" onclick="document.getElementById('color-head').click()">
                        <div class="color-swatch" id="swatch-head" style="background:#f5c18a">
                            <input type="color" id="color-head" value="#f5c18a" oninput="onColorInput('head',this.value)">
                        </div>
                        <span class="color-label-text">頭部 / 皮膚</span>
                        <span class="color-hex" id="hex-head">#f5c18a</span>
                    </div>
                    <div class="color-row" onclick="document.getElementById('color-arm').click()">
                        <div class="color-swatch" id="swatch-arm" style="background:#5cbaee">
                            <input type="color" id="color-arm" value="#5cbaee" oninput="onColorInput('arm',this.value)">
                        </div>
                        <span class="color-label-text">手臂</span>
                        <span class="color-hex" id="hex-arm">#5cbaee</span>
                    </div>
                    <div class="color-row" onclick="document.getElementById('color-body').click()">
                        <div class="color-swatch" id="swatch-body" style="background:#4a90d9">
                            <input type="color" id="color-body" value="#4a90d9" oninput="onColorInput('body',this.value)">
                        </div>
                        <span class="color-label-text">上衣</span>
                        <span class="color-hex" id="hex-body">#4a90d9</span>
                    </div>
                    <div class="color-row" onclick="document.getElementById('color-legs').click()">
                        <div class="color-swatch" id="swatch-legs" style="background:#2c4a8c">
                            <input type="color" id="color-legs" value="#2c4a8c" oninput="onColorInput('legs',this.value)">
                        </div>
                        <span class="color-label-text">褲子</span>
                        <span class="color-hex" id="hex-legs">#2c4a8c</span>
                    </div>
                    <div class="color-row" onclick="document.getElementById('color-feet').click()">
                        <div class="color-swatch" id="swatch-feet" style="background:#2c1f14">
                            <input type="color" id="color-feet" value="#2c1f14" oninput="onColorInput('feet',this.value)">
                        </div>
                        <span class="color-label-text">鞋子</span>
                        <span class="color-hex" id="hex-feet">#2c1f14</span>
                    </div>
                </div>
                <div class="section-label"><span>✨</span> 快速套色</div>
                <div class="preset-grid">
                    <button class="preset-btn" onclick="applyPreset('default')"><div class="preset-dots"><div class="preset-dot" style="background:#f5c18a"></div><div class="preset-dot" style="background:#5cbaee"></div><div class="preset-dot" style="background:#4a90d9"></div><div class="preset-dot" style="background:#2c4a8c"></div><div class="preset-dot" style="background:#2c1f14"></div></div>預設</button>
                    <button class="preset-btn" onclick="applyPreset('cool')"><div class="preset-dots"><div class="preset-dot" style="background:#c8e6f5"></div><div class="preset-dot" style="background:#4a8cbe"></div><div class="preset-dot" style="background:#2c6e9e"></div><div class="preset-dot" style="background:#1a3a5c"></div><div class="preset-dot" style="background:#0f2035"></div></div>冷色</button>
                    <button class="preset-btn" onclick="applyPreset('warm')"><div class="preset-dots"><div class="preset-dot" style="background:#f5c18a"></div><div class="preset-dot" style="background:#e06050"></div><div class="preset-dot" style="background:#c94040"></div><div class="preset-dot" style="background:#8c3030"></div><div class="preset-dot" style="background:#4a1a1a"></div></div>暖色</button>
                    <button class="preset-btn" onclick="applyPreset('dark')"><div class="preset-dots"><div class="preset-dot" style="background:#9e7a5c"></div><div class="preset-dot" style="background:#484848"></div><div class="preset-dot" style="background:#2c2c2c"></div><div class="preset-dot" style="background:#1a1a1a"></div><div class="preset-dot" style="background:#0f0f0f"></div></div>暗色</button>
                    <button class="preset-btn" onclick="applyPreset('forest')"><div class="preset-dots"><div class="preset-dot" style="background:#c8a87a"></div><div class="preset-dot" style="background:#5a8b55"></div><div class="preset-dot" style="background:#3a6b35"></div><div class="preset-dot" style="background:#2a4a28"></div><div class="preset-dot" style="background:#1a2a18"></div></div>森林</button>
                    <button class="preset-btn" onclick="applyPreset('fire')"><div class="preset-dots"><div class="preset-dot" style="background:#f5c18a"></div><div class="preset-dot" style="background:#f86030"></div><div class="preset-dot" style="background:#e84012"></div><div class="preset-dot" style="background:#a02808"></div><div class="preset-dot" style="background:#400000"></div></div>火焰</button>

<script>
// =====================================================
//  路徑設定
// =====================================================
const API_URL = location.origin;

const username = localStorage.getItem('username');
const token    = localStorage.getItem('token');
if (!username || !token) window.location.href = '../../static/login.html';

(async () => {
    try { await fetch(`${API_URL}/auth/verify_and_refresh?username=${encodeURIComponent(username)}`, { method: 'POST' }); } catch(e) {}
})();
setInterval(() => {
    fetch(`${API_URL}/auth/heartbeat?username=${encodeURIComponent(username)}`, { method: 'POST' }).catch(() => {});
}, 20000);

// =====================================================
//  Three.js Scene
// =====================================================
const canvas = document.getElementById('model-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0xf1f5f9, 1);

const scene       = new THREE.Scene();
const threeCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
threeCamera.position.set(0, 3, 12);

const grid = new THREE.GridHelper(30, 20, 0xdde3eb, 0xdde3eb);
grid.position.y = -0.05;
scene.add(grid);

const controls = new THREE.OrbitControls(threeCamera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.08;
controls.autoRotate      = true;
controls.autoRotateSpeed = 1.8;
controls.minDistance     = 4;
controls.maxDistance     = 20;

function resizeRenderer() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    threeCamera.aspect = w / h;
    threeCamera.updateProjectionMatrix();
}
window.addEventListener('resize', resizeRenderer);
window.addEventListener('load',   resizeRenderer);

let stream       = null;
let faceDetector = null;
let lastFaceBox  = null;
const videoEl    = document.getElementById('camVideo');
let lastDetectTime = 0;

function animateLoop(now) {
    requestAnimationFrame(animateLoop);
    resizeRenderer();
    controls.update();
    renderer.render(scene, threeCamera);
    if (faceDetector && stream && videoEl.readyState >= 2 && (now - lastDetectTime) > 100) {
        lastDetectTime = now;
        faceDetector.send({ image: videoEl }).catch(() => {});
    }
}
animateLoop(0);

// =====================================================
//  Color System
// =====================================================
const partColors = {
    head: '#f5c18a', arm: '#5cbaee', body: '#4a90d9', legs: '#2c4a8c', feet: '#2c1f14'
};

(function applyStoredColors() {
    const raw = localStorage.getItem('pypoly_char_colors');
    if (!raw) return;
    try {
        const saved = JSON.parse(raw);
        Object.keys(saved).forEach(k => { if (k in partColors) partColors[k] = saved[k]; });
        Object.entries(partColors).forEach(([g, hex]) => {
            const inp    = document.getElementById('color-'   + g);
            const swatch = document.getElementById('swatch-' + g);
            const hexEl  = document.getElementById('hex-'    + g);
            if (inp)    inp.value               = hex;
            if (swatch) swatch.style.background = hex;
            if (hexEl)  hexEl.textContent       = hex;
        });
    } catch(e) {}
})();

const PRESETS = {
    default: { head:'#f5c18a', arm:'#5cbaee', body:'#4a90d9', legs:'#2c4a8c', feet:'#2c1f14' },
    cool:    { head:'#c8e6f5', arm:'#4a8cbe', body:'#2c6e9e', legs:'#1a3a5c', feet:'#0f2035' },
    warm:    { head:'#f5c18a', arm:'#e06050', body:'#c94040', legs:'#8c3030', feet:'#4a1a1a' },
    dark:    { head:'#9e7a5c', arm:'#484848', body:'#2c2c2c', legs:'#1a1a1a', feet:'#0f0f0f' },
    forest:  { head:'#c8a87a', arm:'#5a8b55', body:'#3a6b35', legs:'#2a4a28', feet:'#1a2a18' },
    fire:    { head:'#f5c18a', arm:'#f86030', body:'#e84012', legs:'#a02808', feet:'#400000' },
    ocean:   { head:'#a8d8f0', arm:'#2897d6', body:'#0077b6', legs:'#005588', feet:'#002244' },
    purple:  { head:'#e8b4f0', arm:'#aa66ee', body:'#8844cc', legs:'#5522aa', feet:'#2a1066' }
};

// =====================================================
//  Shader
// =====================================================
let shaderMat = null;

const VERT = `
    varying vec3 vWorldPos;
    varying vec3 vNorm;
    void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vNorm = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
    }
`;
const FRAG = `
    uniform vec3      colorHead;
    uniform vec3      colorArm;
    uniform vec3      colorBody;
    uniform vec3      colorLegs;
    uniform vec3      colorFeet;
    uniform float     worldMinY;
    uniform float     worldMaxY;
    uniform float     armThreshX;
    uniform sampler2D faceTex;
    uniform float     hasFace;
    uniform float     headMinX;
    uniform float     headMaxX;
    uniform float     headMinY;
    uniform float     headMaxY;
    varying vec3      vWorldPos;
    varying vec3      vNorm;
    void main() {
        float t    = clamp((vWorldPos.y - worldMinY) / (worldMaxY - worldMinY), 0.0, 1.0);
        float absX = abs(vWorldPos.x);
        vec3 base;
        if (absX > armThreshX && t > 0.245 && t < 0.755) {
            base = (t > 0.50) ? colorArm : colorHead;
        } else {
            if (t > 0.75) {
                base = colorHead;
                if (hasFace > 0.5 && vNorm.z > 0.3) {
                    float fu = clamp((vWorldPos.x - headMinX) / (headMaxX - headMinX), 0.0, 1.0);
                    float fv = clamp((vWorldPos.y - headMinY) / (headMaxY - headMinY), 0.0, 1.0);
                    vec4 fc = texture2D(faceTex, vec2(fu, fv));
                    base = fc.rgb;
                }
            }
            else if (t > 0.375) base = colorBody;
            else if (t > 0.10)  base = colorLegs;
            else                base = colorFeet;
        }
        vec3 n = normalize(vNorm);
        float d  = max(dot(n, normalize(vec3(5.0, 12.0, 8.0))), 0.0);
        float f  = max(dot(n, normalize(vec3(-5.0, 3.0, -5.0))), 0.0) * 0.4;
        float ambient = (hasFace > 0.5 && t > 0.75 && vNorm.z > 0.3) ? 0.95 : 0.85;
        vec3 lit = base * (ambient + 0.5 * d + 0.15 * f);
        gl_FragColor = vec4(clamp(lit, 0.0, 1.0), 1.0);
    }
`;

function makeDummyTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 1;
    c.getContext('2d').fillStyle = '#f5c18a'; c.getContext('2d').fillRect(0,0,1,1);
    return new THREE.CanvasTexture(c);
}
function buildShaderMat(minY, maxY, armThreshX, headMinX, headMaxX, headMinY, headMaxY) {
    return new THREE.ShaderMaterial({
        uniforms: {
            colorHead:  { value: new THREE.Color(partColors.head) },
            colorArm:   { value: new THREE.Color(partColors.arm)  },
            colorBody:  { value: new THREE.Color(partColors.body) },
            colorLegs:  { value: new THREE.Color(partColors.legs) },
            colorFeet:  { value: new THREE.Color(partColors.feet) },
            worldMinY:  { value: minY }, worldMaxY: { value: maxY },
            armThreshX: { value: armThreshX },
            faceTex:    { value: makeDummyTexture() }, hasFace: { value: 0.0 },
            headMinX:   { value: headMinX }, headMaxX: { value: headMaxX },
            headMinY:   { value: headMinY }, headMaxY: { value: headMaxY }
        },
        vertexShader: VERT, fragmentShader: FRAG
    });
}
function updateShaderColors() {
    if (!shaderMat) return;
    shaderMat.uniforms.colorHead.value.set(partColors.head);
    shaderMat.uniforms.colorArm.value.set(partColors.arm);
    shaderMat.uniforms.colorBody.value.set(partColors.body);
    shaderMat.uniforms.colorLegs.value.set(partColors.legs);
    shaderMat.uniforms.colorFeet.value.set(partColors.feet);
}
function onColorInput(group, hex) {
    partColors[group] = hex;
    document.getElementById('swatch-' + group).style.background = hex;
    document.getElementById('hex-'    + group).textContent       = hex;
    updateShaderColors();
    if (localStorage.getItem('pypoly_char_features')) composeFaceTexture();
}
function applyPreset(name) {
    const p = PRESETS[name]; if (!p) return;
    Object.entries(p).forEach(([g, hex]) => {
        partColors[g] = hex;
        const inp = document.getElementById('color-' + g);
        if (inp) inp.value = hex;
        document.getElementById('swatch-' + g).style.background = hex;
        document.getElementById('hex-'    + g).textContent       = hex;
    });
    updateShaderColors();
    if (localStorage.getItem('pypoly_char_features')) composeFaceTexture();
}

async function saveCharacterToServer() {
    const token = localStorage.getItem('token');
    if (!token) { console.warn('⚠️ 未登入，角色僅存於本機'); return; }
    try {
        const res = await fetch(`${API_URL}/auth/character`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ version: 1, colors: partColors, features: faceFeatures })
        });
        if (res.ok) console.log('🎨 角色外觀已同步至伺服器');
        else console.warn('⚠️ 角色同步失敗：HTTP', res.status);
    } catch (err) {
        console.warn('⚠️ 角色同步失敗（僅存於本機）', err);
    }
}

function saveColors() {
    localStorage.setItem('pypoly_char_colors', JSON.stringify(partColors));
    saveCharacterToServer();
    saveCharacterPreviewImage();
    showModal('儲存成功', '角色外觀顏色已儲存！按下確定返回大廳。');
    document.querySelector('#modal button').onclick = () => window.location.href = '../../static/lobby.html';
}
function resetColors() {
    localStorage.removeItem('pypoly_char_colors');
    applyPreset('default');
    showModal('已重置', '已還原角色預設顏色。');
}
function loadSavedColors() {
    const raw = localStorage.getItem('pypoly_char_colors');
    if (!raw) { updateShaderColors(); return; }
    try {
        const saved = JSON.parse(raw).colors || JSON.parse(raw);
        Object.entries(saved).forEach(([g, hex]) => {
            if (!(g in partColors)) return;
            partColors[g] = hex;
            const inp = document.getElementById('color-' + g);
            if (inp) inp.value = hex;
            document.getElementById('swatch-' + g).style.background = hex;
            document.getElementById('hex-'    + g).textContent       = hex;
        });
        updateShaderColors();
    } catch(e) { updateShaderColors(); }
}

// =====================================================
//  Model Loader
// =====================================================
const loader = new THREE.GLTFLoader();
loader.load('models/minecraft_-_steve.glb', (gltf) => {
    const model = gltf.scene;

    const box0    = new THREE.Box3().setFromObject(model);
    const size0   = box0.getSize(new THREE.Vector3());
    const center0 = box0.getCenter(new THREE.Vector3());
    const autoScale = 3 / size0.y;
    model.scale.setScalar(autoScale);
    model.position.set(
        -center0.x * autoScale,
        -box0.min.y * autoScale,
        -center0.z * autoScale
    );

    scene.add(model);
    const fbox = new THREE.Box3().setFromObject(model);

    const armThreshX = (fbox.max.x - fbox.min.x) * 0.25;

    const headMinY = fbox.min.y + 0.75 * (fbox.max.y - fbox.min.y);
    const headMaxY = fbox.max.y;
    const headMinX = -armThreshX;
    const headMaxX =  armThreshX;

    shaderMat = buildShaderMat(
        fbox.min.y, fbox.max.y, armThreshX,
        headMinX, headMaxX, headMinY, headMaxY
    );

    model.traverse(child => {
        if (!child.isMesh) return;
        child.material = shaderMat;
    });

    const fsize   = fbox.getSize(new THREE.Vector3());
    const fcenter = fbox.getCenter(new THREE.Vector3());
    const maxDim  = Math.max(fsize.x, fsize.y, fsize.z);
    const fovR    = threeCamera.fov * (Math.PI / 180);
    const dist    = (maxDim / 2) / Math.tan(fovR / 2) * 2.2;
    threeCamera.position.set(fcenter.x, fcenter.y, fcenter.z + dist);
    controls.target.copy(fcenter);
    controls.minDistance = dist * 0.4;
    controls.maxDistance = dist * 4;
    controls.update();

    loadSavedColors();
    loadSavedFaceOrFeatures();

}, undefined, () => {
    showModal('模型載入失敗', '找不到角色模型，請確認 models/minecraft_-_steve.glb 存在。');
});

// =====================================================
//  Face Features System (方案 A — Canvas 繪製)
// =====================================================
const faceFeatures = { eyebrow: 'standard', eye: 'round', nose: 'none', mouth: 'smile' };

const FEATURE_OPTIONS = {
    eyebrow: [
        { id:'none',     label:'無' },
        { id:'standard', label:'標準' },
        { id:'arch',     label:'拱形' },
        { id:'angry',    label:'皺眉' },
        { id:'thick',    label:'濃眉' },
        { id:'sad',      label:'悲傷' },
    ],
    eye: [
        { id:'round',  label:'圓眼' },
        { id:'big',    label:'大眼' },
        { id:'half',   label:'半閉' },
        { id:'squint', label:'瞇眼' },
        { id:'wink',   label:'眨眼' },
    ],
    nose: [
        { id:'none',   label:'無' },
        { id:'button', label:'圓鼻' },
        { id:'dot',    label:'點狀' },
        { id:'cat',    label:'貓鼻' },
    ],
    mouth: [
        { id:'neutral',  label:'無表情' },
        { id:'smile',    label:'微笑' },
        { id:'grin',     label:'大笑' },
        { id:'surprise', label:'驚訝' },
        { id:'frown',    label:'皺眉' },
        { id:'smirk',    label:'壞笑' },
    ]
};

const EXPRESSION_PRESETS = [
    { label:'😀 開心', f:{ eyebrow:'arch',     eye:'big',    nose:'button', mouth:'grin'     } },
    { label:'😎 酷',   f:{ eyebrow:'standard', eye:'half',   nose:'none',   mouth:'neutral'  } },
    { label:'😠 生氣', f:{ eyebrow:'angry',    eye:'squint', nose:'none',   mouth:'frown'    } },
    { label:'😮 驚訝', f:{ eyebrow:'arch',     eye:'big',    nose:'button', mouth:'surprise' } },
    { label:'😢 悲傷', f:{ eyebrow:'sad',      eye:'round',  nose:'none',   mouth:'frown'    } },
    { label:'😺 貓咪', f:{ eyebrow:'arch',     eye:'round',  nose:'cat',    mouth:'smile'    } },
    { label:'😜 眨眼', f:{ eyebrow:'arch',     eye:'wink',   nose:'button', mouth:'smile'    } },
    { label:'😴 睡意', f:{ eyebrow:'none',     eye:'half',   nose:'none',   mouth:'neutral'  } },
];

function drawFeatureThumbnail(type, id) {
    const c = document.createElement('canvas'); c.width = c.height = 46;
    const ctx = c.getContext('2d');
    ctx.fillStyle = partColors.head || '#f5c18a';
    ctx.fillRect(0, 0, 46, 46);
    const cx = 23, cy = 23;

    if (type === 'eyebrow') {
        ctx.strokeStyle = '#3d1f0a'; ctx.lineCap = 'round';
        if (id === 'standard') { ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(4,cy); ctx.lineTo(42,cy); ctx.stroke(); }
        else if (id === 'arch')     { ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(4,cy+4); ctx.quadraticCurveTo(cx,cy-9,42,cy+4); ctx.stroke(); }
        else if (id === 'angry')    { ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(4,cy-7); ctx.lineTo(42,cy+7); ctx.stroke(); }
        else if (id === 'thick')    { ctx.lineWidth=7.5; ctx.beginPath(); ctx.moveTo(4,cy+4); ctx.quadraticCurveTo(cx,cy-9,42,cy+4); ctx.stroke(); }
        else if (id === 'sad')      { ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(4,cy+7); ctx.lineTo(42,cy-7); ctx.stroke(); }

    } else if (type === 'eye') {
        if (id === 'round' || id === 'big') {
            const r = id==='big' ? 16 : 13;
            ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#18182a'; ctx.beginPath(); ctx.arc(cx,cy,6,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(cx-3,cy-4,3.5,0,Math.PI*2); ctx.fill();
        } else if (id === 'half') {
            ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(cx,cy,13,Math.PI,0,false); ctx.closePath(); ctx.fill();
            ctx.fillStyle='#18182a'; ctx.beginPath(); ctx.arc(cx,cy,6,Math.PI,0,false); ctx.closePath(); ctx.fill();
        } else if (id === 'squint') {
            ctx.save(); ctx.translate(cx,cy); ctx.scale(1,0.32);
            ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#18182a'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
            ctx.restore();
        } else if (id === 'wink') {
            ctx.strokeStyle='#18182a'; ctx.lineWidth=3.5; ctx.lineCap='round';
            ctx.beginPath(); ctx.moveTo(cx-13,cy); ctx.quadraticCurveTo(cx,cy+8,cx+13,cy); ctx.stroke();
        }

    } else if (type === 'nose') {
        if (id === 'button') {
            ctx.fillStyle='rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(cx-8,cy,5,4,0,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(cx+8,cy,5,4,0,0,Math.PI*2); ctx.fill();
        } else if (id === 'dot') {
            ctx.fillStyle='rgba(0,0,0,0.25)';
            ctx.beginPath(); ctx.arc(cx-7,cy,3,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx+7,cy,3,0,Math.PI*2); ctx.fill();
        } else if (id === 'cat') {
            ctx.fillStyle='#d6609a';
            ctx.beginPath(); ctx.moveTo(cx,cy-9); ctx.lineTo(cx-12,cy+8); ctx.lineTo(cx+12,cy+8); ctx.closePath(); ctx.fill();
        }

    } else if (type === 'mouth') {
        ctx.strokeStyle='#3d1f0a'; ctx.lineCap='round';
        const mw=17, ma=9;
        if (id === 'neutral') {
            ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx-mw,cy); ctx.lineTo(cx+mw,cy); ctx.stroke();
        } else if (id === 'smile') {
            ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx-mw,cy-3); ctx.quadraticCurveTo(cx,cy+ma,cx+mw,cy-3); ctx.stroke();
        } else if (id === 'grin') {
            ctx.fillStyle='#1a0a02';
            ctx.beginPath(); ctx.moveTo(cx-mw,cy); ctx.quadraticCurveTo(cx,cy+ma*1.4,cx+mw,cy); ctx.closePath(); ctx.fill();
            ctx.fillStyle='#f0f0f0';
            ctx.beginPath(); ctx.moveTo(cx-mw,cy); ctx.quadraticCurveTo(cx,cy+ma*0.6,cx+mw,cy); ctx.closePath(); ctx.fill();
            ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx-mw,cy); ctx.quadraticCurveTo(cx,cy+ma*1.4,cx+mw,cy); ctx.stroke();
        } else if (id === 'surprise') {
            ctx.fillStyle='#1a0a02'; ctx.beginPath(); ctx.ellipse(cx,cy,9,12,0,0,Math.PI*2); ctx.fill();
        } else if (id === 'frown') {
            ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx-mw,cy+3); ctx.quadraticCurveTo(cx,cy-ma,cx+mw,cy+3); ctx.stroke();
        } else if (id === 'smirk') {
            ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx-mw,cy); ctx.quadraticCurveTo(cx+mw*0.4,cy+8,cx+mw,cy-5); ctx.stroke();
        }
    }
    return c;
}

function composeFaceTexture() {
    const faceCanvas = buildFaceCanvas(partColors, faceFeatures);

    const prev = document.getElementById('face-feat-preview');
    if (prev) {
        const pc = prev.getContext('2d');
        pc.clearRect(0, 0, 512, 512);
        pc.drawImage(faceCanvas, 0, 0);
    }

    if (shaderMat) {
        const prevTex = shaderMat.uniforms.faceTex.value;
        if (prevTex) prevTex.dispose();
        const tex = new THREE.CanvasTexture(faceCanvas);
        tex.needsUpdate = true;
        shaderMat.uniforms.faceTex.value = tex;
        shaderMat.uniforms.hasFace.value = 1.0;
        shaderMat.needsUpdate = true;
    }
    return faceCanvas;
}

function buildFeatureRows() {
    Object.keys(FEATURE_OPTIONS).forEach(type => {
        const row = document.getElementById(type + '-row');
        if (!row) return;
        row.innerHTML = '';
        FEATURE_OPTIONS[type].forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'feat-opt' + (faceFeatures[type] === opt.id ? ' selected' : '');
            btn.dataset.type = type;
            btn.dataset.id   = opt.id;

            const thumb = drawFeatureThumbnail(type, opt.id);
            thumb.width = thumb.height = 46;
            btn.appendChild(thumb);

            const label = document.createElement('span');
            label.className = 'feat-opt-label';
            label.textContent = opt.label;
            btn.appendChild(label);

            btn.onclick = () => selectFeature(type, opt.id);
            row.appendChild(btn);
        });
    });
}

function buildExpressionPresets() {
    const grid = document.getElementById('expr-grid');
    if (!grid) return;
    grid.innerHTML = '';
    EXPRESSION_PRESETS.forEach(preset => {
        const btn = document.createElement('button');
        btn.className = 'expr-btn';
        btn.textContent = preset.label;
        btn.onclick = () => applyExpressionPreset(preset.f);
        grid.appendChild(btn);
    });
}

function selectFeature(type, id) {
    faceFeatures[type] = id;
    document.querySelectorAll(`.feat-opt[data-type="${type}"]`).forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.id === id);
    });
    composeFaceTexture();
}

function applyExpressionPreset(preset) {
    Object.assign(faceFeatures, preset);
    buildFeatureRows();
    composeFaceTexture();
}

function updateFeatureSelectionUI() {
    Object.keys(faceFeatures).forEach(type => {
        document.querySelectorAll(`.feat-opt[data-type="${type}"]`).forEach(btn => {
            btn.classList.toggle('selected', btn.dataset.id === faceFeatures[type]);
        });
    });
}

function saveFaceFeatures() {
    const faceCanvas = composeFaceTexture();
    localStorage.setItem('pypoly_char_features', JSON.stringify(faceFeatures));
    localStorage.setItem('pypoly_char_face', faceCanvas.toDataURL('image/png'));
    saveCharacterToServer();
    saveCharacterPreviewImage();
    showModal('儲存成功', '臉部五官已儲存！按下確定返回大廳。');
    document.querySelector('#modal button').onclick = () => window.location.href = '../../static/lobby.html';
}

function clearFaceFeatures() {
    localStorage.removeItem('pypoly_char_features');
    localStorage.removeItem('pypoly_char_face');
    if (shaderMat) {
        const prevTex = shaderMat.uniforms.faceTex.value;
        if (prevTex) prevTex.dispose();
        shaderMat.uniforms.faceTex.value = makeDummyTexture();
        shaderMat.uniforms.hasFace.value = 0.0;
        shaderMat.needsUpdate = true;
    }
    const prev = document.getElementById('face-feat-preview');
    if (prev) {
        const ctx = prev.getContext('2d');
        ctx.fillStyle = partColors.head || '#f5c18a';
        ctx.fillRect(0, 0, 512, 512);
    }
    Object.assign(faceFeatures, { eyebrow:'standard', eye:'round', nose:'none', mouth:'smile' });
    updateFeatureSelectionUI();
    showModal('已清除', '臉部五官已清除。');
}

function loadSavedFaceOrFeatures() {
    const featRaw = localStorage.getItem('pypoly_char_features');
    if (featRaw) {
        try {
            Object.assign(faceFeatures, JSON.parse(featRaw));
            updateFeatureSelectionUI();
            composeFaceTexture();
            return;
        } catch(e) {}
    }
    const dataUrl = localStorage.getItem('pypoly_char_face');
    if (!dataUrl || !shaderMat) return;
    const img = new Image();
    img.onload = () => {
        const fc = document.createElement('canvas');
        fc.width = 512; fc.height = 512;
        fc.getContext('2d').drawImage(img, 0, 0, 512, 512);
        const prevTex = shaderMat.uniforms.faceTex.value;
        if (prevTex) prevTex.dispose();
        const tex = new THREE.CanvasTexture(fc);
        tex.needsUpdate = true;
        shaderMat.uniforms.faceTex.value = tex;
        shaderMat.uniforms.hasFace.value = 1.0;
        shaderMat.needsUpdate = true;
        document.getElementById('clearFaceBtn').disabled = false;
        setBadge('captured', '已載入儲存的人臉貼圖');
    };
    img.src = dataUrl;
}

buildFeatureRows();
buildExpressionPresets();

function refreshThumbnails() {
    Object.keys(FEATURE_OPTIONS).forEach(type => {
        document.querySelectorAll(`.feat-opt[data-type="${type}"] canvas`).forEach((thumbCanvas, i) => {
            const id = FEATURE_OPTIONS[type][i].id;
            const newThumb = drawFeatureThumbnail(type, id);
            const ctx = thumbCanvas.getContext('2d');
            ctx.clearRect(0, 0, 46, 46);
            ctx.drawImage(newThumb, 0, 0);
        });
    });
}

// =====================================================
//  Camera & Face Detection
// =====================================================
function initFaceDetector() {
    if (typeof FaceDetection === 'undefined' || faceDetector) return;
    faceDetector = new FaceDetection({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}`
    });
    faceDetector.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
    faceDetector.onResults(results => {
        const dets = results.detections || [];
        lastFaceBox = dets.length ? dets[0].boundingBox : null;
        drawFaceOverlay(dets);
        if (lastFaceBox) {
            document.getElementById('applyFaceBtn').disabled = false;
            setBadge('live', '偵測到人臉，可貼至角色臉部');
        } else {
            document.getElementById('applyFaceBtn').disabled = true;
            setBadge('live', '相機運作中，請對準臉部');
        }
    });
}

function drawFaceOverlay(detections) {
    const oc = document.getElementById('faceOverlay');
    if (!oc) return;
    if (oc.width !== oc.clientWidth || oc.height !== oc.clientHeight) {
        oc.width = oc.clientWidth || 320; oc.height = oc.clientHeight || 240;
    }
    const ctx = oc.getContext('2d');
    ctx.clearRect(0, 0, oc.width, oc.height);
    if (!detections.length) return;
    const bb = detections[0].boundingBox;
    const x = (bb.xCenter - bb.width/2) * oc.width;
    const y = (bb.yCenter - bb.height/2) * oc.height;
    const w = bb.width * oc.width, h = bb.height * oc.height;
    ctx.strokeStyle = '#05c46b'; ctx.lineWidth = 3; ctx.lineJoin = 'miter';
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = '#05c46b';
    ctx.font = `900 ${Math.max(12, oc.height*0.05)}px "Zen Maru Gothic", sans-serif`;
    ctx.fillText('偵測到人臉', x, y > 18 ? y-5 : y+h+16);
}

async function toggleCamera() {
    if (stream) stopCamera(); else await startCamera();
}
async function startCamera() {
    if (!navigator.mediaDevices?.getUserMedia) {
        showModal('無法開啟相機', '請透過 https:// 連線或使用 localhost。'); return;
    }
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { width:{ideal:640}, height:{ideal:480}, facingMode:'user' } });
        videoEl.srcObject = stream; videoEl.style.display = 'block';
        await videoEl.play();
        document.getElementById('camPlaceholder').style.display = 'none';
        document.getElementById('camToggleBtn').textContent = '關閉相機';
        setBadge('live', '相機運作中，請對準臉部');
        initFaceDetector();
    } catch(e) {
        showModal('無法開啟相機', '請確認已授予相機權限，且透過安全連線存取。');
    }
}
function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    videoEl.srcObject = null; videoEl.style.display = 'none';
    document.getElementById('camPlaceholder').style.display = 'flex';
    document.getElementById('camToggleBtn').textContent = '開啟相機';
    document.getElementById('applyFaceBtn').disabled = true;
    lastFaceBox = null;
    const oc = document.getElementById('faceOverlay');
    if (oc) oc.getContext('2d').clearRect(0, 0, oc.width, oc.height);
    setBadge('idle', '等待開啟相機');
}

function applyFaceToModel() {
    if (!lastFaceBox || !stream || videoEl.readyState < 2 || !shaderMat) return;
    const vw = videoEl.videoWidth || 640, vh = videoEl.videoHeight || 480;
    const cap = document.createElement('canvas'); cap.width = vw; cap.height = vh;
    cap.getContext('2d').drawImage(videoEl, 0, 0);
    const bb = lastFaceBox;
    const sx = Math.max(0, Math.floor((bb.xCenter - bb.width*0.45) * vw));
    const sy = Math.max(0, Math.floor((bb.yCenter - bb.height*0.45) * vh));
    const ex = Math.min(vw, Math.floor((bb.xCenter + bb.width*0.45) * vw));
    const ey = Math.min(vh, Math.floor((bb.yCenter + bb.height*0.45) * vh));
    const sw = ex-sx, sh = ey-sy;
    if (sw <= 0 || sh <= 0) return;
    const faceCanvas = document.createElement('canvas'); faceCanvas.width = 512; faceCanvas.height = 512;
    const fCtx = faceCanvas.getContext('2d');
    fCtx.save(); fCtx.scale(-1,1); fCtx.drawImage(cap, sx, sy, sw, sh, -512, 0, 512, 512); fCtx.restore();
    const prevTex = shaderMat.uniforms.faceTex.value; if (prevTex) prevTex.dispose();
    const tex = new THREE.CanvasTexture(faceCanvas); tex.needsUpdate = true;
    shaderMat.uniforms.faceTex.value = tex;
    shaderMat.uniforms.hasFace.value = 1.0;
    shaderMat.needsUpdate = true;
    localStorage.setItem('pypoly_char_face', faceCanvas.toDataURL('image/jpeg', 0.85));
    localStorage.removeItem('pypoly_char_features');
    Object.assign(faceFeatures, { eyebrow:'standard', eye:'round', nose:'none', mouth:'smile' });
    updateFeatureSelectionUI();
    document.getElementById('clearFaceBtn').disabled = false;
    setBadge('captured', '人臉已貼至角色臉部');
}

function clearFace() {
    if (!shaderMat) return;
    const prevTex = shaderMat.uniforms.faceTex.value; if (prevTex) prevTex.dispose();
    shaderMat.uniforms.faceTex.value = makeDummyTexture();
    shaderMat.uniforms.hasFace.value = 0.0;
    shaderMat.needsUpdate = true;
    localStorage.removeItem('pypoly_char_face');
    document.getElementById('clearFaceBtn').disabled = true;
    setBadge('idle', '已清除人臉貼圖');
}

function saveCharacterPreviewImage() {
    try {
        if (!renderer || !scene || !threeCamera) return;

        const originalBackground = scene.background;
        const oldClearColor = new THREE.Color();
        renderer.getClearColor(oldClearColor);
        const oldClearAlpha = renderer.getClearAlpha();

        scene.background = null;
        renderer.setClearColor(0x000000, 0); 

        let gridObject = null;
        scene.traverse((child) => {
            if (child instanceof THREE.GridHelper) {
                gridObject = child;
                child.visible = false; 
            }
        });

        controls.target.set(0, 1.5, 0);       
        threeCamera.position.set(0, 1.5, 3.8); 
        threeCamera.updateProjectionMatrix(); 
        controls.update();

        renderer.render(scene, threeCamera);
        const previewImage = renderer.domElement.toDataURL('image/png');
        localStorage.setItem('pypoly_char_preview', previewImage);
        
        const currentName = localStorage.getItem('username') || 'default_user';
        localStorage.setItem(`pypoly_char_preview_${currentName}`, previewImage);

        scene.background = originalBackground;
        renderer.setClearColor(oldClearColor, oldClearAlpha);
        if (gridObject) gridObject.visible = true;

        const currentUser = localStorage.getItem('username') || 'default_user';
        localStorage.setItem(`pypoly_char_created_${currentUser}`, "true"); 
        localStorage.setItem(`pypoly_char_colors_${currentUser}`, JSON.stringify(partColors));
        
        const faceData = localStorage.getItem('pypoly_char_face');
        if (faceData) {
            localStorage.setItem(`pypoly_char_face_${currentUser}`, faceData);
        }
    } catch (err) {
        console.error('儲存角色預覽圖失敗：', err);
    }
}

// =====================================================
//  UI Helpers
// =====================================================
function setBadge(type, text) {
    const b = document.getElementById('statusBadge');
    b.className = `badge ${type}`; b.textContent = text;
}
function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('open');
    document.getElementById('menuOverlay').classList.toggle('open');
}
function showModal(title, msg) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').textContent   = msg;
    document.getElementById('modal').classList.add('show');
}
async function logout() {
    try { await fetch(`${API_URL}/auth/logout?username=${encodeURIComponent(username)}&confirm=true`, { method:'POST' }); } catch(e) {}
    localStorage.clear();
    window.location.href = '../../static/login.html';
}
