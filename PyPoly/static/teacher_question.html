<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - 教師考題庫管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/jpeg">
    <style>
        :root {
            --pixel-border: #1e272e;
            --bee-gold: #ffc048;
            --bee-yellow: #ffdd59;
            --bee-dark: #2f3542;
            --pixel-green: #05c46b;
            --pixel-blue: #0fbcf9;
            --pixel-red: #ff3f34;
            --bg-grid: #d2dae2;
            --card-bg: #ffffff;
            --text-dark: #1e272e;
            --text-gray: #747d8c;
            --border-light: #1e272e;
            --danger-red: #ff3f34;
            --difficulty-easy: #05c46b;
            --difficulty-hard: #ff3f34;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-grid);
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 28px 28px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            width: 100%;
            background: white;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            border-bottom: 4px solid var(--pixel-border);
            flex-shrink: 0;
        }

        .header-left h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            line-height: 1;
            color: var(--bee-gold);
            text-shadow: 
                2px 2px 0 var(--pixel-border),
                -1.5px -1.5px 0 var(--pixel-border),
                2px -1.5px 0 var(--pixel-border),
                -1.5px 2px 0 var(--pixel-border),
                4px 4px 0 var(--bee-dark);
            letter-spacing: 2px;
            cursor: pointer;
        }

        .header-right { display: flex; align-items: center; gap: 14px; }

        .page-tag {
            background: #e0f2fe;
            border: 3px solid var(--pixel-border);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-dark);
            box-shadow: 3px 3px 0 #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-main {
            height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .admin-container {
            display: flex;
            gap: 25px;
            width: 95%;
            max-width: 1280px;
            height: 100%;
            align-items: stretch;
        }

        .admin-nav {
            width: 280px;
            background: white;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0px #000;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .admin-nav h2 {
            font-weight: 900;
            font-size: 1.35rem;
            margin-bottom: 10px;
            padding-left: 6px;
            color: var(--text-dark);
            border-bottom: 3px solid var(--pixel-border);
            padding-bottom: 8px;
        }

        .nav-link { 
            width: 100%;
            padding: 13px 16px;
            border: 3px solid var(--pixel-border);
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            color: var(--text-dark);
            transition: all 0.06s ease;
            text-decoration: none;
            box-shadow: 3px 3px 0 #000;
        }

        .nav-link:hover:not(.active) {
            background: #fffdf2;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #000;
        }

        .nav-link.active {
            background: var(--bee-yellow);
            color: var(--text-dark);
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }

        .admin-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow: hidden;
            height: 100%;
        }
        
        .board-header { 
            background: white;
            padding: 16px 24px;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        
        .select-filter { 
            padding: 9px 14px;
            border: 3px solid var(--pixel-border);
            font-weight: 900;
            font-size: 0.88rem;
            background: #fffdf5;
            color: var(--text-dark);
            outline: none;
            box-shadow: 2px 2px 0 #000;
            cursor: pointer;
        }

        .search-input {
            padding: 9px 14px;
            border: 3px solid var(--pixel-border);
            background: #fffdf5;
            width: 180px;
            font-weight: 900;
            font-size: 0.9rem;
            color: var(--text-dark);
            outline: none;
        }

        .btn-add { 
            padding: 11px 20px;
            background: var(--bee-yellow);
            color: var(--text-dark);
            border: 3px solid var(--pixel-border);
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #000;
            transition: 0.06s ease;
            white-space: nowrap;
        }
        .btn-add:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }

        .question-list { 
            background: white;
            flex: 1;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            padding: 24px 28px;
            overflow-y: auto;
        }

        .q-item {
            background: #f8fafc;
            padding: 20px 24px;
            border: 3px solid var(--pixel-border);
            box-shadow: 4px 4px 0 #000;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            transition: all 0.08s ease;
        }
        .q-item.is-class-item {
            background: #fffdf2;
            border-color: #000;
        }
        .q-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }

        .q-content { flex: 1; min-width: 0; }
        .q-tag-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }

        .q-tag {
            padding: 3px 10px;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            font-size: 0.75rem;
            font-weight: 900;
        }
        .tag-source-class { background: var(--bee-yellow); color: var(--text-dark); }
        .tag-source-official { background: #e2e8f0; color: #475569; }
        .tag-category { background: #e0f2fe; color: #0284c7; }
        .tag-easy { background: #ebfffa; color: var(--difficulty-easy); }
        .tag-normal { background: #fffbeb; color: #b45309; }
        .tag-hard { background: #fff5f5; color: var(--difficulty-hard); }
        .tag-choice { background: #e0f2fe; color: #0369a1; }
        .tag-gesture { background: #fdf2f8; color: #be185d; }
        .tag-code { background: #1e293b; color: #7dd3fc; }
        .tag-id { background: #f1f5f9; color: var(--text-gray); }

        .q-text {
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--text-dark);
            line-height: 1.5;
            margin-bottom: 8px;
            white-space: pre-wrap;
        }
        .q-meta { color: var(--text-gray); font-weight: 700; font-size: 0.9rem; }

        .q-code { 
            background: #1e272e;
            color: #ffdd59;
            padding: 12px 16px;
            border: 2px solid var(--pixel-border);
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            margin-bottom: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .action-btns { display: flex; flex-direction: column; gap: 8px; margin-left: 20px; }
        .btn-q {
            padding: 8px 16px;
            border: 2px solid var(--pixel-border);
            box-shadow: 3px 3px 0 #000;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.85rem;
            width: 96px;
            text-align: center;
        }
        .btn-q:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
        .btn-edit { background: #dfe4ea; color: var(--text-dark); }
        .btn-del { background: #fff5f5; color: var(--pixel-red); }

        /* 新增／編輯視窗（與 question.html 一致） */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
            display: none; justify-content: center; align-items: center; z-index: 500; padding: 20px;
        }
        .modal-mask.open { display: flex; }
        .modal-card {
            background: white; border-radius: 30px; padding: 30px 35px;
            width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }
        .modal-card h2 { font-weight: 900; font-size: 1.6rem; margin-bottom: 20px; }
        .form-row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
        .field { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 6px; }
        .field label { font-weight: 900; font-size: 0.85rem; color: var(--text-gray); }
        .field input, .field select, .field textarea {
            padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--border-light);
            font-weight: 700; background: #f8fafc; font-family: inherit; font-size: 0.95rem;
        }
        .field textarea { resize: vertical; min-height: 70px; }
        .field textarea.mono { font-family: 'Consolas', monospace; background: #0f172a; color: #7dd3fc; min-height: 110px; }
        .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--danger-red); background: #fff5f5; }
        .field .err { color: var(--danger-red); font-weight: 800; font-size: 0.78rem; min-height: 1em; }
        .hint { color: var(--text-gray); font-weight: 700; font-size: 0.8rem; }
        .modal-err { color: var(--danger-red); font-weight: 800; margin-bottom: 12px; min-height: 1.2em; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
        .btn-cancel { padding: 12px 25px; background: #e2e8f0; color: var(--text-dark); border: none; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .answer-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
        .answer-row label { font-weight: 800; display: flex; align-items: center; gap: 5px; }

        /* 像素刪除確認彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: none; justify-content: center; align-items: center; z-index: 3000;
        }
        .modal-content-status {
            background: white; padding: 32px 30px;
            border: 4px solid var(--pixel-border);
            box-shadow: 8px 8px 0px #000000;
            width: 420px; max-width: 90vw; text-align: center;
        }
        .modal-content-status h2 { font-weight: 900; font-size: 1.5rem; margin-bottom: 12px; color: var(--text-dark); }
        .modal-content-status p { font-weight: 900; color: var(--text-dark); margin-bottom: 24px; line-height: 1.6; font-size: 1rem; white-space: pre-wrap; }
        .modal-footer-status { display: flex; justify-content: center; gap: 12px; }
        .btn-3d {
            padding: 12px 26px; border: 3px solid var(--pixel-border);
            font-weight: 900; font-size: 1rem; cursor: pointer;
            color: var(--text-dark); background: var(--bee-yellow); box-shadow: 0 4px 0 #000;
        }
        .btn-3d:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #000; }

        .list-state { text-align: center; padding: 60px 20px; color: var(--text-gray); font-weight: 800; }
        .question-list::-webkit-scrollbar, .modal-card::-webkit-scrollbar { width: 8px; }
        .question-list::-webkit-scrollbar-track, .modal-card::-webkit-scrollbar-track { background: #dfe4ea; border-radius: 10px; }
        .question-list::-webkit-scrollbar-thumb, .modal-card::-webkit-scrollbar-thumb { background: var(--text-gray); border-radius: 10px; border: 2px solid #dfe4ea; }
    </style>
</head>
<body>

<header>
    <div class="header-left"><h1 onclick="location.href='teacher.html'">BeeRich</h1></div>
	<div class="header-right">
        <div class="page-tag">
            <span id="topActiveClassBadge" style="display: none; background: var(--bee-yellow); border: 2px solid var(--pixel-border); padding: 2px 8px; font-size: 0.85rem; box-shadow: 2px 2px 0 #000; margin-right: 4px;"></span>
            <span id="topTeacherTag">🧑‍🏫 教師考題庫管理</span>
        </div>
    </div>
</header>

<div class="admin-main">
    <div class="admin-container">
        <aside class="admin-nav">
            <h2><span>📋</span> 教師選單</h2>
            <a href="teacher.html" class="nav-link"><span>🎓</span> 學生管理</a>
            <a href="teacher_question.html" class="nav-link active"><span>❓</span> 考題庫管理</a>
            <a href="teacher_handbook.html" class="nav-link"><span>📖</span> 學習手冊</a>
            <a href="teacher.html?tab=profile" class="nav-link"><span>👤</span> 個人資料設定</a>
            <a href="lobby.html" class="nav-link"><span>🎮</span> 前往遊戲大廳</a>
            <a href="javascript:void(0);" class="nav-link" onclick="logout();" style="margin-top: auto; color: white; background: var(--pixel-red);"><span>🚪</span> 登出系統</a>
        </aside>

        <main class="admin-board">
            <div class="board-header">
                <div class="filter-group">
                    <select class="select-filter" id="filterSource">
                        <option value="all">全部題目 (官方＋本班)</option>
                        <option value="class">🏫 僅顯示本班專屬題</option>
                        <option value="official">🌐 僅顯示官方預設題</option>
                    </select>
                    <select class="select-filter" id="filterQtype">
                        <option value="">所有題型</option>
                        <option value="choice">四選一</option>
                        <option value="gesture">手勢比數字</option>
                        <option value="code">手打程式碼</option>
                    </select>
                    <select class="select-filter" id="filterTopic"><option value="">所有語法分類</option></select>
                    <select class="select-filter" id="filterDifficulty">
                        <option value="">所有難度</option>
                        <option value="easy">Easy</option>
                        <option value="normal">Normal</option>
                        <option value="hard">Hard</option>
                    </select>
                    <input class="search-input" id="filterKeyword" placeholder="🔍 搜尋題目內容…">
                </div>
                <button class="btn-add" id="btnAdd">+ 新增班級考題</button>
            </div>

            <div class="question-list" id="questionList">
                <div class="list-state">載入中…</div>
            </div>
        </main>
    </div>
</div>

<!-- 新增／編輯彈窗 -->
<div class="modal-mask" id="modalMask">
    <div class="modal-card">
        <h2 id="modalTitle">新增班級專屬考題</h2>
        <div class="modal-err" id="modalErr"></div>

        <div class="form-row">
            <div class="field" data-f="qtype">
                <label>題型</label>
                <select id="fQtype">
                    <option value="choice">四選一（基礎模式）</option>
                    <option value="gesture">手勢比數字（進階模式）</option>
                    <option value="code">手打程式碼（進階模式）</option>
                </select>
                <div class="err"></div>
            </div>
            <div class="field" data-f="category">
                <label>遊戲模式</label>
                <select id="fCategory">
                    <option value="basic">基礎 basic</option>
                    <option value="advanced">進階 advanced</option>
                </select>
                <div class="err"></div>
            </div>
            <div class="field" data-f="difficulty">
                <label>難度</label>
                <select id="fDifficulty">
                    <option value="easy">easy</option>
                    <option value="normal">normal</option>
                    <option value="hard">hard</option>
                </select>
                <div class="err"></div>
            </div>
            <div class="field" data-f="topic">
                <label>語法主題</label>
                <input id="fTopic" list="topicOptions" placeholder="例：迴圈">
                <datalist id="topicOptions"></datalist>
                <div class="err"></div>
            </div>
        </div>

        <div class="form-row">
            <div class="field" data-f="content">
                <label>題目內容</label>
                <textarea id="fContent" placeholder="題目敘述"></textarea>
                <div class="err"></div>
            </div>
        </div>

        <!-- 四選一 -->
        <div id="blockChoice">
            <div class="form-row">
                <div class="field" data-f="opt1"><label>選項 1</label><input id="fOpt1"><div class="err"></div></div>
                <div class="field" data-f="opt2"><label>選項 2</label><input id="fOpt2"><div class="err"></div></div>
            </div>
            <div class="form-row">
                <div class="field" data-f="opt3"><label>選項 3</label><input id="fOpt3"><div class="err"></div></div>
                <div class="field" data-f="opt4"><label>選項 4</label><input id="fOpt4"><div class="err"></div></div>
            </div>
            <div class="form-row">
                <div class="field" data-f="answerChoice">
                    <label>正確答案</label>
                    <div class="answer-row" id="answerChoiceRow"></div>
                    <div class="err"></div>
                </div>
            </div>
        </div>

        <!-- 手勢比數字 -->
        <div id="blockGesture">
            <div class="form-row">
                <div class="field" data-f="answerGesture">
                    <label>答案（玩家要比出的數字）</label>
                    <input id="fAnswerGesture" type="number" min="1" max="9">
                    <div class="hint">手勢辨識只認得 1~9，超出範圍的題目玩家永遠答不對。</div>
                    <div class="err"></div>
                </div>
            </div>
        </div>

        <!-- 手打程式碼 -->
        <div id="blockCode">
            <div class="form-row">
                <div class="field" data-f="reference_solution">
                    <label>參考解答（AI 判分依據，不會給玩家看到）</label>
                    <textarea id="fSolution" class="mono" spellcheck="false"></textarea>
                    <div class="err"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="field" data-f="expected_output">
                    <label>預期輸出（AI 判分依據，不會給玩家看到）</label>
                    <textarea id="fExpected" class="mono" spellcheck="false"></textarea>
                    <div class="err"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="field" data-f="starter_code">
                    <label>預填程式碼（選填，會出現在玩家的編輯器裡）</label>
                    <textarea id="fStarter" class="mono" spellcheck="false"></textarea>
                    <div class="err"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="field" data-f="time_limit_sec">
                    <label>作答時限（秒）</label>
                    <input id="fTimeLimit" type="number" min="1" value="300">
                    <div class="err"></div>
                </div>
                <div class="field" data-f="max_attempts">
                    <label>可驗證次數</label>
                    <input id="fMaxAttempts" type="number" min="1" value="3">
                    <div class="err"></div>
                </div>
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" id="btnCancel">取消</button>
            <button class="btn-add" id="btnSave" style="border-radius: 12px; box-shadow: none;">儲存考題</button>
        </div>
    </div>
</div>

<!-- 刪除確認彈窗 -->
<div id="statusModal" class="modal-overlay" style="display: none;">
    <div class="modal-content-status">
        <h2 id="statusModalTitle">標題</h2>
        <p id="statusModalMsg">內容訊息</p>
        <div class="modal-footer-status" id="statusModalFooter">
            <button class="btn-3d" onclick="closeStatusModal()">確定</button>
        </div>
    </div>
</div>

<script src="js/ngrok-fetch.js"></script>
<script>
    const API_URL = location.origin;
    let syncTimer = null;
    let editingId = null;
    let allQuestions = [];
    let myClassName = "";

    const QTYPE_LABEL = { choice: '四選一', gesture: '手勢比數字', code: '手打程式碼' };

    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        const username = localStorage.getItem('username');

        if (!token || (role !== 'teacher' && role !== 'admin') || !username) {
            window.location.href = 'login.html';
            return;
        }

        document.getElementById('topTeacherTag').innerText = `🧑‍🏫 ${username} 老師 — 考題庫管理`;
		
		const cachedClass = localStorage.getItem('teacher_active_class_name');
		if (cachedClass) {
			const badge = document.getElementById('topActiveClassBadge');
			badge.style.display = 'inline-block';
			badge.innerText = `🏫 ${cachedClass}`;
		}

        try {
            await fetch(`${API_URL}/auth/verify_and_refresh?username=${encodeURIComponent(username)}`, {
                method: "POST",
                headers: { 'Authorization': `Bearer ${token}` }
            });
            bindEvents();
            await loadMeta();
            await fetchQuestions();
        } catch (err) {
            console.error(err);
        }
    });

    function authHeaders(json = false) {
        const h = { 'Authorization': `Bearer ${localStorage.getItem('token')}` };
        if (json) h['Content-Type'] = 'application/json';
        return h;
    }

    async function readError(res) {
        try {
            const d = await res.json();
            if (d && d.detail) return typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail);
        } catch (e) {}
        return `伺服器回應 ${res.status}`;
    }

    async function loadMeta() {
        try {
            const res = await fetch(`${API_URL}/teacher/questions/meta`, { headers: authHeaders() });
            if (!res.ok) return;
            const meta = await res.json();
            const topicSel = document.getElementById('filterTopic');
            const datalist = document.getElementById('topicOptions');
            topicSel.innerHTML = '<option value="">所有語法分類</option>';
            datalist.innerHTML = '';
            (meta.topics || []).forEach(t => {
                topicSel.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`);
                datalist.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(t)}">`);
            });
        } catch (err) {}
    }

    async function fetchQuestions() {
		const list = document.getElementById('questionList');
		const params = new URLSearchParams();
		const source = document.getElementById('filterSource').value;
		const qtype = document.getElementById('filterQtype').value;
		const topic = document.getElementById('filterTopic').value;
		const diff = document.getElementById('filterDifficulty').value;
		const kw = document.getElementById('filterKeyword').value.trim();

		if (source) params.set('source', source);
		if (qtype) params.set('qtype', qtype);
		if (topic) params.set('topic', topic);
		if (diff) params.set('difficulty', diff);
		if (kw) params.set('q', kw);

		// 🏆 必須在 fetch 發送之前，先把 activeClassId 設定到 params 裡
		const activeClassId = localStorage.getItem('teacher_active_class_id');
		if (activeClassId) {
			params.set('class_id', activeClassId);
		}

		try {
			const res = await fetch(`${API_URL}/teacher/questions?${params}`, { headers: authHeaders() });
			if (!res.ok) {
				list.innerHTML = `<div class="list-state">載入失敗：${escapeHtml(await readError(res))}</div>`;
				return;
			}
			const data = await res.json();
			myClassName = data.class_name || "";
			
			const badge = document.getElementById('topActiveClassBadge');
			if (badge) {
				if (myClassName) {
					badge.style.display = 'inline-block';
					badge.innerText = `🏫 ${myClassName}`;
					localStorage.setItem('teacher_active_class_name', myClassName);
				} else {
					badge.style.display = 'none';
				}
			}
			
			allQuestions = data.items || [];
			renderQuestions();
		} catch (err) {
			list.innerHTML = `<div class="list-state">載入失敗</div>`;
		}
	}

    function renderQuestions() {
        const list = document.getElementById('questionList');
        if (!allQuestions.length) {
            list.innerHTML = '<div class="list-state">沒有符合條件的題目。</div>';
            return;
        }
        list.innerHTML = allQuestions.map(q => {
            const qtype = q.qtype || 'choice';
            const isClassQuestion = q.class_id !== null && q.class_id !== undefined;
            const sourceBadge = isClassQuestion
                ? `<span class="q-tag tag-source-class">🏫 本班專屬（${escapeHtml(myClassName || '班級')}）</span>`
                : `<span class="q-tag tag-source-official">🌐 官方基底題</span>`;

            let body = '';
            if (qtype === 'choice') {
                const opts = [q.opt1, q.opt2, q.opt3, q.opt4];
                body = `<p class="q-meta">${opts.map((o, i) =>
                    `(${'ABCD'[i]}) ${escapeHtml(o || '')}`).join(' ')}
                     <strong>正解：${'ABCD'[(q.answer || 1) - 1] || '?'}</strong></p>`;
            } else if (qtype === 'gesture') {
                body = `<p class="q-meta">答案（要比出的手勢）：<strong>${q.answer ?? '?'}</strong></p>`;
            } else {
                body = `<div class="q-code">${escapeHtml(q.reference_solution || '（未填參考解答）')}</div>
                        <p class="q-meta">預期輸出：<strong>${escapeHtml(q.expected_output || '（未填）')}</strong></p>`;
            }

            const actionHtml = isClassQuestion
                ? `<div class="action-btns">
                       <button class="btn-q btn-edit" data-edit="${q.id}">編輯</button>
                       <button class="btn-q btn-del" data-del="${q.id}">刪除</button>
                   </div>`
                : `<div class="action-btns">
                       <button class="btn-q btn-edit" data-copy="${q.id}" title="以官方題為範本建立班級題">📋 複製改編</button>
                   </div>`;

            return `
                <div class="q-item ${isClassQuestion ? 'is-class-item' : ''}">
                    <div class="q-content">
                        <div class="q-tag-row">
                            ${sourceBadge}
                            <span class="q-tag tag-id">#${q.id}</span>
                            <span class="q-tag tag-${qtype}">${QTYPE_LABEL[qtype] || qtype}</span>
                            <span class="q-tag tag-category">${escapeHtml(q.topic || '')}</span>
                            <span class="q-tag tag-${q.difficulty}">${escapeHtml(q.difficulty || '')}</span>
                        </div>
                        <p class="q-text">${escapeHtml(q.content || '')}</p>
                        ${body}
                    </div>
                    ${actionHtml}
                </div>`;
        }).join('');
    }

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function bindEvents() {
        ['filterSource', 'filterQtype', 'filterTopic', 'filterDifficulty'].forEach(id =>
            document.getElementById(id).addEventListener('change', fetchQuestions));

        let kwTimer = null;
        document.getElementById('filterKeyword').addEventListener('input', () => {
            clearTimeout(kwTimer);
            kwTimer = setTimeout(fetchQuestions, 300);
        });

        document.getElementById('btnAdd').addEventListener('click', () => openModal(null));
        document.getElementById('btnCancel').addEventListener('click', closeModal);
        document.getElementById('btnSave').addEventListener('click', saveQuestion);
        document.getElementById('fQtype').addEventListener('change', onQtypeChange);

        document.getElementById('questionList').addEventListener('click', (e) => {
            const edit = e.target.closest('[data-edit]');
            if (edit) return openModal(Number(edit.dataset.edit), false);
            const copy = e.target.closest('[data-copy]');
            if (copy) return openModal(Number(copy.dataset.copy), true);
            const del = e.target.closest('[data-del]');
            if (del) return deleteQuestion(Number(del.dataset.del));
        });

        document.getElementById('modalMask').addEventListener('click', (e) => {
            if (e.target.id === 'modalMask') closeModal();
        });

        document.getElementById('answerChoiceRow').innerHTML = [1, 2, 3, 4].map(n =>
            `<label><input type="radio" name="answerChoice" value="${n}"> 選項 ${n}</label>`).join('');
    }

    function onQtypeChange() {
        const t = document.getElementById('fQtype').value;
        document.getElementById('blockChoice').style.display = t === 'choice' ? '' : 'none';
        document.getElementById('blockGesture').style.display = t === 'gesture' ? '' : 'none';
        document.getElementById('blockCode').style.display = t === 'code' ? '' : 'none';
        document.getElementById('fCategory').value = t === 'choice' ? 'basic' : 'advanced';
    }

    function setVal(id, v) { document.getElementById(id).value = v ?? ''; }

    function openModal(id, isCopy = false) {
        editingId = isCopy ? null : id;
        document.getElementById('modalErr').textContent = '';
        document.getElementById('modalTitle').textContent = isCopy
            ? `📋 複製改編為本班專屬考題`
            : (id ? `編輯班級考題 #${id}` : '➕ 新增班級專屬考題');

        const q = id ? allQuestions.find(x => x.id === id) : null;
        document.getElementById('fQtype').value = q ? (q.qtype || 'choice') : 'choice';
        onQtypeChange();
        setVal('fCategory', q ? q.category : 'basic');
        setVal('fDifficulty', q ? q.difficulty : 'easy');
        setVal('fTopic', q ? q.topic : '');
        setVal('fContent', q ? q.content : '');
        setVal('fOpt1', q ? q.opt1 : ''); setVal('fOpt2', q ? q.opt2 : '');
        setVal('fOpt3', q ? q.opt3 : ''); setVal('fOpt4', q ? q.opt4 : '');
        setVal('fAnswerGesture', q && q.qtype === 'gesture' ? q.answer : '');
        setVal('fSolution', q ? q.reference_solution : '');
        setVal('fExpected', q ? q.expected_output : '');
        setVal('fStarter', q ? q.starter_code : '');
        setVal('fTimeLimit', q && q.time_limit_sec ? q.time_limit_sec : 300);
        setVal('fMaxAttempts', q && q.max_attempts ? q.max_attempts : 3);

        document.querySelectorAll('input[name="answerChoice"]').forEach(r => {
            r.checked = !!(q && q.qtype === 'choice' && String(q.answer) === r.value);
        });

        if (q) document.getElementById('fCategory').value = q.category;
        document.getElementById('modalMask').classList.add('open');
    }

    function closeModal() {
        document.getElementById('modalMask').classList.remove('open');
        editingId = null;
    }

    function collectPayload() {
        const qtype = document.getElementById('fQtype').value;
        const p = {
            qtype,
            category: document.getElementById('fCategory').value,
            difficulty: document.getElementById('fDifficulty').value,
            topic: document.getElementById('fTopic').value,
            content: document.getElementById('fContent').value,
        };
        if (qtype === 'choice') {
            p.opt1 = document.getElementById('fOpt1').value;
            p.opt2 = document.getElementById('fOpt2').value;
            p.opt3 = document.getElementById('fOpt3').value;
            p.opt4 = document.getElementById('fOpt4').value;
            const picked = document.querySelector('input[name="answerChoice"]:checked');
            p.answer = picked ? Number(picked.value) : null;
        } else if (qtype === 'gesture') {
            const v = document.getElementById('fAnswerGesture').value;
            p.answer = v === '' ? null : Number(v);
        } else {
            p.reference_solution = document.getElementById('fSolution').value;
            p.expected_output = document.getElementById('fExpected').value;
            p.starter_code = document.getElementById('fStarter').value;
            p.time_limit_sec = Number(document.getElementById('fTimeLimit').value) || 300;
            p.max_attempts = Number(document.getElementById('fMaxAttempts').value) || 3;
        }
        return p;
    }

    async function saveQuestion() {
        const p = collectPayload();
        const errBox = document.getElementById('modalErr');
        errBox.textContent = '';

        const btn = document.getElementById('btnSave');
        btn.disabled = true;
        try {
            const activeClassId = localStorage.getItem('teacher_active_class_id') || '';
			const url = editingId
				? `${API_URL}/teacher/questions/${editingId}?class_id=${encodeURIComponent(activeClassId)}`
				: `${API_URL}/teacher/questions?class_id=${encodeURIComponent(activeClassId)}`;
            const res = await fetch(url, {
                method: editingId ? 'PUT' : 'POST',
                headers: authHeaders(true),
                body: JSON.stringify(p)
            });
            if (!res.ok) {
                errBox.textContent = await readError(res);
                return;
            }
            closeModal();
            await loadMeta();
            await fetchQuestions();
        } catch (err) {
            errBox.textContent = err.message || String(err);
        } finally {
            btn.disabled = false;
        }
    }

    function deleteQuestion(id) {
        const q = allQuestions.find(x => x.id === id);
        const preview = q ? (q.content || '').slice(0, 60) : '';

        const modal = document.getElementById('statusModal');
        document.getElementById('statusModalTitle').innerText = '⚠️ 刪除確認';
        document.getElementById('statusModalTitle').style.color = 'var(--pixel-red)';
        document.getElementById('statusModalMsg').innerText = `確定要刪除這筆班級考題嗎？此動作無法復原。\n\n#${id} ${preview}`;

        document.getElementById('statusModalFooter').innerHTML = `
            <button class="btn-3d" style="background: var(--pixel-red); color: white; margin-right: 10px;" id="confirmDelBtn">確定</button>
            <button class="btn-3d" style="background: #dfe4ea; color: var(--text-dark);" onclick="closeStatusModal()">取消</button>
        `;

        document.getElementById('confirmDelBtn').onclick = async () => {
            closeStatusModal();
            const res = await fetch(`${API_URL}/teacher/questions/${id}`, {
                method: 'DELETE',
                headers: authHeaders()
            });
            if (res.ok) await fetchQuestions();
        };
        modal.style.display = 'flex';
    }

    function closeStatusModal() {
        document.getElementById('statusModal').style.display = 'none';
    }

    async function logout() {
        const username = localStorage.getItem('username');
        if (username) {
            try { await fetch(`${API_URL}/auth/logout?username=${encodeURIComponent(username)}&confirm=true`, { method: 'POST' }); } catch (e) {}
        }
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
