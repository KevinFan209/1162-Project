<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - Python 學習手冊</title>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/jpeg">
    <!-- 🏆 確保這裡沒有引入 three.js 等 3D 引擎 -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700;900&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-border: #1e272e;
            --bee-gold: #ffc048;
            --bee-yellow: #ffdd59;
            --bee-dark: #2f3542;
            --pixel-green: #05c46b;
            --pixel-blue: #0fbcf9;
            --pixel-red: #ff3f34;
            --pixel-purple: #a55eea;
            --bg-grid: #eef2f7;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-grid);
            background-image: 
                linear-gradient(rgba(210, 218, 226, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(210, 218, 226, 0.4) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--bee-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 頂部導航列 */
        header {
            background: #ffffff;
            border-bottom: 4px solid var(--pixel-border);
            padding: 15px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bee-logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 3px solid var(--pixel-border);
            object-fit: contain;
            background: var(--bee-yellow);
        }

        .header-title h1 {
            font-family: 'Silkscreen', 'Zen Maru Gothic', sans-serif;
            font-size: 1.8rem;
            color: var(--bee-dark);
            letter-spacing: -0.5px;
        }

        .header-title p {
            font-size: 0.85rem;
            color: #747d8c;
            font-weight: 700;
        }

        .btn-pixel {
            background: var(--bee-yellow);
            border: 3px solid var(--pixel-border);
            box-shadow: 3px 3px 0 var(--pixel-border);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--bee-dark);
            font-size: 1rem;
            transition: all 0.1s ease;
        }

        .btn-pixel:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--pixel-border);
            background: var(--bee-gold);
        }

        .btn-pixel:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--pixel-border);
        }

        /* 頁面主體 */
        main {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 25px 60px 25px;
            flex: 1;
        }

        /* 搜尋與過濾區塊 */
        .controls-card {
            background: white;
            border: 4px solid var(--pixel-border);
            border-radius: 20px;
            box-shadow: 6px 6px 0 var(--pixel-border);
            padding: 22px 28px;
            margin-bottom: 30px;
        }

        .search-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border: 3px solid var(--pixel-border);
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--bee-dark);
            background: #f8fafc;
            outline: none;
            transition: 0.2s;
        }

        .search-box input:focus {
            background: #ffffff;
            border-color: var(--pixel-blue);
            box-shadow: 0 0 0 4px rgba(15, 188, 249, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #747d8c;
            pointer-events: none;
        }

        /* 分類過濾標籤 */
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab-btn {
            background: #f1f2f6;
            border: 3px solid var(--pixel-border);
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--bee-dark);
            transition: all 0.15s;
            box-shadow: 2px 2px 0 var(--pixel-border);
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            background: #dfe4ea;
        }

        .tab-btn.active {
            background: var(--bee-yellow);
            box-shadow: 3px 3px 0 var(--pixel-border);
            transform: translateY(-2px);
        }

        /* 卡片網格 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }

        /* 知識卡片 */
        .handbook-card {
            background: white;
            border: 4px solid var(--pixel-border);
            border-radius: 20px;
            box-shadow: 6px 6px 0 var(--pixel-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .handbook-card:hover {
            transform: translateY(-4px);
            box-shadow: 8px 8px 0 var(--pixel-border);
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 3px solid var(--pixel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
        }

        .card-category-badge {
            font-size: 0.8rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 8px;
            border: 2px solid var(--pixel-border);
            display: inline-block;
        }

        .cat-basic { background: #ffeaa7; }
        .cat-cond { background: #74b9ff; }
        .cat-loop { background: #55efc4; }
        .cat-data { background: #fab1a0; }
        .cat-func { background: #a29bfe; }

        .card-level {
            font-size: 0.8rem;
            font-weight: 900;
            color: #747d8c;
        }

        .card-body {
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--bee-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #4b6584;
            line-height: 1.6;
            font-weight: 700;
        }

        /* 程式碼區塊 */
        .code-block-wrap {
            position: relative;
            background: #1e272e;
            border: 3px solid var(--pixel-border);
            border-radius: 12px;
            padding: 14px 16px;
            overflow-x: auto;
        }

        .code-block {
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 0.92rem;
            color: #f1f2f6;
            line-height: 1.5;
            white-space: pre;
        }

        .code-comment { color: #a4b0be; font-style: italic; }
        .code-keyword { color: #ff7675; font-weight: bold; }
        .code-func { color: #74b9ff; }
        .code-str { color: #55efc4; }
        .code-num { color: #feca57; }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 初學者常犯錯誤/提示框 */
        .tip-box {
            background: #fff8e7;
            border: 2px dashed #f39c12;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            color: #b7791f;
            font-weight: 800;
            line-height: 1.5;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        /* 空結果狀態 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border: 4px solid var(--pixel-border);
            border-radius: 20px;
            box-shadow: 6px 6px 0 var(--pixel-border);
        }
        .empty-state h3 { font-size: 1.5rem; margin-bottom: 8px; }
        .empty-state p { color: #747d8c; font-weight: 700; }

        @media (max-width: 768px) {
            header { padding: 12px 20px; }
            .header-title h1 { font-size: 1.4rem; }
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="static/logo.jpg" alt="Bee Logo" class="bee-logo" onerror="this.src='logo.jpg'">
        <div class="header-title">
            <h1>BeeRich 學習手冊</h1>
            <p>PYTHON KNOWLEDGE BASE & CHEAT SHEET</p>
        </div>
    </div>
    <a href="lobby.html" class="btn-pixel">
        <span>🔙</span> 返回大廳
    </a>
</header>

<main>
    <div class="controls-card">
        <div class="search-row">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜尋語法、關鍵字（例如：for, if, print, 縮排, 串列）..." oninput="handleSearch()">
            </div>
        </div>

        <div class="filter-tabs" id="filterTabs">
            <button class="tab-btn active" data-cat="all" onclick="filterCategory('all', this)">🐝 全部知識庫 (<span id="count-all">0</span>)</button>
            <button class="tab-btn" data-cat="basic" onclick="filterCategory('basic', this)">📌 基礎與輸入輸出</button>
            <button class="tab-btn" data-cat="data" onclick="filterCategory('data', this)">📦 變數與型態</button>
            <button class="tab-btn" data-cat="cond" onclick="filterCategory('cond', this)">⚖️ 條件判斷 (if/else)</button>
            <button class="tab-btn" data-cat="loop" onclick="filterCategory('loop', this)">🔄 迴圈控制 (for/while)</button>
            <button class="tab-btn" data-cat="list" onclick="filterCategory('list', this)">📑 串列與字典</button>
            <button class="tab-btn" data-cat="func" onclick="filterCategory('func', this)">🧩 自訂函式 (def)</button>
        </div>
    </div>

    <div class="cards-grid" id="cardsGrid">
        <!-- 卡片將由 JS 渲染 -->
    </div>
</main>

<script src="js/ngrok-fetch.js"></script>

<script>
    const API_URL = location.origin;
    let handbookData = []; 
    let currentCategory = 'all';

    // 🏆 頁面初始化：優先從 FastAPI 後端資料庫抓取教材
    // 🏆 頁面初始化：帶上學生帳號向 FastAPI 後端抓取「官方＋所屬班級」教材
    window.onload = async () => {
        try {
            const currentUser = localStorage.getItem('username') || '';
            const res = await fetch(`${API_URL}/handbook/list?username=${encodeURIComponent(currentUser)}`, {
                headers: { 'Accept': 'application/json' }
            });
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    handbookData = data;
                }
            }
        } catch (err) {
            console.warn("後端資料庫連線失敗，自動載入本機預設教材", err);
        }

        // 如果資料庫還是空的或網路斷線，使用內建保底資料
        if (!handbookData || handbookData.length === 0) {
            handbookData = getFallbackData();
        }

        updateCategoryCounts();
        renderCards(handbookData);
    };

    // 計算各分類數量
    function updateCategoryCounts() {
        document.getElementById('count-all').innerText = handbookData.length;
    }

    // 渲染卡片
    function renderCards(list) {
        const grid = document.getElementById('cardsGrid');
        if (list.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <h3>🔍 找不到符合的知識卡片</h3>
                    <p>請嘗試使用其他關鍵字（例如：print, 變數, 引號, if, 縮排）</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = list.map(item => `
            <div class="handbook-card" data-category="${item.category}">
                <div class="card-header">
                    <span class="card-category-badge ${item.cat_class || 'cat-basic'}">${item.cat_name || '入門'}</span>
                    <span class="card-level">${item.level || '★☆☆ 啟蒙'}</span>
                </div>
                <div class="card-body">
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    <div class="card-desc">${escapeHtml(item.description)}</div>
                    
                    ${item.code_example ? `
                    <div class="code-block-wrap">
                        <!-- 🏆 核心修正：改用 data-code 儲存原始程式碼，避免 onclick 被雙引號截斷 -->
                        <button class="copy-btn" data-code="${escapeHtml(item.code_example)}" onclick="copyCode(this)">複製</button>
                        <div class="code-block">${formatPythonSyntax(item.code_example)}</div>
                    </div>` : ''}

                    ${item.tip ? `
                    <div class="tip-box">
                        <span>💡</span>
                        <span>${escapeHtml(item.tip)}</span>
                    </div>` : ''}
                </div>
            </div>
        `).join('');
    }

    // 🏆 語法高亮修正：因為字串已經過 escapeHtml 轉換，引號必須對應尋找 &quot; 與 &apos;
    function formatPythonSyntax(raw) {
        let safeText = escapeHtml(raw);
        
        // 加入 (?<!&) 防止把 HTML Entity(&quot; 或 &apos;) 當成數字或註解錯誤匹配
        safeText = safeText.replace(/(?<!&)(#.*$)/gm, '<span class="code-comment">$1</span>');
        safeText = safeText.replace(/\b(print|len|range|int|str|float|bool)\b/g, '<span class="code-func">$1</span>');
        safeText = safeText.replace(/\b(def|return|if|elif|else|for|while|in|and|or|not|True|False)\b/g, '<span class="code-keyword">$1</span>');
        safeText = safeText.replace(/(&quot;.*?&quot;|&apos;.*?&apos;)/g, '<span class="code-str">$1</span>');
        safeText = safeText.replace(/(?<![&#])\b(\d+)\b/g, '<span class="code-num">$1</span>');
        
        return safeText;
    }

    function filterCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        applyFilters();
    }

    function handleSearch() {
        applyFilters();
    }

    function applyFilters() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = handbookData.filter(item => {
            const matchesCat = (currentCategory === 'all') || (item.category === currentCategory);
            const matchesSearch = !query || 
                (item.title && item.title.toLowerCase().includes(query)) || 
                (item.description && item.description.toLowerCase().includes(query)) || 
                (item.code_example && item.code_example.toLowerCase().includes(query)) ||
                (item.tip && item.tip.toLowerCase().includes(query));
            return matchesCat && matchesSearch;
        });
        renderCards(filtered);
    }

    // 🏆 修正二：加入 HTTP 環境的剪貼簿備用方案 (Fallback)，解決區域網路報錯
    function copyCode(btn) {
        const text = btn.getAttribute('data-code');
        
        const showSuccess = () => {
            const oldText = btn.innerText;
            btn.innerText = "已複製！";
            btn.style.background = "var(--pixel-green)";
            btn.style.color = "#fff";
            setTimeout(() => {
                btn.innerText = oldText;
                btn.style.background = "";
                btn.style.color = "";
            }, 1500);
        };

        // 如果在 HTTPS 下且支援 Clipboard API
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(showSuccess).catch(err => {
                fallbackCopy(text, showSuccess);
            });
        } else {
            // 如果在 HTTP 區網下，啟動傳統 textarea 複製模式
            fallbackCopy(text, showSuccess);
        }
    }

    function fallbackCopy(text, callback) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed"; 
        textArea.style.left = "-999999px"; // 藏在畫面外
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            callback();
        } catch (err) {
            console.error('複製失敗', err);
        }
        document.body.removeChild(textArea);
    }

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
    }

    // 🏆 終極保底資料庫：當伺服器離線時自動啟用
    function getFallbackData() {
        return [
            {
                category: "intro", cat_name: "零基礎啟蒙", cat_class: "cat-basic", level: "★☆☆ 啟蒙",
                title: "電腦是個死腦筋！什麼是程式？",
                description: "電腦其實超級笨，它完全聽不懂人類說的中文或英文。寫程式，就是用電腦看得懂的「精確指令」，一步一步指揮它做事。只要指令漏了一個逗號、多了一個空格，電腦就會耍脾氣罷工（當機報錯）！",
                code_example: "# 這是一行「註解」，寫給人看的，電腦會直接跳過\n# 電腦會由上到下，一行一行嚴格執行你的指令",
                tip: "在 Python 裡面，只要在開頭加上井字號「#」，後面的文字就會變成註解，不會被電腦執行喔！"
            },
            {
                category: "intro", cat_name: "零基礎啟蒙", cat_class: "cat-basic", level: "★☆☆ 啟蒙",
                title: "print() — 讓電腦開口說話",
                description: "如果你想叫電腦在螢幕上顯示文字或算出來的結果，就要使用 print() 這個神奇咒語。圓括號 ( ) 裡面放的就是你要電腦說出來的內容。",
                code_example: "print(\"哈囉！我是未來的程式大師！\")\nprint(12345)",
                tip: "千萬記得：print 的英文全部都是小寫！寫成 Print 或 PRINT，電腦會跟你說它不認識這個字！"
            },
            {
                category: "data", cat_name: "資料型態", cat_class: "cat-data", level: "★☆☆ 必備",
                title: "字串 (str) — 為什麼文字要穿衣服？",
                description: "只要是人類講的話、名字、文字，在 Python 裡都叫做「字串 (String, 簡稱 str)」。文字出門一定要「穿衣服」，也就是用單引號 ' ' 或雙引號 \" \" 把文字緊緊包起來！如果不包，電腦會以為那是一個「變數名稱」或是「暗號指令」，發現找不到就會大聲報錯！",
                code_example: "name = \"蜜蜂工程師\"    # 正確！有穿衣服的文字是字串\n# 錯誤示範：name = 蜜蜂工程師  -> 電腦會看不懂爆出 NameError",
                tip: "單引號 ' ' 或雙引號 \" \" 都可以，但前後必須成雙成對，不能前面用單引號、後面卻用雙引號收尾！"
            },
            {
                category: "data", cat_name: "資料型態", cat_class: "cat-data", level: "★☆☆ 必備",
                title: "整數 (int) 與小數 (float) — 算術用的數字",
                description: "用來算數學的數字「絕對不能穿衣服（不能加引號）」！整數（沒有小數點的數字，如 100, -5）在 Python 叫 int；帶有小數點的數字（如 3.14, 25.8）在 Python 叫浮點數 float。",
                code_example: "coins = 5000       # int (整數)：買房、金幣都是整數\ntemp = 24.5        # float (浮點數)：氣溫、體溫常有小數點\nprint(coins + 100) # 印出 5100，電腦會自動幫你算好！",
                tip: "天大陷阱！500 是數字 int；但 \"500\" 穿了引號就會變成文字 str！\"500\" + \"500\" 在電腦眼裡是字串相黏，結果會變成 \"500500\"，而不是 1000！"
            },
            {
                category: "data", cat_name: "資料型態", cat_class: "cat-data", level: "★☆☆ 必備",
                title: "變數 (Variable) — 貼上標籤的魔法收納盒",
