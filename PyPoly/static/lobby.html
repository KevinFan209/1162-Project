<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - Lobby</title>
    <!-- 引入與登入頁一致的精選字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-border: #1e272e;
            --bee-gold: #ffc048;
            --bee-yellow: #ffdd59;
            --bee-dark: #2f3542;
            --pixel-green: #05c46b;
            --pixel-blue: #0fbcf9;
            --pixel-red: #ff3f34;
            --bg-grid: #d2dae2;
            --card-bg: #ffffff;
            --text-dark: #1e272e;
            --text-gray: #747d8c;
        }

        /* 徹底重置所有內外距，避免頂部產生縫隙與線條殘留 */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-grid);
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 28px 28px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 頂部導覽列：貼齊最頂端，無任何上邊框與陰影 */
        header {
            margin: 0 !important;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            z-index: 100;
            border: none;
            border-bottom: 4px solid var(--pixel-border);
            box-shadow: none !important;
        }

        .header-left h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            line-height: 1;
            color: var(--bee-gold);
            text-shadow: 
                2px 2px 0 var(--pixel-border),
                -1.5px -1.5px 0 var(--pixel-border),
                2px -1.5px 0 var(--pixel-border),
                -1.5px 2px 0 var(--pixel-border),
                4px 4px 0 var(--bee-dark);
            letter-spacing: 2px;
            user-select: none;
        }

        .header-right { display: flex; align-items: center; gap: 18px; }

        .player-badge {
            background: #fffdf2;
            border: 3px solid var(--pixel-border);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-dark);
            box-shadow: 3px 3px 0 #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-btn {
            background: white;
            border: 3px solid var(--pixel-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-shadow: 3px 3px 0 #000;
            transition: 0.1s;
        }
        .menu-btn:hover { background: #fffdf2; }
        .menu-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }

        .menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45); display: none; z-index: 999;
        }
        .menu-overlay.open { display: block; }

        .side-menu {
            position: fixed; top: 0; right: -320px; width: 320px; height: 100%;
            background: white; border-left: 4px solid var(--pixel-border);
            box-shadow: -8px 0 0 rgba(0,0,0,0.2);
            z-index: 1000; transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            padding: 90px 25px 35px; display: flex; flex-direction: column; gap: 14px;
        }
        .side-menu.open { right: 0; }

        .menu-item {
            padding: 14px 20px; font-weight: 900;
            color: var(--text-dark); text-decoration: none; display: flex;
            align-items: center; gap: 12px; transition: 0.1s; background: #f1f2f6;
            border: 3px solid var(--pixel-border); box-shadow: 3px 3px 0 #000;
        }
        .menu-item:hover { background: var(--bee-yellow); }
        .menu-item:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
        .menu-item.danger { margin-top: auto; color: white; background: var(--pixel-red); }

        .lobby-main {
            height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .lobby-container {
            display: flex;
            gap: 25px;
            width: 95%;
            max-width: 1150px;
            height: 100%;
            align-items: stretch;
        }

        /* 左側人物欄 */
        .sidebar {
            width: clamp(280px, 25vw, 320px);
            height: 100%;
            background: var(--card-bg);
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0px #000;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            flex-shrink: 0;
        }

        .side-title {
            font-family: 'Silkscreen', 'Zen Maru Gothic', sans-serif;
            font-weight: 700;
            font-size: 1.45rem;
            color: var(--text-dark);
            margin-bottom: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .char-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f1f2f6;
            border: 4px solid var(--pixel-border);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: inset 4px 4px 0 rgba(0,0,0,0.08);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.1s ease;
            position: relative;
        }
        .char-box:hover { background: #feffea; }
        .char-box:active { transform: scale(0.98); }

        .char-box canvas, .char-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .id-label {
            width: 100%;
            background: var(--pixel-border);
            color: #ffffff;
            padding: 12px;
            font-weight: 900;
            text-align: center;
            font-size: clamp(0.95rem, 1.1vw, 1.1rem);
            margin-bottom: 14px;
            border: 2px solid #000;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0 var(--bee-gold);
        }

        .btn-pixel {
            border: 3px solid var(--pixel-border);
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: all 0.06s ease;
        }
        .btn-pixel:active {
            transform: translate(3px, 3px) !important;
            box-shadow: 0 0 0 #000 !important;
        }

        .btn-side {
            width: 100%;
            padding: 14px;
            background: var(--bee-yellow);
            color: var(--text-dark);
            box-shadow: 0 5px 0 #000;
            font-size: 0.95rem;
            margin-top: 10px;
        }
        .btn-side:hover { filter: brightness(1.05); }

        /* 右側主舞台 */
        .main-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
        }

        .board-header {
            background: white;
            padding: 18px 30px;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-create {
            padding: 12px 24px;
            background: var(--pixel-green);
            color: white;
            box-shadow: 0 5px 0 #000;
            font-size: 1.05rem;
        }
        .btn-create:hover { filter: brightness(1.05); }

        .quick-join-bar {
            background: white;
            padding: 14px 28px;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .quick-input {
            flex: 1;
            padding: 10px 14px;
            border: 3px solid var(--pixel-border);
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            outline: none;
            font-size: 1.05rem;
            background: #fffdf5;
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.08);
        }
        .quick-input:focus { border-color: #000; background: #feffea; }

        .btn-join {
            padding: 10px 24px;
            background: var(--bee-yellow);
            color: var(--text-dark);
            box-shadow: 0 5px 0 #000;
            font-size: 1rem;
        }
        .btn-join:hover { filter: brightness(1.05); }

        /* 房間列表容器 */
        .room-scroll {
            background: white;
            flex: 1;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            padding: 24px;
            overflow-y: auto;
        }

        .room-scroll-title {
            font-family: 'Silkscreen', 'Zen Maru Gothic', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-dark);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .room-item {
            background: #f8fafc;
            padding: 20px 24px;
            border: 3px solid var(--pixel-border);
            box-shadow: 4px 4px 0 #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            transition: transform 0.1s ease;
        }
        .room-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
            background: #fffdf5;
        }

        .room-mode-tag {
            background: #dfe4ea;
            border: 2px solid var(--pixel-border);
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: 900;
        }

        .room-scroll::-webkit-scrollbar { width: 8px; }
        .room-scroll::-webkit-scrollbar-track { background: #dfe4ea; border-left: 2px solid var(--pixel-border); }
        .room-scroll::-webkit-scrollbar-thumb { background: var(--pixel-border); }

        @media (max-width: 850px) {
            header { padding: 0 20px; }
            .lobby-container { flex-direction: column; width: 100%; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
<div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="side-menu" id="sideMenu">
    <a href="profile.html" class="menu-item"><span>👤</span> 個人主頁</a>
    <a href="guide.html" class="menu-item"><span>📖</span> 遊戲說明</a>
    <a href="learn.html" class="menu-item"><span>📊</span> 學習統計</a>
    <a href="settings.html" class="menu-item"><span>⚙️</span> 遊戲設定</a>
    <a href="lobby.html" class="menu-item"><span>🏠</span> 返回大廳</a>
    <a href="javascript:void(0)" onclick="logout()" class="menu-item danger"><span>🚪</span> 登出遊戲</a>
</div>

<header>
    <div class="header-left"><h1>BeeRich</h1></div>
    <div class="header-right">
        <div class="player-badge">
            <span>👾</span>
            <span id="topPlayerName">載入中...</span>
        </div>
        <button class="menu-btn" onclick="toggleMenu()">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>
</header>

<div class="lobby-main">
    <div class="lobby-container">
        <!-- 左側人物欄 -->
        <aside class="sidebar">
            <h2 class="side-title"><span>⚔️</span> 遊戲大廳</h2>
            <div class="char-box" id="lobby-char-box" onclick="location.href='character.html'">
                <div style="color:var(--text-gray); font-weight:900;">[Q版角色]</div>
            </div>
            <div class="id-label" id="sidePlayerName">載入中...</div>
            <button class="btn-pixel btn-side" onclick="location.href='character.html'">建立專屬虛擬人物</button>
        </aside>

        <!-- 右側主視窗 -->
        <main class="main-board">
            <header class="board-header">
                <h3 style="font-weight: 900; font-size: 1.35rem; color: var(--text-dark);">尋找挑戰者</h3>
                <button class="btn-pixel btn-create" onclick="checkAndCreateRoom()">+ 建立新對局</button>
            </header>

            <div id="quickJoinArea" class="quick-join-bar">
                <span style="font-weight: 900; color: var(--text-dark); white-space: nowrap;">🔑 快速加入</span>
                <input type="text" id="quickRoomCode" placeholder="輸入六位邀請碼..." class="quick-input">
                <button class="btn-pixel btn-join" onclick="quickVerify()">加入房間</button>
            </div>
            
            <section class="room-scroll" id="roomList">
                <div class="room-scroll-title">
                    <span>📜</span> 房間列表
                </div>
            </section>
        </main>
    </div>
</div>

<!-- 像素化私人邀請碼輸入彈窗 -->
<div id="passwordModal" class="menu-overlay" style="display: none; align-items: center; justify-content: center; pointer-events: auto; z-index: 3000;">
    <div style="width: 380px; background: white; border: 4px solid var(--pixel-border); box-shadow: 8px 8px 0 #000; padding: 30px; text-align: center;">
        <h3 style="font-weight: 900; font-size: 1.25rem; margin-bottom: 18px; color: var(--text-dark);">🔒 輸入私人邀請碼</h3>
        <input type="text" id="inputRoomCode" 
               style="width: 100%; margin-bottom: 22px; text-align: center; letter-spacing: 4px; font-size: 1.4rem; border: 3px solid var(--pixel-border); padding: 10px; font-weight: 900; outline: none; background: #fffdf5;" 
               placeholder="六位代碼">
        <div style="display: flex; gap: 12px;">
            <button class="btn-pixel" style="background: #dfe4ea; flex: 1; padding: 12px; color: var(--text-dark); box-shadow: 0 4px 0 #000;" onclick="closePasswordModal()">取消</button>
            <button class="btn-pixel btn-create" style="flex: 1; padding: 12px;" onclick="verifyRoomCode()">加入</button>
        </div>
    </div>
</div>

<script>
    const API_URL = location.origin;
    let syncTimer = null; 
    let pendingRoomId = null;

    function toggleMenu() {
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        if (sideMenu && overlay) {
            sideMenu.classList.toggle('open');
            overlay.classList.toggle('open');
        }
    }

    async function logout() {
        if (syncTimer) clearInterval(syncTimer);
        const username = localStorage.getItem('username');
        await fetch(`${API_URL}/auth/logout?username=${username}&confirm=true`, { method: 'POST' });
        
        const charBackups = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('pypoly_char_')) {
                charBackups[key] = localStorage.getItem(key);
            }
        }
        
        localStorage.clear();
        
        Object.keys(charBackups).forEach(key => {
            localStorage.setItem(key, charBackups[key]);
        });
        
        window.location.href = 'login.html';
    }

    window.onload = async function() {
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        if (!token || !username) {
            window.location.href = 'login.html';
            return;
        }
        
        const charBox = document.getElementById('lobby-char-box');
        const myFace = localStorage.getItem(`pypoly_char_face_${username}`) || localStorage.getItem('pypoly_char_face');
        const savedCharImage = localStorage.getItem('pypoly_char_preview');
        
        if (charBox) {
            if (savedCharImage) {
                charBox.innerHTML = `<img src="${savedCharImage}" alt="我的角色" style="width: 100%; height: 100%; object-fit: contain; transform: scale(1.15);">`;
            } else if (myFace) {
                charBox.innerHTML = `<img src="${myFace}" style="width:100%; height:100%; object-fit:cover; border:2px solid var(--bee-yellow);">`;
            }
        }

        try {
            const res = await fetch(`${API_URL}/auth/verify_and_refresh?username=${encodeURIComponent(username)}`, {
                method: "POST",
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();

            if (data.status === "success") {
                if (document.getElementById('topPlayerName')) document.getElementById('topPlayerName').innerText = username;
                if (document.getElementById('sidePlayerName')) document.getElementById('sidePlayerName').innerText = username;

                startSyncLoop(username, token);
                renderRooms(); 
            } else {
                localStorage.clear();
                window.location.href = "login.html";
            }
        } catch (err) {
            console.error("驗證連線失敗:", err);
            window.location.href = "login.html";
        }
        
        localStorage.removeItem('pypoly_game_snapshot');
        renderRooms();
        setInterval(renderRooms, 10000);
    };
    
    function showCustomAlert(title, message, isSuccess = false) {
        const existingAlert = document.getElementById('custom-ui-alert');
        if (existingAlert) existingAlert.remove();

        const overlay = document.createElement('div');
        overlay.id = 'custom-ui-alert';
        overlay.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 99999; opacity: 0; transition: opacity 0.2s ease;
        `;

        const btnColor = isSuccess ? 'var(--pixel-green)' : 'var(--pixel-red)'; 

        overlay.innerHTML = `
            <div style="
                background: white; padding: 35px; border: 4px solid var(--pixel-border);
                box-shadow: 8px 8px 0px #000000;
                width: 90%; max-width: 420px; text-align: center;
                transform: scale(0.95); transition: all 0.2s ease;
            ">
                <div style="font-size: 2.8rem; margin-bottom: 12px;">
                    ${isSuccess ? '🎉' : '⚠️'}
                </div>
                <h2 style="font-size: 1.6rem; font-weight: 900; color: var(--text-dark); margin-bottom: 14px;">
                    ${title}
                </h2>
                <p style="font-size: 1.05rem; color: var(--text-gray); font-weight: 700; line-height: 1.6; margin-bottom: 26px;">
                    ${message}
                </p>
                <button class="btn-pixel" onclick="document.getElementById('custom-ui-alert').remove()" style="
                    background: ${btnColor}; color: white; padding: 14px;
                    font-weight: 900; font-size: 1.1rem; cursor: pointer;
                    box-shadow: 0 5px 0 #000; width: 100%;
                ">我知道了</button>
            </div>
        `;

        document.body.appendChild(overlay);

        requestAnimationFrame(() => {
            overlay.style.opacity = "1";
            overlay.children[0].style.transform = "scale(1)";
        });
    }
    
    function hasCreatedCharacter() {
        const currentUsername = localStorage.getItem('username');
        let isCreated = localStorage.getItem(`pypoly_char_created_${currentUsername}`);
        
        const hasPreview = localStorage.getItem('pypoly_char_preview');
        if (hasPreview && isCreated !== "true") {
            localStorage.setItem(`pypoly_char_created_${currentUsername}`, "true");
            isCreated = "true";
        }

        if (isCreated !== "true") {
            showCustomAlert(
                "角色尚未建立", 
                "請先點擊左側的<span style='color: var(--pixel-blue);'>「建立專屬虛擬人物」</span>按鈕完成自定義，才能夠加入對局喔！"
            );
            return false;
        }
        return true;
    }

    function checkAndCreateRoom() {
        if (!hasCreatedCharacter()) return;
        location.href = 'modal.html';
    }

    async function renderRooms() {
        const grid = document.getElementById('roomList');
        if (!grid) return;

        try {
            const res = await fetch(`${API_URL}/rooms/public`);
            if (!res.ok) throw new Error("伺服器回應錯誤");
            const rooms = await res.json();

            let newHtml = `<div class="room-scroll-title"><span>📜</span> 公開房間列表</div>`;

            if (rooms && rooms.length > 0) {
                rooms.forEach(room => {
                    const currentPlayers = room.players ? room.players.length : 0;
                    const maxPlayers = room.max_players || 2;
                    const isFull = currentPlayers >= maxPlayers;
                    const statusColor = isFull ? 'var(--text-gray)' : 'var(--pixel-green)';

                    newHtml += `
                        <div class="room-item">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span style="font-weight: 900; font-size: 1.25rem; color: var(--text-dark);">${room.name}</span>
                                    <span class="room-mode-tag">
                                        ${room.mode === 'advanced' ? '🚀 進階' : '🌱 基礎'}
                                    </span>
                                </div>
                                <p style="font-size: 0.95rem; color: var(--text-gray); font-weight: 700; margin-top: 6px;">
                                    🏆 ${room.winLaps} 回合 | 🔥 難度: ${room.difficulty || '普通'}
                                </p>
                            </div>
                            <div style="text-align: right; min-width: 105px;">
                                <div style="color: ${statusColor}; font-weight: 900; font-size: 1.1rem; margin-bottom: 8px;">
                                    👥 ${currentPlayers} / ${maxPlayers}
                                </div>
                                <button class="btn-pixel btn-join" onclick="joinRoom('${room.code}', '${room.type}')" ${isFull ? 'disabled' : ''}>
                                    ${isFull ? '已滿' : '加入'}
                                </button>
                            </div>
                        </div>`;
                });
            } else {
                newHtml += '<div style="color:var(--text-gray); padding:20px; font-weight:900;">目前沒有冒險教室</div>';
            }

            if (grid.innerHTML !== newHtml) grid.innerHTML = newHtml;
        } catch (err) {
            console.error("刷新列表失敗");
        }
    }
    
    async function joinRoom(roomCode, type) {
        if (!hasCreatedCharacter()) return;
        const myName = localStorage.getItem('username');
        
        try {
            const joinRes = await fetch(`${API_URL}/rooms/join/${roomCode}?username=${encodeURIComponent(myName)}`, {
                method: 'POST'
            });

            if (joinRes.ok) {
                const serverRoom = await joinRes.json();
                localStorage.setItem('pypoly_active_room', JSON.stringify(serverRoom));
                
                const isActuallyHost = (serverRoom.hostId === myName);
                localStorage.setItem('is_host', isActuallyHost ? 'true' : 'false');

                location.href = 'WaitingRoom.html';
            } else {
                const errorData = await joinRes.json();
                alert(`❌ 無法加入：${errorData.detail || "房間可能已滿或不存在"}`);
            }
        } catch (err) { 
            console.error("連線失敗", err);
            alert("連線伺服器失敗，請檢查網路"); 
        }
    }

    async function verifyRoomCode() {
        const inputField = document.getElementById('inputRoomCode');
        if (!inputField) return;
        
        const inputCode = inputField.value.toUpperCase().trim();
        if (!inputCode) {
            alert("請輸入邀請碼！");
            return;
        }

        const quickInput = document.getElementById('quickRoomCode');
        if (quickInput) quickInput.value = inputCode;
        
        await quickVerify(); 
    }

    function closePasswordModal() {
        const pwdModal = document.getElementById('passwordModal');
        if (pwdModal) pwdModal.style.display = 'none';
        const overlay = document.getElementById('overlay');
        if (overlay) overlay.classList.remove('open');
    }
    
    async function quickVerify() {
        if (!hasCreatedCharacter()) return;
        const code = document.getElementById('quickRoomCode').value.toUpperCase().trim();
        const myName = localStorage.getItem('username');
        if (!code) return alert("請輸入代碼");

        try {
            const joinRes = await fetch(`${API_URL}/rooms/join/${code}?username=${encodeURIComponent(myName)}`, {
                method: 'POST'
            });
            
            if (joinRes.ok) {
                const serverRoom = await joinRes.json();
                localStorage.setItem('pypoly_active_room', JSON.stringify(serverRoom));
                
                const isActuallyHost = (serverRoom.hostId === myName);
                localStorage.setItem('is_host', isActuallyHost ? 'true' : 'false');

                location.href = 'WaitingRoom.html';
            } else {
                const errorData = await joinRes.json();
                alert(`❌ 無法加入：${errorData.detail || "房間可能已滿或不存在"}`);
            }
        } catch (err) { 
            console.error("連線失敗", err);
            alert("連線失敗，請檢查網路環境"); 
        }
    }

    function startSyncLoop(username, token) {
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(async () => {
            try {
                fetch(`${API_URL}/auth/heartbeat?username=${encodeURIComponent(username)}`, {
                    method: 'POST', 
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const res = await fetch(`${API_URL}/auth/me?username=${encodeURIComponent(username)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.role === 'banned' || (data.is_online === 0 && data.role !== 'admin')) {
                        clearInterval(syncTimer);
                        
                        const charBackups = {};
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            if (key && key.startsWith('pypoly_char_')) {
                                charBackups[key] = localStorage.getItem(key);
                            }
                        }
                        
                        localStorage.clear();
                        
                        Object.keys(charBackups).forEach(key => {
                            localStorage.setItem(key, charBackups[key]);
                        });
                        
                        window.location.href = 'login.html';
                    }
                }
            } catch (err) {}
        }, 5000);
    }
</script>
