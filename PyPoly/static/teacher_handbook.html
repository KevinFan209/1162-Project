<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - 教師學習手冊管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/jpeg">
    <style>
        :root {
            --pixel-border: #1e272e;
            --bee-gold: #ffc048;
            --bee-yellow: #ffdd59;
            --bee-dark: #2f3542;
            --pixel-green: #05c46b;
            --pixel-blue: #0fbcf9;
            --pixel-red: #ff3f34;
            --bg-grid: #d2dae2;
            --card-bg: #ffffff;
            --text-dark: #1e272e;
            --text-gray: #747d8c;
            --border-light: #1e272e;
            --danger-red: #ff3f34;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-grid);
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 28px 28px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            width: 100%;
            background: white;
            padding: 0 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            border-bottom: 4px solid var(--pixel-border);
            flex-shrink: 0;
        }

        .header-left h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            line-height: 1;
            color: var(--bee-gold);
            text-shadow: 
                2px 2px 0 var(--pixel-border),
                -1.5px -1.5px 0 var(--pixel-border),
                2px -1.5px 0 var(--pixel-border),
                -1.5px 2px 0 var(--pixel-border),
                4px 4px 0 var(--bee-dark);
            letter-spacing: 2px;
            cursor: pointer;
        }

        .header-right { display: flex; align-items: center; gap: 18px; }

        .page-tag {
            background: #e0f2fe;
            border: 3px solid var(--pixel-border);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-dark);
            box-shadow: 3px 3px 0 #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-main {
            height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .admin-container {
            display: flex;
            gap: 25px;
            width: 95%;
            max-width: 1280px;
            height: 100%;
            align-items: stretch;
        }

        .admin-nav {
            width: 280px;
            background: white;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0px #000;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .admin-nav h2 {
            font-weight: 900;
            font-size: 1.35rem;
            margin-bottom: 10px;
            padding-left: 6px;
            color: var(--text-dark);
            border-bottom: 3px solid var(--pixel-border);
            padding-bottom: 8px;
        }

        .nav-link { 
            width: 100%;
            padding: 13px 16px;
            border: 3px solid var(--pixel-border);
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            color: var(--text-dark);
            transition: all 0.06s ease;
            text-decoration: none;
            box-shadow: 3px 3px 0 #000;
        }

        .nav-link:hover:not(.active) {
            background: #fffdf2;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #000;
        }

        .nav-link.active {
            background: var(--bee-yellow);
            color: var(--text-dark);
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }

        .admin-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow: hidden;
            height: 100%;
        }

        .board-header { 
            background: white;
            padding: 16px 24px;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        .select-filter { 
            padding: 9px 14px;
            border: 3px solid var(--pixel-border);
            font-weight: 900;
            font-size: 0.9rem;
            background: #fffdf5;
            color: var(--text-dark);
            outline: none;
            box-shadow: 2px 2px 0 #000;
            cursor: pointer;
        }

        .search-input {
            padding: 10px 14px;
            border: 3px solid var(--pixel-border);
            background: #fffdf5;
            width: 200px;
            font-weight: 900;
            font-size: 0.9rem;
            color: var(--text-dark);
            outline: none;
        }

        .btn-add { 
            padding: 11px 20px;
            background: var(--bee-yellow);
            color: var(--text-dark);
            border: 3px solid var(--pixel-border);
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #000;
            white-space: nowrap;
        }
        .btn-add:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }

        .user-list-container { 
            background: white;
            flex: 1;
            border: 4px solid var(--pixel-border);
            box-shadow: 6px 6px 0 #000;
            padding: 24px 28px; 
            overflow-y: auto;
        }

        .table-header {
            display: grid;
            grid-template-columns: 70px 120px 130px 1fr 120px 160px;
            padding: 0 20px 12px;
            font-weight: 900;
            color: var(--text-dark);
            font-size: 0.92rem;
            border-bottom: 3px solid var(--pixel-border);
            margin-bottom: 14px;
            align-items: center;
        }

        .user-row {
            background: #f8fafc;
            padding: 14px 20px;
            border: 3px solid var(--pixel-border);
            box-shadow: 4px 4px 0 #000;
            display: grid;
            grid-template-columns: 70px 120px 130px 1fr 120px 160px;
            align-items: center;
            margin-bottom: 12px;
            transition: all 0.08s ease;
        }
        .user-row.is-class-card {
            background: #fffdf2;
        }
        .user-row:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }
        
        .user-avatar {
            width: 44px;
            height: 44px;
            background: white;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--text-gray);
            margin: 0 auto;
        }
        
        .user-id { font-weight: 900; font-size: 1.02rem; color: var(--text-dark); padding-left: 10px; }
        .user-email { color: var(--text-gray); font-weight: 900; font-size: 0.88rem; text-align: center; }
        
        .user-status {
            display: inline-block;
            padding: 4px 10px;
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            font-size: 0.78rem;
            font-weight: 900;
            background: #fffdf2;
            color: var(--text-dark);
            text-align: center;
        }

        .action-btns { display: flex; gap: 8px; justify-content: center; }
        .btn-icon {
            padding: 8px 12px;
            border: 2px solid var(--pixel-border);
            box-shadow: 3px 3px 0 #000;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.82rem;
        }
        .btn-icon:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
        .btn-edit { background: #dfe4ea; color: var(--text-dark); }
        .btn-ban { background: #fff5f5; color: var(--pixel-red); }

        /* 編輯彈窗樣式 */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
            display: none; justify-content: center; align-items: center; z-index: 500; padding: 20px;
        }
        .modal-mask.open { display: flex; }
        .modal-card {
            background: white; border-radius: 30px; padding: 30px 35px;
            width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }
        .modal-card h2 { font-weight: 900; font-size: 1.6rem; margin-bottom: 20px; color: var(--text-dark); border-bottom: 3px solid var(--pixel-border); padding-bottom: 12px; }
        .form-row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
        .field { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 6px; }
        .field label { font-weight: 900; font-size: 0.85rem; color: var(--text-gray); }
        .field input, .field select, .field textarea {
            padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--border-light);
            font-weight: 700; background: #f8fafc; font-family: inherit; font-size: 0.95rem; outline: none;
        }
        .field textarea { resize: vertical; min-height: 70px; }
        .field textarea.mono { font-family: 'Consolas', monospace; background: #0f172a; color: #7dd3fc; min-height: 110px; }
        .modal-err { color: var(--danger-red); font-weight: 800; margin-bottom: 12px; min-height: 1.2em; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
        .btn-cancel { padding: 12px 25px; background: #e2e8f0; color: var(--text-dark); border: none; border-radius: 12px; font-weight: 900; cursor: pointer; }

        /* 像素刪除確認彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: none; justify-content: center; align-items: center; z-index: 3000;
        }
        .modal-content-status {
            background: white; padding: 32px 30px;
            border: 4px solid var(--pixel-border);
            box-shadow: 8px 8px 0px #000000;
            width: 420px; max-width: 90vw; text-align: center;
        }
        .modal-content-status h2 { font-weight: 900; font-size: 1.5rem; margin-bottom: 12px; color: var(--text-dark); }
        .modal-content-status p { font-weight: 900; color: var(--text-dark); margin-bottom: 24px; line-height: 1.6; font-size: 1rem; }
        .modal-footer-status { display: flex; justify-content: center; gap: 12px; }
        .btn-3d {
            padding: 12px 26px; border: 3px solid var(--pixel-border);
            font-weight: 900; font-size: 1rem; cursor: pointer;
            color: var(--text-dark); background: var(--bee-yellow); box-shadow: 0 4px 0 #000;
        }
        .btn-3d:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #000; }

        .user-list-container::-webkit-scrollbar, .modal-card::-webkit-scrollbar { width: 8px; }
        .user-list-container::-webkit-scrollbar-track, .modal-card::-webkit-scrollbar-track { background: #dfe4ea; border-radius: 10px; }
        .user-list-container::-webkit-scrollbar-thumb, .modal-card::-webkit-scrollbar-thumb { background: var(--text-gray); border-radius: 10px; border: 2px solid #dfe4ea; }
    </style>
</head>
<body>

<header>
    <div class="header-left"><h1 onclick="location.href='teacher.html'">BeeRich</h1></div>
	<div class="header-right">
        <div class="page-tag">
            <span id="topActiveClassBadge" style="display: none; background: var(--bee-yellow); border: 2px solid var(--pixel-border); padding: 2px 8px; font-size: 0.85rem; box-shadow: 2px 2px 0 #000; margin-right: 4px;"></span>
            <span id="topTeacherTag">📖 教師學習手冊管理</span>
        </div>
    </div>
</header>

<div class="admin-main">
    <div class="admin-container">
        <aside class="admin-nav">
            <h2><span>📋</span> 教師選單</h2>
            <a href="teacher.html" class="nav-link"><span>🎓</span> 學生管理</a>
            <a href="teacher_question.html" class="nav-link"><span>❓</span> 考題庫管理</a>
            <a href="teacher_handbook.html" class="nav-link active"><span>📖</span> 學習手冊</a>
            <a href="teacher.html" class="nav-link"><span>👤</span> 個人資料設定</a>
            <a href="javascript:void(0);" class="nav-link" onclick="logout();" style="margin-top: auto; color: white; background: var(--pixel-red);"><span>🚪</span> 登出系統</a>
        </aside>

        <main class="admin-board">
            <div class="board-header">
                <div class="filter-group">
                    <select class="select-filter" id="filterSource" onchange="filterTable()">
                        <option value="all">全部字卡 (官方＋本班)</option>
                        <option value="class">🏫 僅顯示本班專屬字卡</option>
                        <option value="official">🌐 僅顯示官方預設字卡</option>
                    </select>
                    <select class="select-filter" id="filterLevel" onchange="filterTable()">
                        <option value="">所有難度</option>
                        <option value="★☆☆ 啟蒙">★☆☆ 啟蒙</option>
                        <option value="★☆☆ 必備">★☆☆ 必備</option>
                        <option value="★★☆ 核心">★★☆ 核心</option>
                        <option value="★★☆ 易錯">★★☆ 易錯</option>
                        <option value="★★★ 進階">★★★ 進階</option>
                        <option value="★★★ 必讀">★★★ 必讀</option>
                    </select>
                    <select class="select-filter" id="filterCategory" onchange="filterTable()">
                        <option value="">所有分類</option>
                        <option value="intro">基礎啟蒙</option>
                        <option value="basic">輸入輸出</option>
                        <option value="data">變數型態</option>
                        <option value="cond">條件判斷</option>
                        <option value="loop">迴圈控制</option>
                        <option value="list">串列字典</option>
                        <option value="func">自訂函式</option>
                        <option value="bug">除錯急救包</option>

                </div>
                <button class="btn-add" onclick="openModal()">+ 新增班級教材</button>
            </div>

            <div class="user-list-container">
                <div class="table-header">
                    <span style="text-align: center;">排序</span>
                    <span style="text-align: center;">來源</span>
                    <span style="text-align: center;">分類標籤</span>
                    <span style="padding-left: 10px;">教材標題</span>
                    <span style="text-align: center;">難度級別</span>
                    <span style="text-align: center;">操作項目</span>
                </div>

                    <div style="padding: 20px; font-weight: 900; color: #747d8c; text-align: center;">載入中...</div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- 新增/編輯彈窗 -->
<div class="modal-mask" id="cardModal">
    <div class="modal-card">
        <h2 id="modalTitle">新增班級專屬學習字卡</h2>
        <div class="modal-err" id="modalErr"></div>
        <input type="hidden" id="cardId">
        
        <div class="form-row">

                <select id="level">
                    <option value="★☆☆ 啟蒙">★☆☆ 啟蒙</option>
                    <option value="★☆☆ 必備">★☆☆ 必備</option>
                    <option value="★★☆ 核心">★★☆ 核心</option>
                    <option value="★★☆ 易錯">★★☆ 易錯</option>
                    <option value="★★★ 進階">★★★ 進階</option>

        <div class="form-row">

                    <option value="basic">basic (輸入輸出)</option>
                    <option value="data">data (變數型態)</option>
                    <option value="cond">cond (條件判斷)</option>
                    <option value="loop">loop (迴圈控制)</option>

                    <option value="cat-basic">黃色 (基礎)</option>
                    <option value="cat-cond">藍色 (判斷)</option>
                    <option value="cat-loop">綠色 (迴圈)</option>

                    <option value="cat-func">紫色 (進階)</option>

        <div class="form-row">
            <div class="field" style="min-width: 100%;">

        </div>

        <div class="form-row">
            <div class="field" style="min-width: 100%;">

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-add" style="border-radius: 12px; box-shadow: none;" onclick="saveCard()">儲存教材</button>
        </div>
    </div>
</div>

<!-- 刪除確認彈窗 -->
<div id="statusModal" class="modal-overlay" style="display: none;">
    <div class="modal-content-status">
        <h2 id="statusModalTitle">標題</h2>
        <p id="statusModalMsg">內容訊息</p>
        <div class="modal-footer-status" id="statusModalFooter">
            <button class="btn-3d" onclick="closeStatusModal()">確定</button>
        </div>
    </div>
</div>

<script src="js/ngrok-fetch.js"></script>
<script>
    const API_URL = location.origin;
    let allCards = [];
    let myClassName = "";

    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        const username = localStorage.getItem('username');

        if (!token || (role !== 'teacher' && role !== 'admin') || !username) {
            window.location.href = 'login.html';
            return;
        }

        document.getElementById('topTeacherTag').innerText = `📖 ${username} 老師 — 學習手冊管理`;
		
		const cachedClass = localStorage.getItem('teacher_active_class_name');
		if (cachedClass) {
			const badge = document.getElementById('topActiveClassBadge');
			badge.style.display = 'inline-block';
			badge.innerText = `🏫 ${cachedClass}`;
		}

        document.getElementById('cardModal').addEventListener('click', (e) => {
            if (e.target.id === 'cardModal') closeModal();
        });

        try {
            await fetch(`${API_URL}/auth/verify_and_refresh?username=${encodeURIComponent(username)}`, {
                method: "POST",
                headers: { 'Authorization': `Bearer ${token}` }
            });
            await fetchCards();
        } catch (err) {
            console.error(err);
        }
    });

    function authHeaders(json = false) {
        const h = { 'Authorization': `Bearer ${localStorage.getItem('token')}` };
        if (json) h['Content-Type'] = 'application/json';
        return h;
    }

    async function fetchCards() {
        try {
			const activeClassId = localStorage.getItem('teacher_active_class_id') || '';
			const res = await fetch(`${API_URL}/teacher/handbook/list?class_id=${encodeURIComponent(activeClassId)}`, { headers: authHeaders() });
            if (res.ok) {
                const data = await res.json();
                myClassName = data.class_name || "";
				
				const badge = document.getElementById('topActiveClassBadge');
				if (badge) {
					if (myClassName) {
						badge.style.display = 'inline-block';
						badge.innerText = `🏫 ${myClassName}`;
						localStorage.setItem('teacher_active_class_name', myClassName);
					} else {
						badge.style.display = 'none';
					}
				}
				
                allCards = data.items || [];
                filterTable();
            }
        } catch (err) { console.error(err); }
    }

    function renderTable(list) {
        const tbody = document.getElementById('tableBody');
        if (list.length === 0) {
            tbody.innerHTML = `<div style="padding:20px;text-align:center;font-weight:900;color:#747d8c;">目前沒有符合條件的教材</div>`;
            return;
        }

        tbody.innerHTML = list.map(c => {
            const isClassCard = c.class_id !== null && c.class_id !== undefined;
            const sourceBadge = isClassCard
                ? `<span class="user-status" style="background: var(--bee-yellow);">🏫 本班專屬</span>`
                : `<span class="user-status" style="background: #e2e8f0; color: #475569;">🌐 官方基底</span>`;

            const actions = isClassCard
                ? `<button class="btn-icon btn-edit" onclick='openModal(${JSON.stringify(c).replace(/'/g, "&#39;")}, false)'>編輯</button>
                   <button class="btn-icon btn-ban" onclick="deleteCard(${c.id}, '${escapeHtml(c.title)}')">刪除</button>`
                : `<button class="btn-icon btn-edit" onclick='openModal(${JSON.stringify(c).replace(/'/g, "&#39;")}, true)' title="以官方字卡為範本新增給本班">📋 複製改編</button>`;

            return `
                <div class="user-row ${isClassCard ? 'is-class-card' : ''}">
                    <div class="user-avatar">${c.order_index}</div>
                    <div style="text-align: center;">${sourceBadge}</div>
                    <div style="text-align: center;"><span class="user-status">${escapeHtml(c.cat_name)}</span></div>
                    <div class="user-id">${escapeHtml(c.title)}</div>
                    <div class="user-email">${escapeHtml(c.level)}</div>
                    <div class="action-btns">${actions}</div>
                </div>
            `;
        }).join('');
    }

    function filterTable() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const sourceFilter = document.getElementById('filterSource').value;
        const levelFilter = document.getElementById('filterLevel').value;
        const categoryFilter = document.getElementById('filterCategory').value;

        const filtered = allCards.filter(c => {
            const isClassCard = c.class_id !== null && c.class_id !== undefined;
            const matchSource = sourceFilter === 'all' || (sourceFilter === 'class' ? isClassCard : !isClassCard);
            const matchKeyword = c.title.toLowerCase().includes(q) || c.cat_name.toLowerCase().includes(q);
            const matchLevel = levelFilter === "" || (c.level && c.level.includes(levelFilter));
            const matchCategory = categoryFilter === "" || c.category === categoryFilter;
            return matchSource && matchKeyword && matchLevel && matchCategory;
        });

        renderTable(filtered);
    }

    function openModal(card = null, isCopy = false) {
        document.getElementById('cardModal').classList.add('open');
        document.getElementById('modalErr').textContent = '';

        if (card) {
            document.getElementById('modalTitle').innerText = isCopy ? '📋 複製改編為本班專屬字卡' : '編輯班級學習字卡';
            document.getElementById('cardId').value = isCopy ? '' : card.id;
            document.getElementById('orderIndex').value = card.order_index;
            document.getElementById('level').value = card.level;
            document.getElementById('category').value = card.category;
            document.getElementById('catName').value = card.cat_name;
            document.getElementById('catClass').value = card.cat_class;
            document.getElementById('title').value = isCopy ? `${card.title}（班級補充）` : card.title;
            document.getElementById('description').value = card.description;
            document.getElementById('codeExample').value = card.code_example || '';
            document.getElementById('tip').value = card.tip || '';
        } else {
            document.getElementById('modalTitle').innerText = '➕ 新增班級專屬學習字卡';
            document.getElementById('cardId').value = '';
            document.getElementById('orderIndex').value = '10';
            document.getElementById('catName').value = '老師補充';
            document.getElementById('title').value = '';
            document.getElementById('description').value = '';
            document.getElementById('codeExample').value = '';
            document.getElementById('tip').value = '';
        }
    }

    function closeModal() { 
        document.getElementById('cardModal').classList.remove('open'); 
    }

    async function saveCard() {
        const id = document.getElementById('cardId').value;
        const errBox = document.getElementById('modalErr');
        const payload = {
            order_index: parseInt(document.getElementById('orderIndex').value) || 0,
            level: document.getElementById('level').value,
            category: document.getElementById('category').value,
            cat_name: document.getElementById('catName').value.trim() || '老師補充',
            cat_class: document.getElementById('catClass').value,
            title: document.getElementById('title').value.trim(),
            description: document.getElementById('description').value.trim(),
            code_example: document.getElementById('codeExample').value,
            tip: document.getElementById('tip').value
        };

        if (!payload.title || !payload.description) {
            errBox.textContent = "⚠️ 標題與白話解說為必填欄位！";
            return;
        }

        errBox.textContent = '';
		const activeClassId = localStorage.getItem('teacher_active_class_id') || '';
		const url = id
			? `${API_URL}/teacher/handbook/${id}`
			: `${API_URL}/teacher/handbook/add?class_id=${encodeURIComponent(activeClassId)}`;
        try {
            const res = await fetch(url, {
                method: id ? 'PUT' : 'POST',
                headers: authHeaders(true),
                body: JSON.stringify(payload)
            });
            if (res.ok) { 
                closeModal(); 
                fetchCards(); 
            } else {
                const errData = await res.json().catch(() => ({}));
                errBox.textContent = errData.detail || "儲存失敗，請稍後再試！";
            }
        } catch (err) { 
            errBox.textContent = "伺服器連線錯誤！"; 
        }
    }

    function deleteCard(id, title) {
        const modal = document.getElementById('statusModal');
        document.getElementById('statusModalTitle').innerText = '⚠️ 刪除確認';
        document.getElementById('statusModalTitle').style.color = 'var(--pixel-red)';
        document.getElementById('statusModalMsg').innerText = `確定要刪除本班專屬字卡「${title}」嗎？這將無法復原。`;

        document.getElementById('statusModalFooter').innerHTML = `
            <button class="btn-3d" style="background: var(--pixel-red); color: white; margin-right: 10px;" id="confirmDelBtn">確定</button>
            <button class="btn-3d" style="background: #dfe4ea; color: var(--text-dark);" onclick="closeStatusModal()">取消</button>
        `;

        document.getElementById('confirmDelBtn').onclick = async () => {
            closeStatusModal();
            try {
                const res = await fetch(`${API_URL}/teacher/handbook/${id}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                if (res.ok) fetchCards();
            } catch (err) { console.error(err); }
        };
        modal.style.display = 'flex';
    }

    function closeStatusModal() {
        document.getElementById('statusModal').style.display = 'none';
    }

    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function logout() {
        const username = localStorage.getItem('username');
        if (username) {
            try { await fetch(`${API_URL}/auth/logout?username=${encodeURIComponent(username)}&confirm=true`, { method: 'POST' }); } catch (e) {}
        }
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>
</body>
