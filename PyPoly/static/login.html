<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>BeeRich - Python Adventure</title>
    <!-- 引入高辨識度、厚實醒目的街機遊戲英文字體與繁體中文字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Russo+One&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-border: #1e272e;
            --main-yellow: #ffd32a;
            --main-yellow-hover: #ffdf57;
            --main-blue: #0fbcf9;
            --pixel-green: #05c46b;
            --pixel-red: #ff3f34;
            --card-bg: #ffffff;
            --text-dark: #1e272e;
            --text-gray: #747d8c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
            image-rendering: pixelated;
        }

        body {
            background-color: #d2dae2;
            /* 經典復古像素幾何網格背景 */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
            background-size: 28px 28px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 像素厚卡片容器 */
        .card {
            background: var(--card-bg);
            width: 440px;
            padding: 44px 38px 38px;
            border-radius: 4px;
            border: 4px solid var(--pixel-border);
            box-shadow: 
                8px 8px 0px rgba(0, 0, 0, 0.85),
                14px 14px 0px rgba(15, 188, 249, 0.25);
            text-align: center;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        /* 標題與 Logo 區塊 */
        .logo-wrap {
            position: relative;
            margin-bottom: 26px;
        }

        .pixel-badge {
            display: inline-block;
            background: var(--main-yellow);
            border: 2px solid var(--pixel-border);
            padding: 3px 14px;
            font-family: 'Russo One', sans-serif;
            font-size: 0.75rem;
            color: var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
            margin-bottom: 12px;
            letter-spacing: 1px;
            animation: floatBadge 1.4s infinite alternate ease-in-out;
        }

        /* 醒目、粗壯、立體感強的 Black Ops One 主標題 */
        h1 {
            font-family: 'Black Ops One', cursive;
            font-size: 3.8rem;
            line-height: 1.05;
            color: #ffffff;
            letter-spacing: 2px;
            user-select: none;
            /* 雙層高對比像素描邊與硬陰影 */
            -webkit-text-stroke: 3px var(--pixel-border);
            text-shadow: 
                5px 5px 0px var(--pixel-border),
                7px 7px 0px var(--main-yellow);
            margin-bottom: 6px;
        }

        .tagline {
            font-family: 'Russo One', sans-serif;
            font-size: 0.85rem;
            color: var(--text-gray);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* 像素分頁籤 */
        .tabs {
            display: flex;
            background: #dfe4ea;
            border: 3px solid var(--pixel-border);
            margin-bottom: 24px;
            padding: 4px;
            gap: 6px;
            box-shadow: inset 2px 2px 0 rgba(0,0,0,0.12);
        }

        .tab {
            flex: 1;
            padding: 10px 4px;
            cursor: pointer;
            font-weight: 900;
            font-size: 1.05rem;
            color: var(--text-gray);
            border: 2px solid transparent;
            transition: 0.1s;
            user-select: none;
        }

        .tab.active {
            background: white;
            color: var(--text-dark);
            border: 2px solid var(--pixel-border);
            box-shadow: 2px 2px 0 #000;
        }

        .form-container { width: 100%; text-align: left; }

        form { display: none; }
        form.active { display: block; animation: pixelSlide 0.18s steps(4) forwards; }

        .input-group {
            margin-bottom: 20px; 
            position: relative;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Russo One', 'Noto Sans TC', sans-serif;
            font-size: 0.8rem;
            font-weight: 900;
            margin-bottom: 6px;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 3px solid var(--pixel-border);
            border-radius: 0px;
            background: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-dark);
            outline: none;
            box-shadow: inset 3px 3px 0 #dfe4ea;
            transition: 0.1s;
        }

        input:focus {
            background: #fffdf5;
            border-color: #000;
            box-shadow: inset 3px 3px 0 rgba(255, 211, 42, 0.45);
        }

        input::-webkit-calendar-picker-indicator {
            display: none !important;
        }

        #idCheckMsg {
            position: absolute;
            left: 2px;
            bottom: -18px;
            font-size: 0.75rem;
            font-weight: 900;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding: 0 2px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            color: var(--text-dark);
            user-select: none;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            border: 2px solid #000;
            cursor: pointer;
        }

        .forgot-pw {
            font-size: 0.9rem;
            font-weight: 900;
            color: #0984e3;
            text-decoration: none;
        }

        .forgot-pw:hover {
            text-decoration: underline;
        }

        /* 街機實體反饋按鈕 */
        button.btn-submit {
            width: 100%;
            padding: 16px;
            border: 3px solid var(--pixel-border);
            background: var(--main-yellow);
            color: #1e272e;
            font-family: 'Russo One', 'Noto Sans TC', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--pixel-border);
            margin-top: 4px;
            transition: all 0.06s ease;
            position: relative;
            user-select: none;
            letter-spacing: 1px;
        }

        button.btn-submit:hover {
            background: var(--main-yellow-hover);
        }

        button.btn-submit:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--pixel-border);
        }

        .divider {
            margin: 22px 0 18px;
            display: flex;
            align-items: center;
            color: var(--text-gray);
            font-size: 0.8rem;
            font-family: 'Russo One', sans-serif;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after { 
            content: ""; 
            flex: 1; 
            height: 2px; 
            background: #000; 
            border-bottom: 2px dashed #a4b0be; 
            margin: 0 12px; 
        }

        /* Google 登入按鈕 */
        .google-btn {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--pixel-border);
            background: white;
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--pixel-border);
            transition: all 0.06s ease;
        }

        .google-btn:hover { background: #f1f2f6; }
        .google-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--pixel-border);
        }

        /* 像素對話彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); display: none;
            align-items: center; justify-content: center; z-index: 1000;
        }

        .modal-card {
            background: white; 
            width: 380px; 
            padding: 30px; 
            border: 4px solid var(--pixel-border);
            box-shadow: 8px 8px 0px #000000;
            text-align: center;
            animation: pixelPop 0.15s ease forwards;
        }

        @keyframes floatBadge {
            from { transform: translateY(0); }
            to { transform: translateY(-4px); }
        }

        @keyframes pixelSlide {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pixelPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-wrap">
            <div class="pixel-badge">LEVEL 1 READY</div>
            <h1>BeeRich</h1>
            <p class="tagline">Python Adventure</p>
        </div>

        <div class="tabs">
            <div id="loginTab" class="tab active" onclick="toggle('login')">⚔️ 登入冒險</div>
            <div id="regTab" class="tab" onclick="toggle('register')">🛡️ 創建角色</div>
        </div>

        <div class="form-container">
            <form id="loginForm" class="active">
                <div class="input-group">
                    <label><span>👾</span> PLAYER ID</label>
                    <input type="text" id="loginUser" name="username" autocomplete="username" placeholder="輸入玩家帳號...">
                    <datalist id="idHistory"></datalist>
                </div>
                <div class="input-group">
                    <label><span>🔑</span> PASSWORD</label>
                    <input type="password" id="loginPass" placeholder="••••••••" required>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> 記住我
                    </label>
                    <a href="forgot.html" class="forgot-pw">忘記密碼？</a>
                </div>
                <button type="submit" class="btn-submit">GO! 開始冒險</button>
            </form>

            <form id="regForm">
                <div class="input-group">
                    <label><span>🎮</span> GAME ID</label>
                    <input type="text" id="regUsername" name="username" autocomplete="username" placeholder="設定 Game ID">
                    <span id="idCheckMsg"></span>
                </div>
                <div class="input-group">
                    <label><span>✉️</span> EMAIL</label>
                    <input type="email" id="regEmail" placeholder="冒險者的信箱..." required>
                </div>
                <div class="input-group">
                    <label><span>🔒</span> SET PASSWORD</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" id="regSubmitBtn" class="btn-submit" style="background: var(--pixel-green); box-shadow: 0 6px 0 #000; color: white;">CREATE & GO!</button>
            </form>
        </div>

        <div class="divider">OR USE</div>

        <button class="google-btn" onclick="handleGoogleLogin()">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google 快速登入
        </button>
    </div>

    <!-- 像素 RPG 對話視窗 -->
    <div id="statusModal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modalTitle" style="font-family: 'Russo One', sans-serif; font-size: 1.25rem; margin-bottom: 16px;">TITLE</h2>
            <p id="modalMsg" style="font-size: 1.05rem; font-weight: 900; color: #2d3436; margin-bottom: 25px; line-height: 1.6;">內容訊息</p>
            <button id="modalBtn" class="btn-submit" onclick="closeModal()">OK (確認)</button>
        </div>
    </div>

<script>
    const API_URL = location.origin;

    // --- 0. 頁面初始化：狀態校對與封鎖偵測 ---
    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('reason') === 'banned') {
            showModal("🚫 帳號停權", "您的帳號已被封鎖，無法進入遊戲，請聯繫管理員。", false);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        const role = localStorage.getItem('role');

        if (token && username && role) {
            try {
                const res = await fetch(`${API_URL}/auth/me?username=${encodeURIComponent(username)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.is_online === 1 && data.role !== 'banned') {
                        console.log("🚩 偵測到已登入 Session，執行自動跳轉...");
                        window.location.href = role === 'admin' ? 'admin.html' : 'lobby.html';
                        return;
                    }
                }
            } catch (err) {
                console.warn("自動校對失敗，停留在登入頁");
            }
        }

        const savedUsername = localStorage.getItem('remembered_username');
        const rememberMeChecked = localStorage.getItem('remember_me_checked') === 'true';
        if (rememberMeChecked && savedUsername) {
            const userField = document.getElementById('loginUser');
            if (userField) userField.value = savedUsername;
            const checkField = document.getElementById('rememberMe');
            if (checkField) checkField.checked = true;
        }

        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.onsubmit = async (e) => {
                e.preventDefault();
                const userVal = document.getElementById('loginUser').value.trim();
                const passVal = document.getElementById('loginPass').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                try {
                    const response = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: userVal, password: passVal })
                    });
                    
                    const result = await response.json();

                    if (response.ok) {
                        if (rememberMe) {
                            localStorage.setItem('remembered_username', userVal);
                            localStorage.setItem('remember_me_checked', 'true');
                        } else {
                            localStorage.removeItem('remembered_username');
                            localStorage.setItem('remember_me_checked', 'false');
                        }

                        localStorage.setItem('token', result.access_token);
                        localStorage.setItem('username', result.username);
                        localStorage.setItem('role', result.role);
                        window.location.href = result.role === 'admin' ? 'admin.html' : 'lobby.html';
                    } else {
                        showModal("🔒 登入失敗", result.detail || "帳號或密碼錯誤", false);
                    }
                } catch (err) {
                    showModal("⚠️ 連線失敗", "無法連接到伺服器，請檢查後端是否啟動。", false);
                }
            };
        }

        const regForm = document.getElementById('regForm');
        if (regForm) {
            regForm.onsubmit = async (e) => {
                e.preventDefault();
                const u = document.getElementById('regUsername').value;
                const e_mail = document.getElementById('regEmail').value;
                const p = document.getElementById('regPassword').value;

                try {
                    const res = await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: u, email: e_mail, password: p })
                    });
                    if (res.ok) {
                        showModal("🎉 註冊成功", "歡迎加入！請登入開始冒險。", true);
                        toggle('login');
                        document.getElementById('loginUser').value = u;
                    } else {
                        const errData = await res.json().catch(() => ({}));
                        showModal("❌ 註冊失敗", errData.detail || `伺服器錯誤 (${res.status})`, false);
                    }
                } catch (err) {
                    showModal("⚠️ 連線失敗", "伺服器連線失敗", false);
                }
            };
        }
    });

    function handleGoogleLogin() {
        try {
            if (typeof google === 'undefined') {
                showModal("⚠️ 載入中", "Google 服務載入中，請稍候...", false);
                return;
            }
            const client = google.accounts.oauth2.initTokenClient({
                client_id: "174084310746-5nhhblrrd4bii9nd6smf4oqb2a0j1ro1.apps.googleusercontent.com",
                scope: "openid email profile",
                callback: async (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        handleGoogleUser(tokenResponse.access_token);
                    }
                },
            });
            client.requestAccessToken();
        } catch (error) {
            console.error(error);
            showModal("❌ 錯誤", "無法啟動 Google 登入視窗", false);
        }
    }

    async function handleGoogleUser(accessToken) {
        try {
            const res = await fetch(`${API_URL}/auth/google_v2`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_token: accessToken }) 
            });

            const result = await res.json();
            if (res.ok) {
                localStorage.setItem('token', result.access_token);
                localStorage.setItem('username', result.username);
                localStorage.setItem('role', result.role);
                window.location.href = result.role === 'admin' ? 'admin.html' : 'lobby.html';
            } else {
                showModal("❌ 登入失敗", result.detail || "Google 驗證失敗", false);
            }
        } catch (err) {
            showModal("❌ 錯誤", "連線伺服器失敗", false);
        }
    }

    function toggle(mode) {
        const isLogin = mode === 'login';
        document.getElementById('loginForm').classList.toggle('active', isLogin);
        document.getElementById('regForm').classList.toggle('active', !isLogin);
        document.getElementById('loginTab').classList.toggle('active', isLogin);
        document.getElementById('regTab').classList.toggle('active', !isLogin);
    }

    function showModal(title, message, isSuccess = true) {
        const modal = document.getElementById('statusModal');
        const titleEl = document.getElementById('modalTitle');
        const msgEl = document.getElementById('modalMsg');
        const btnEl = document.getElementById('modalBtn');

        if (!modal || !titleEl || !msgEl) return;

        titleEl.innerText = title;
        msgEl.innerText = message;
        titleEl.style.color = isSuccess ? "var(--pixel-green)" : "var(--pixel-red)";
        
        if (btnEl) {
            btnEl.style.background = isSuccess ? "var(--main-yellow)" : "var(--pixel-red)";
            btnEl.style.color = isSuccess ? "#1e272e" : "#ffffff";
        }
        modal.style.display = 'flex';
    }

    function closeModal() {
        const modal = document.getElementById('statusModal');
        if (modal) modal.style.display = 'none';
    }
</script>
</body>
</html>
