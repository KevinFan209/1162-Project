<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeRich - 找回密碼</title>
    <style>
        :root {
            --primary-blue: #4facfe;
            --primary-yellow: #ffde59;
            --success-green: #00cdac;
            --bg-light: #f8fbff;
            --text-dark: #000000;
            --text-gray: #636e72;
            --error-red: #ff7675;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', '微軟正黑體', sans-serif; }
        
        body {
            background-color: var(--bg-light);
            height: 100%; display: flex; justify-content: center; align-items: center;
        }

        .container {
            background: white; width: 400px; padding: 40px; border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05); border: 1px solid #f1f2f6;
            text-align: center;
        }

        h2 { font-size: 2rem; font-weight: 900; margin-bottom: 10px; color: var(--text-dark); }
        p { color: var(--text-gray); font-weight: 700; font-size: 0.9rem; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 900; margin-bottom: 8px; margin-left: 5px; color: var(--text-dark); }
        input {
            width: 100%; padding: 15px 20px; border-radius: 15px; border: 2px solid #f1f2f6;
            background: #f8fafc; font-weight: 700; font-size: 1rem; transition: 0.3s;
        }
        input:focus { border-color: var(--primary-blue); outline: none; background: white; }

        .btn-3d {
            width: 100%; padding: 15px; border: none; border-radius: 15px;
            font-size: 1.1rem; font-weight: 900; cursor: pointer; transition: 0.2s;
            margin-top: 10px; display: flex; align-items: center; justify-content: center;
        }
        .btn-primary { background: var(--primary-blue); color: white; box-shadow: 0 6px 0 #3d8bcd; }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #3d8bcd; }
        
        .btn-success { background: var(--success-green); color: white; box-shadow: 0 6px 0 #00a88b; }
        .btn-success:active { transform: translateY(4px); box-shadow: 0 2px 0 #00a88b; }

        .back-link { display: block; margin-top: 25px; color: var(--text-gray); font-weight: 800; text-decoration: none; font-size: 0.9rem; }

        /* 🏆 UI 彈窗強制置頂樣式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; /* 初始隱藏 */
            justify-content: center; align-items: center; z-index: 9999;
            backdrop-filter: blur(4px);
        }
        .modal-card {
            background: white; padding: 40px; border-radius: 40px;
            width: 380px; text-align: center; transform: scale(0.9);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.open { display: flex; }
        .modal-overlay.open .modal-card { transform: scale(1); }
    </style>
</head>
<body>

<div class="container">
    <h2>找回密碼</h2>
    <p id="stepDesc">請輸入註冊時的電子信箱</p>

    <div id="step1">
        <div class="input-group">
            <label>電子信箱</label>
            <input type="email" id="emailInput" placeholder="example@gmail.com">
        </div>
        <button class="btn-3d btn-primary" onclick="handleSendOTP()">發送驗證碼</button>
    </div>

    <div id="step2" style="display: none;">
        <div class="input-group">
            <label>六位數驗證碼</label>
            <input type="text" id="otpInput" placeholder="請輸入驗證碼">
        </div>
        <div class="input-group">
            <label>設定新密碼</label>
            <input type="password" id="newPassword" placeholder="請輸入新密碼">
        </div>
        <button class="btn-3d btn-success" onclick="handleReset()">修改密碼</button>
    </div>

    <a href="login.html" class="back-link">← 返回登入</a>
</div>

<div id="statusModal" class="modal-overlay">
    <div class="modal-card">
        <h3 id="modalTitle" style="font-weight: 900; margin-bottom: 15px; font-size: 1.5rem;">提示</h3>
        <p id="modalMsg" style="margin-bottom: 25px; color: var(--text-gray); font-weight: 700; line-height: 1.5;"></p>
        <button id="modalBtn" class="btn-3d" style="background: var(--primary-yellow); box-shadow: 0 6px 0 #e6c543; color: #574b10;">確定</button>
    </div>
</div>

<script>
    const API_URL = window.location.protocol !== 'file:' ? window.location.origin : 'http://localhost:8000';

    function showModal(title, message, isSuccess = true, callback = null) {
        const modal = document.getElementById('statusModal');
        const titleEl = document.getElementById('modalTitle');
        const msgEl = document.getElementById('modalMsg');
        const btnEl = document.getElementById('modalBtn');

        titleEl.innerText = title;
        msgEl.innerHTML = message;
        titleEl.style.color = isSuccess ? "var(--success-green)" : "var(--error-red)";
        
        // 按鈕樣式設定
        if (isSuccess) {
            btnEl.style.background = "var(--primary-yellow)";
            btnEl.style.boxShadow = "0 6px 0 #e6c543";
            btnEl.style.color = "#574b10";
        } else {
            btnEl.style.background = "var(--error-red)";
            btnEl.style.boxShadow = "0 6px 0 #d63031";
            btnEl.style.color = "white";
        }

        modal.classList.add('open');

        // 🏆 關鍵：按下確定後的動作
        btnEl.onclick = function() {
            modal.classList.remove('open');
            if (callback) callback();
        };
    }

    async function handleSendOTP() {
        const email = document.getElementById('emailInput').value.trim();
        if(!email) {
            showModal("⚠️ 提示", "請輸入 Email 喔！", false);
            return;
        }

        try {
            const res = await fetch(`${API_URL}/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            if (res.ok) {
                showModal("📩 已發送", "驗證碼已發送到您的信箱，請查收！", true, () => {
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    document.getElementById('stepDesc').innerText = "請輸入驗證碼與新密碼";
                });
            } else {
                const err = await res.json();
                showModal("❌ 錯誤", err.detail || "找不到此 Email 帳號", false);
            }
        } catch (err) {
            showModal("⚠️ 失敗", "連線伺服器失敗", false);
        }
    }

    async function handleReset() {
        const email = document.getElementById('emailInput').value.trim();
        const code = document.getElementById('otpInput').value.trim();
        const new_password = document.getElementById('newPassword').value.trim();

        if(!code || !new_password) {
            showModal("⚠️ 提示", "驗證碼或新密碼不能為空喔！", false);
            return;
        }

        try {
            const res = await fetch(`${API_URL}/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code, new_password })
            });

            if (res.ok) {
                showModal("🎉 修改成功", "密碼已更新！點擊確定返回登入頁面。", true, () => {
                    window.location.href = 'login.html';
                });
            } else {
                const err = await res.json();
                showModal("❌ 驗證失敗", err.detail || "驗證碼錯誤", false);
            }
        } catch (err) {
            showModal("⚠️ 失敗", "連線伺服器失敗", false);
        }
    }
</script>
</body>
</html>
